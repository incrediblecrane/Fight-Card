      rows+'</div>';
  }).join('');
  var listSL=shoppingList(shopDates);
  // Ticked off by a key that does not move when the portions change; a tick
  // made for less than the row now asks for does not count (tickCovers). Each row is a checkbox to the keyboard and a screen reader; the x on your
  // own items sits beside it, not inside it.
  // What is still to find comes first and what is in the basket sinks under
  // a line of its own. Only a full draw moves a row: a tick changes the row in
  // place (shopcheck), so nothing slides out from under the finger.
  var toGet=listSL.filter(function(it){ return !shopTicked(it); }), inBasket=listSL.filter(shopTicked);
  var anyTicked=inBasket.length>0;
  var shopRow=function(it){
    var checked=shopTicked(it);
    return '<div class="shoprow"><div class="shop'+(checked?' checked':'')+'" role="checkbox" tabindex="0" aria-checked="'+checked+'" data-action="shopcheck" data-item="'+esc(it.key)+'">'+
      '<span class="box"></span><span class="shop-t">'+esc(it.label)+'</span></div>'+
      (it.extra?'<button class="shop-x" data-action="delextra" data-id="'+esc(it.extraId)+'" title="Remove" aria-label="Remove '+esc(it.label)+'">&times;</button>':'')+'</div>';
  };
  var shopRows=toGet.map(shopRow).join('')+
    (anyTicked?'<div class="shopbasket">In the basket ('+inBasket.length+')</div>'+inBasket.map(shopRow).join(''):'');
  // Only the meals the week shows: one whose day has gone is not in it.
  var plannedN=Object.create(null);
  planEntries(planDays).forEach(function(e){ plannedN[e.recipeId]=(plannedN[e.recipeId]||0)+1; });
  function recipeCard(r){
    // The ingredients are worked out only for a card that shows them.
    var rk='rec:'+r.id, open=!!expanded[rk];
    var f=open?recipePortions(r)/recipeBase(r):1;
    var ingList=open?recipeIngs(r).map(function(i){return '<li>'+esc(scaledIng(i,f))+'</li>';}).join(''):'';
    var planned=plannedN[r.id]||0;
    // What a tap adds: the batch on show when the card is open, and the
    // recipe's own size when it is closed and the scale cannot be seen.
    var addN=planAddPortions(r), added=planAdded&&planAdded.id===r.id?planAdded.text:'';
    var m=r.macros;
    // Closed by default: what you scan the list for is the name, the macros
    // and the add button. The batch and the method open on a tap.
    return '<div class="libitem"><div class="row"><div class="rtoggle" data-action="toggleex" data-id="'+esc(rk)+'" role="button" tabindex="0" aria-expanded="'+open+'">'+
        '<span class="tag">'+esc(r.tag||'Recipe')+'</span><span class="chev">'+(open?'&#9650; hide':'&#9660; ingredients')+'</span><h3>'+esc(r.title)+'</h3></div>'+
      '<button class="x" data-action="delrecipe" data-id="'+r.id+'" aria-label="Delete '+esc(r.title)+'">&times;</button></div>'+
      (m?macroLine(r):'')+
      (open?('<div class="portions"><span class="l">Portions</span>'+
        '<button data-action="portions" data-id="'+r.id+'" data-d="-1" aria-label="One portion less">-</button>'+
        '<span class="n">'+recipePortions(r)+'</span>'+
        '<button data-action="portions" data-id="'+r.id+'" data-d="1" aria-label="One portion more">+</button>'+
        (recipePortions(r)!==recipeBase(r)?'<button class="reset" data-action="portions" data-id="'+r.id+'" data-d="0">Reset to '+recipeBase(r)+'</button>':'')+
      '</div>'+
      (ingList?'<ul>'+ingList+'</ul>':'')+(r.instructions?'<p>'+esc(r.instructions)+'</p>':'')):'')+
      '<div class="recipe-controls">'+
        // Adding is a day, a slot and a button rather than a tick, because the
        // whole point is being able to add the same recipe more than once.
        // Each box is drawn holding only its choice, and gets the rest of the
        // week as it is reached (planOptsFill).
        '<select data-action="planday" data-id="'+esc(r.id)+'" data-lazy="1" aria-label="Day for '+esc(r.title)+'">'+planOpts('planday',r,false)+'</select>'+
        '<select data-action="planslot" data-id="'+esc(r.id)+'" data-lazy="1" aria-label="Meal slot for '+esc(r.title)+'">'+planOpts('planslot',r,false)+'</select>'+
        '<button class="addplan" data-action="addmeal" data-id="'+r.id+'">'+(addN===recipeBase(r)?'Add to plan':'Add '+addN+' portion'+(addN===1?'':'s'))+'</button>'+
        (added||planned?'<span class="planned" role="status">'+esc(added)+(added&&planned?' &middot; ':'')+(planned?planned+' in the week':'')+'</span>':'')+
      '</div></div>';
  }
  var prepItems=state.recipes.filter(function(r){return r.prep;}).map(recipeCard).join('');
  var recipeItems=state.recipes.filter(function(r){return !r.prep;}).map(recipeCard).join('');
  if(prepItems) prepItems='<div class="libgrid">'+prepItems+'</div>';
  if(recipeItems) recipeItems='<div class="libgrid">'+recipeItems+'</div>';

  // The list is what this tab is opened for in a shop, and it sits under the
  // week, so it is one tap away from the top.
  return '<button class="linklike shopjump" data-action="jump" data-to="shopping">Shopping list &darr;</button>'+
    '<p class="note" style="margin-top:0;">Macros are rough per-portion estimates from standard food composition values. Good enough to hit a protein target, not a measurement.</p>'+
    '<h2 class="sectiontitle">The week</h2><div class="weekbox cal">'+calRows+'</div>'+
    '<h2 class="sectiontitle" id="shopping">Shopping list</h2><div class="weekbox">'+
      '<div class="rangebar shoprange">'+
        [[3,'Next 3 days'],[7,'Whole week']].map(function(o){
          return '<button data-action="shoprange" data-n="'+o[0]+'"'+(shopRange===o[0]?' class="on"':'')+' aria-pressed="'+(shopRange===o[0])+'">'+o[1]+'</button>';
        }).join('')+'</div>'+
      (shopRows?'<div class="shoplist">'+shopRows+'</div>':'<div class="empty">Nothing planned in this stretch. Add a meal below, or add your own item.</div>')+
      '<div class="addshop"><input id="shop-add" autocomplete="off" maxlength="120" '+
          'placeholder="Milk, bin bags, coffee&hellip;" value="'+esc(shopDraft)+'">'+
        '<button data-action="addextra">Add</button></div>'+
      (anyTicked?CLEAR_TICKS:'')+
      (listSL.length?'<button class="clearbtn" data-action="clearweek">Clear '+
        (shopRange===7?'the week &amp; the ticks':'these '+shopRange+' days &amp; their ticks')+'</button>':'')+'</div>'+
    '<h2 class="sectiontitle">Meal prep</h2>'+
    '<p class="note" style="margin-top:0;">Batch-cook meals that hold up after a few days and a reheat. The portions here scale the ingredients so you can see the batch; what the shopping list buys is set on each meal in the week above. Cool them within about an hour, keep for two days, reheat once until steaming. Rice is the strict one: fridge it fast and eat it the next day. <a href="https://www.nhs.uk/live-well/eat-well/how-to-prepare-and-cook-food-safely/" target="_blank" rel="noopener">NHS food safety guidance</a>.</p>'+
    prepItems+
    '<h2 class="sectiontitle">Recipes</h2>'+(recipeItems||'<p class="note" style="margin-top:0;">No recipes yet.</p>')+
    '<div class="addform"><strong class="formhead">Add a recipe</strong>'+
      '<input id="rec-title" placeholder="Title" maxlength="80">'+
      '<label class="fieldlbl" for="rec-portions">Portions this makes</label>'+
      '<input id="rec-portions" type="number" inputmode="numeric" min="1" max="20" value="1">'+
      '<textarea id="rec-ing" placeholder="Ingredients, one per line, such as&#10;Beef mince (500g)&#10;2 onions&#10;1 tin chopped tomatoes"></textarea>'+
      '<textarea id="rec-inst" placeholder="Method / notes"></textarea>'+formNoteHtml('rec')+
      '<button data-action="addrecipe">Add recipe</button></div>';
  }

  // Built only when Progress is the tab shown: a render draws one view.
  function progressView(){
  var logs=state.workoutLogs;

  // ---- progress: charts first, raw rows underneath -----------------------
  var rangeKeys=lastNKeys(progRange);
  var inRange=function(d){ return rangeKeys.indexOf(d)>-1; };

  // Per-exercise history, newest session first.
  // Keyed by exercise id, which a stored log can hold as any name at all.
  var histo=Object.create(null), seq=0;
  logs.forEach(function(l){ Object.keys(l.logs).forEach(function(exId){
    (l.logs[exId]||[]).forEach(function(s){
      if(!histo[exId]) histo[exId]=[];
      /* Copy the whole set, not a hand-written list of fields. Naming them
         meant a prep step arrived here without its option, its level or the
         fact that it was sets at a weight, so a warm-up read "10 min" with no
         mention of what it was, and a 40kg x 5 ramp read as ten minutes. */
      var h={}; Object.keys(s).forEach(function(k){ h[k]=s[k]; });
      // _seq keeps the order sets were logged in, so "newest" is the last
      // set of the newest day rather than the first.
      h.date=l.date; h._seq=seq++; histo[exId].push(h);
    });
  }); });
  // Newest date, not the date of whichever log was saved last: a backfilled
  // log lands on the end of the list with an older date.
  // Worked out once an exercise, not once a comparison of the sort.
  var newestOf=Object.create(null);
  Object.keys(histo).forEach(function(id){ newestOf[id]=histo[id].reduce(function(a,h){ return h.date>a?h.date:a; },''); });
  // A log saved before empty lists were dropped can hold an exercise with no
  // sets, which has no history to show.
  var exIds=Object.keys(histo).filter(function(id){ return histo[id].length; })
    .sort(function(a,b){ var da=newestOf[a], db=newestOf[b]; return da<db?1:(da>db?-1:0); });

  var isSet=countsAsSet;
  var totalSets=0, totalVolume=0;
  logs.forEach(function(l){ Object.keys(l.logs).forEach(function(k){
    l.logs[k].forEach(function(st){ if(isSet(k,st)) totalSets++; if(movesWeight(k,st)) totalVolume+=volumeOf(k,st); });
  }); });

  // Sessions and sets per day across the chosen range.
  var setsByDay={}, sessionsByDay={}, volumeByDay={};
  logs.forEach(function(l){
    if(!inRange(l.date)) return;
    sessionsByDay[l.date]=(sessionsByDay[l.date]||0)+1;
    Object.keys(l.logs).forEach(function(k){
        l.logs[k].forEach(function(st){
        if(isSet(k,st)) setsByDay[l.date]=(setsByDay[l.date]||0)+1;
        if(movesWeight(k,st)) volumeByDay[l.date]=(volumeByDay[l.date]||0)+volumeOf(k,st);
      });
    });
  });
  // A day is trained when it has sets, a session, or was ticked as trained
  // from Today with nothing logged behind it, as the week target counts it.
  function trainedOn(k){ var e=state.days[k]; return !!(setsByDay[k]||sessionsByDay[k]||(e&&e.workout&&e.workout.done)); }
  var trainRows=rangeKeys.map(function(k){
    var n=setsByDay[k]||0, sess=sessionsByDay[k]||0, e=state.days[k], did=!n&&trainedOn(k), ty=e&&e.workout&&e.workout.type;
    var tip=rowDate(k)+': '+(n?n+' set'+(n===1?'':'s')+(sess?' over '+sess+' session'+(sess===1?'':'s'):''):
      did?'trained'+(ty?' ('+ty+')':'')+', no sets logged':(e&&e.rest?'rest day':'nothing logged'));
    return {k:shortDay(k), v:n, lbl:n+' sets', tip:tip, state:did?'done':(!n&&e&&e.rest)?'mute':null};
  });
  var trainedDays=rangeKeys.filter(trainedOn).length;

  var volRows=rangeKeys.map(function(k){
    var v=Math.round(volumeByDay[k]||0);
    return {k:shortDay(k), v:v, lbl:v+'kg', tip:rowDate(k)+': '+(v?v+'kg lifted':'no loaded work')};
  });
  var rangeVolume=volRows.reduce(function(a,r){return a+r.v;},0);

  // Water, in the same 0.25L units the tracker stores.
  var waterRows=rangeKeys.map(function(k){
    var e=state.days[k], u=e?e.water:0;
    var hit=u>=state.waterTarget;
    return {k:shortDay(k), v:u, lbl:litres(u), tip:rowDate(k)+': '+litres(u)+(hit?' (target hit)':' of '+litres(state.waterTarget))};
  });
  var waterHits=waterRows.filter(function(r){return r.v>=state.waterTarget;}).length;
  // Average over every day since tracking started, not only the days water
  // got logged: dividing by the days you remembered flatters the number, and
  // the point of the figure is to be honest about the habit.
  var trackedKeys=Object.keys(state.days).filter(function(k){ return !isBlankDay(state.days[k]); }).sort();
  var firstKey=trackedKeys.length?trackedKeys[0]:realToday();
  function waterAvgOver(keys){
    var live=keys.filter(function(k){ return k>=firstKey; });
    if(!live.length) return null;
    var sum=0; live.forEach(function(k){ var e=state.days[k]; sum+=e?e.water:0; });
    return {avg:sum/live.length, days:live.length};
  }
  // All time is the days held, summed, over every day from the first to
  // today, counted by date: a list of every day walked one at a time had to
  // stop somewhere, and an old first day then left out the recent ones.
  function allTimeAvg(){
    var today=realToday(), sum=0;
    Object.keys(state.days).forEach(function(k){ if(k>=firstKey && k<=today) sum+=(state.days[k]||{}).water||0; });
    var n=Math.round((new Date(today+'T12:00:00')-new Date(firstKey+'T12:00:00'))/864e5)+1;
    return n>0?{avg:sum/n, days:n}:null;
  }
  var waterAvg=(waterAvgOver(rangeKeys)||{avg:0}).avg;
  var waterPeriods=[{lbl:'7 days',keys:lastNKeys(7)},
                    {lbl:'30 days',keys:lastNKeys(30)},
                    {lbl:'all time',all:true}];
  // Nothing tracked yet is said as that, not as 0L over the one day of today.
  var waterAvgRow='<div class="stat-row three">'+waterPeriods.map(function(p){
    var r=trackedKeys.length?(p.all?allTimeAvg():waterAvgOver(p.keys)):null;
    return '<div class="stat-tile"><div class="n">'+(r?litres(Math.round(r.avg*100)/100)+'<small>/day</small>':'&mdash;')+'</div>'+
      '<div class="l">'+p.lbl+'</div>'+
      '<div class="sub-l">'+(r?'over '+r.days+' day'+(r.days===1?'':'s'):'no days tracked')+'</div></div>';
  }).join('')+'</div>';

  // Clean days. A day only counts once it has been touched, so an untouched
  // day reads as "not logged" rather than as a relapse.
  var cleanStrip=rangeKeys.map(function(k){
    var e=state.days[k], cls='', lab=rowDate(k)+': not logged';
    if(e && e.touched){
      if(e.alcohol===0 && e.smoking===0 && e.weed===0){ cls=' class="clean"'; lab=rowDate(k)+': clean'; }
      else { cls=' class="used"'; lab=rowDate(k)+': alcohol '+e.alcohol+', smoking '+e.smoking+', weed '+e.weed; }
    }
    return '<i'+cls+' role="listitem" aria-label="'+esc(lab)+'" title="'+esc(lab)+'"></i>';
  }).join('');
  var cleanCount=rangeKeys.filter(function(k){ var e=state.days[k]; return e&&e.touched&&e.alcohol===0&&e.smoking===0&&e.weed===0; }).length;
  var loggedCount=rangeKeys.filter(function(k){ var e=state.days[k]; return e&&e.touched; }).length;

  // Newest first within a day too (ids are made from the time), so the visit
  // just logged leads the list; the chart reads them back in time order.
  var saunaAll=state.saunaSessions.slice().sort(byDateId).reverse();
  // The chart follows the range like every other chart; the list under it is

  var saunaRows=saunaAll.filter(function(x){ return inRange(x.date); }).reverse().map(function(x){

            tip:rowDate(x.date)+': '+saunaTotal(x)+' min'+(x.temp?' at '+x.temp+'°C':'')+' · '+saunaStintText(x)};

  var pStreaks=computeStreaks();
  var rangeBar='<div class="rangebar">'+[14,30,90].map(function(n){

  var statRow=

  // Newest first within a day too (ids are made from the time), or a day
  // with more than six sessions would leave out the one just finished.
  // Six unless all are asked for, so an older one can still be removed.
  var recentAll=logs.slice().sort(byDateId).reverse(), recentShowAll=!!expanded['list:recent'];
  var recent=recentShowAll?recentAll:recentAll.slice(0,6);
  var recentHtml=recent.map(function(l){
    var setCount=0; Object.keys(l.logs).forEach(function(k){ l.logs[k].forEach(function(st){ if(isSet(k,st)) setCount++; }); });
    var ss=supersetSummary(l);
    return swipeRow(l.id,'dellog',

  var exList=exIds.map(function(exId){
    var def=exDef(exId)||{name:exId,type:'reps'};
    var hist=histo[exId].slice().sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:(b._seq-a._seq));});
    var last=hist.filter(function(x){ return !x.wu; })[0]||hist[0]; var isOpen=!!expanded[exId];
    var detail='';
    if(isOpen){
      // One point per session: the best set of that day, so the line tracks
      // progress rather than jumping around within a session.
      var byDate={};
      // A warm-up can hold two different kinds of set: minutes on a bike, and
      // reps at a weight when it was ramping up on the first lift. Plotting
      // both on one axis would be a line with two units on it, so the chart

      hist.forEach(function(h){

      var byReps=def.type==='load' && !hist.some(function(h){ return h.w>0 && !h.wu; });
      var kind=byReps?'reps':def.type, u=bestUnit(def.type,def), unit=byReps?' reps':(kind==='load'&&perImplement(exId))?' kg ea':(/^(reps|min|rounds)$/.test(u)?' '+u:u);
      // A lift done some days with no weight has nothing to say in kg on

      var bare=0;
      if(kind==='load') dates=dates.filter(function(dt){ var b=bestSet(kind,byDate[dt]); if(b.w>0) return true; bare++; return false; });
      var yr=dates.length>1 && (new Date(dates[dates.length-1]+'T12:00:00')-new Date(dates[0]+'T12:00:00'))>365*86400000;
      // A lift with a weight is charted as its estimated 1RM, so reps climbing

      var est=kind==='load';
      var pts=dates.map(function(dt){
        var b=est?bestE1rm(byDate[dt]):bestSet(kind,byDate[dt]), v=est?e1rm(b):bestValue(kind,b);
        return {k:shortDay(dt,yr), v:v, lbl:v+unit,
                tip:rowDate(dt)+': best set '+setLabel(def,b)+' of '+byDate[dt].length+' set'+(byDate[dt].length===1?'':'s')+(est?', est. 1RM '+v+unit:'')};
      });
      // Can be empty now: a warm-up whose every entry was a set at a weight

      var pb=pts.length?pts.reduce(function(a,p){return p.v>a.v?p:a;},pts[0]):null;
      var delta=pts.length>1?pts[pts.length-1].v-pts[0].v:0;
      var deltaTxt=pts.length>1?((delta>0?'+':'')+Math.round(delta*10)/10+unit+' since '+pts[0].k):'first session';
      var pbLabel=est?'Estimated 1RM':'Best set';
      var heavy=est&&dates.length?dates.reduce(function(a,dt){ return Math.max(a,bestSet(kind,byDate[dt]).w); },0):0, rp=est?repPb(hist):null;
      // One date per session, its sets under it in the order they were done,

      var allK='all:'+exId, showAll=!!expanded[allK], daysShown=showAll?byDay:byDay.slice(0,4);

      var plot=thinPoints(pts,LINE_MAX);
      detail='<div class="exdetail">'+
        lineChart(plot,{kind:'ex',title:pbLabel+' by session',sub:dates.length+' session'+(dates.length===1?'':'s')+(bare?', '+bare+' without a weight':''),

                       empty:(!pts.length&&hist.length)

                         : 'Logged once so far. Log it again to see the trend.'})+
        '<div class="pbrow">'+
          (pb?('<span>'+(est?'Best est. 1RM':'Personal best')+' <b>'+esc(pb.lbl)+'</b></span>'):'')+

          (pts.length>1?('<span>Change <b>'+esc(deltaTxt)+'</b></span>'):'')+
          '<span>Sets <b>'+hist.filter(function(x){ return !x.wu; }).length+'</b></span></div>'+

    }
    return '<div class="exrow"><div class="top" data-action="toggleex" data-id="'+esc(exId)+'" role="button" tabindex="0" aria-expanded="'+isOpen+'"><h3>'+esc(def.name)+'</h3>'+
      '<span class="last">'+esc(setLabel(def,last))+' &middot; '+timeTag(last.date)+'<span class="chev">'+(isOpen?'&#9650;':'&#9660;')+'</span></span></div>'+

  }).join('') || '<p class="note" style="margin-top:0;">Log a workout to start building exercise history.</p>';

  var saunaShowAll=!!expanded['list:sauna'];
  var saunaHtml=(saunaShowAll?saunaAll:saunaAll.slice(0,6)).map(function(x){
    return swipeRow(x.id,'delsauna',
      '<span>'+saunaTotal(x)+' min'+((x.stints&&x.stints.length>1)?(' &middot; '+esc(saunaStintText(x))):(' &middot; '+esc(x.position||'')))+

  saunaHtml+=showMore('list:sauna',saunaAll.length,saunaShowAll,'visits');
  function showMore(key,n,all,what){
    return n>6?'<button class="showall" data-action="toggleex" data-id="'+key+'" aria-expanded="'+all+'">'+

  // Tonnes past a thousand like the tile, and no locale's thousands mark,

  // What the muted columns under Sets per day are, when there are any.
  function legendOf(rows){

  }

  // Swipe left to reveal Remove. Two deliberate actions, so a stray swipe while

  return statRow + rangeBar +
    '<h2 class="sectiontitle">Training</h2>'+

    (saunaAll.length?barChart(saunaRows,{title:'Minutes per session',sub:saunaRows.length+' in '+progRange+' days · '+saunaRows.reduce(function(a,r){ return minsSum(a,r.v); },0)+' min',

  }

  var sessionHtml='';
  if(viewingSession && state.activeSession){
    var sess=state.activeSession;
    var w2=workoutOf(sess);
    var n=sess.exIds.length;
    if(slide>=n) slide=Math.max(0,n-1);
    var logged=countedSets(sess.logs);
    // Once the slide's target is met, moving on is the next thing to press:

    var storyNav=function(id,met){ var go=met?' go':''; return '<div class="storynav">'+
      '<button data-action="prevslide"'+(slide===0?' disabled':'')+'>&larr; Prev</button>'+
      (slide<n-1?'<button class="skip" data-action="skipex" data-ex="'+esc(id)+'">Skip</button>':'')+
      (slide<n-1?'<button class="next'+go+'" data-action="nextslide">Next &rarr;</button>':'<button class="finish'+go+'" data-action="finishworkout">Finish ('+logged+' set'+(logged===1?'':'s')+')</button>')+
      '</div>'; };
    var storyBar=function(){ return '<div class="story-bar">'+sess.exIds.map(function(id,i){
      return '<i class="'+(i===slide?'now':(slideLogged(sess,id)?'done':''))+'"><b></b></i>'; }).join('')+'</div>'; };
    var storyHead='<div class="story-head"><h2 class="story-title">'+esc((w2?w2.title:'Workout')+sessionFor(sess))+' &middot; '+(slide+1)+'/'+n+'</h2><button data-action="cancelsession">Back, keep progress</button></div>';

    if(addingExercise){
      // The results live in their own container so typing can replace just
      // them. Re-rendering the whole view on each keystroke destroyed the
      // search box mid-type, which dropped every letter after the first.
      sessionHtml='<div class="story"><div class="story-head"><h2 class="story-title">Add an exercise</h2><button data-action="closepicker">Close</button></div>'+
        '<div class="picker"><input id="ex-search" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" '+
          'placeholder="Search exercises" aria-describedby="ex-search-hint" value="'+esc(exSearch)+'">'+
          '<p class="pickhint" id="ex-search-hint">By name, area or category, like &#39;grip&#39; or &#39;dead hang&#39;.</p>'+
          '<div id="pick-results">'+pickerResults()+'</div></div></div>';
    } else if(n===0){
      sessionHtml='<div class="story"><div class="story-head"><h2 class="story-title">'+esc((w2?w2.title:'Workout')+sessionFor(sess))+'</h2><button data-action="cancelsession">Back</button></div>'+
        '<div class="slide"><p class="note" style="margin-top:0;">No exercises in this session. Add one to get going.</p>'+
        '<button class="addex-btn" data-action="openpicker">+ Add exercise</button></div></div>';
    } else if(isSuperset(sess.exIds[slide])){
      var ssId=sess.exIds[slide];
      var members=supersetMembers(ssId);
      var ssTgt=sess.targets[ssId]||{sets:3,reps:'rounds'};
      var roundsDone=supersetRounds(ssId), ssMet=ssTgt.sets>0 && roundsDone>=ssTgt.sets;

      var memberRows=members.map(function(m){
        var d=exDef(m); if(!d) return '';
        var mSets=sess.logs[m]||[];
        var mPer=perImplement(m);
        var mChips=mSets.map(function(x){ return '<span class="setchip">'+esc(setLabel(d,x))+'</span>'; }).join('');
        var mVal=d.type==='load'?'reps':d.type==='time'?(d.unit==='min'?'mins':'secs'):d.type==='distance'?'metres':d.type==='cardio'?'mins':repsWord(d);
        // Prefilled the way a lift slide is, so the next round is one tap.
        var mPre=/^(load|reps|time|distance|cardio)$/.test(d.type)?prefillFor(m,sess,sess.targets[m]):null;
        // A cardio member needs its machine and effort pickers here too: logSet

        if(d.type==='cardio'){

            (d.interval?(cardioSelect('log-work-'+m,'Work effort',EFFORT_LEVELS,mPre&&mPre.work,d.name+' work effort')+

        return '<div class="ssrow">'+
          '<div class="ssrow-head"><span class="ssn">'+esc(d.name)+'</span>'+

          (mChips?'<div class="setchips">'+mChips+'<button class="chipundo" data-action="undoset" data-ex="'+m+'" data-ss="'+ssId+'" aria-label="Undo last '+mName+' set">Undo</button></div>':'')+mCardio+
          '<div class="logrow">'+
            (d.type==='load'?fieldBox('<input id="log-w-'+m+'" type="text" inputmode="decimal" placeholder="'+(mPer?'kg each':'kg')+'" aria-label="'+mName+' weight, '+(mPer?'kg each':'kg')+'"'+(mPre&&mPre.w?' value="'+mPre.w+'"':'')+'>',mPer?'kg each':'kg'):'')+
            fieldBox('<input id="log-v-'+m+'" type="text" inputmode="decimal" placeholder="'+mVal+'" aria-label="'+mName+' '+mVal+'"'+(mPre&&mPre.v?' value="'+mPre.v+'"':'')+'>',mVal)+

    } else if(!exDef(sess.exIds[slide])){

    } else {

      var met=tgt.sets>0 && setsDone>=tgt.sets;

      // of PBs, set counts, last time and the prefill.

/* Fixed to the bottom of the screen on every view, so the offer is where the
   removal happened rather than at the top of Progress. An offer whose item is
   already back is not shown; applyUndo refuses it anyway.
   After UNDO_SHOW it shrinks to one labelled button in the corner rather than going:
   the undo stays good for UNDO_TTL, and a bar of words over the bottom of the
   page for ten minutes is in the way. Not a live region: undoSay announces it
   once, and this is drawn again on every render. */
// The shrunk offer has no room for its message, so its button says what kind
// of thing it undoes, and its name says the rest.
var UNDO_WHAT={week:'clear',session:'session'};
function undoToast(){
  var u=readUndo();
  if(!u || undoMoot(u)) return '';
  var msg=u.text||'Removed '+u.label;
  return '<div class="undo-bar'+(Date.now()-u.at>=UNDO_SHOW||undoMini===u.at?' mini':'')+'"><span class="msg">'+esc(msg)+'</span>'+
    '<span class="btns"><button data-action="undo" aria-label="Undo: '+esc(msg)+'">Undo<span class="what"> '+(UNDO_WHAT[u.kind]||'remove')+'</span></button>'+
    '<button class="ghost" data-action="dismissundo">Dismiss</button></span></div>';
}
// The page keeps room below its end for the toast, whatever height its words
// wrap to, so the last controls can always be scrolled clear of it. And the
// full toast is shrunk when its time is up without drawing the page again.
function undoFit(){
  var app=document.getElementById('app'); if(!app) return;
  // The same for the store's bar at the top: the page starts below it, so it
  // covers nothing until the page is scrolled, and the backfill bar sticks
  // under it rather than behind it.
  var sb=app.querySelector('.statusbar');
  app.style.setProperty('--status-h',sb?Math.ceil(sb.getBoundingClientRect().bottom)+'px':'0px');
  var bar=app.querySelector('.undo-bar'), u=bar&&readUndo();
  if(undoHide){ clearTimeout(undoHide); undoHide=null; }
  if(u && !bar.classList.contains('mini')) undoHide=setTimeout(function(){
    undoHide=null; var b=document.querySelector('#app .undo-bar'); if(b){ b.classList.add('mini'); undoFit(); }
  },Math.max(0,UNDO_SHOW-(Date.now()-u.at)));
  app.style.setProperty('--undo-h',bar?bar.offsetHeight+'px':'0px');
}

/* Matching is forgiving about a trailing plural, because "shrugs" and "dips"
   are what a person actually types and neither matched the singular name. */
/* Every word has to land somewhere, rather than the whole phrase having to sit
   in one place. "reverse fly" used to find nothing at all while "Reverse cable
   fly" was sitting in the list, because the two words are not next to each
   other in the name. Something you cannot find may as well not be there. */
/* Hyphens, spaces and apostrophes are dropped on both sides, so "pushups",
   "push ups" and "push-up" all find Push-up and "farmers" finds Farmer's carry.
   A word has to start where the term starts (or hold it whole, from four
   letters), so "rows" no longer lands on the throws and "abs" no longer finds
   a cable fly or the jab drill. The id and a few everyday names count too:
   rdl, ohp, swim, jump rope, the machines a gym actually has. */
var PICK_ALIAS={dl_rdl:'rdl',press_ohp:'ohp military shoulder press',kb_tgu:'tgu',pushup:'press up',
  swim_warmup:'swim pool',swim_drill:'swim pool',swim_main:'swim pool',swim_cooldown:'swim pool',
  skipping:'jump rope',rowerg:'rower erg',briskwalkjog:'run walking',sprint:'run',
  cardio_gym_warmup:'bike cycle treadmill rower run cardio',cardio_gym_intervals:'bike cycle treadmill rower run cardio',
  cardio_gym_steady:'bike cycle treadmill rower run cardio',shadowbox:'boxing'};
var PICK_SYN={ab:['core'],abs:['core'],crunch:['core'],situp:['core'],running:['run'],jogging:['run'],
  jog:['run'],cycling:['cycle'],rowing:['rower'],yoga:['flexibility','mobility','stretch'],stretching:['stretch']};
function pickWords(s){
  var out=[];
  String(s||'').toLowerCase().replace(/['’]/g,'').split(/[^a-z0-9-]+/).forEach(function(w){
    if(!w) return; var whole=w.replace(/-/g,''); if(whole) out.push(whole);
    if(w.indexOf('-')>-1) w.split('-').forEach(function(p){ if(p) out.push(p); });
  });
  return out;
}
function pickerMatches(q){
  var already=(state.activeSession&&state.activeSession.exIds)||[];
  function forms(t){
    var f=[t]; if(t.length>2 && t.charAt(t.length-1)==='s') f.push(t.slice(0,-1));
    f.slice().forEach(function(x){ (PICK_SYN[x]||[]).forEach(function(y){ if(f.indexOf(y)<0) f.push(y); }); });
    return f;
  }
  function has(words,fs){
    return fs.some(function(t){ return words.some(function(w){
      return w.indexOf(t)===0 || (t.length>3 && w.indexOf(t)>-1); }); });
  }
  // "push-up" as typed is one word; "push up" is two, each landing on a part.
  var terms=pickWords(q.replace(/-/g,'')).map(forms);
  return EX.filter(function(e){
    if(already.indexOf(e.id)>-1) return false;
    var words=pickWords([e.name,e.cat,e.area,e.id.replace(/_/g,' '),e.id,PICK_ALIAS[e.id]||''].join(' '));
    return terms.every(function(fs){ return has(words,fs); });
  });
}

          '<button data-action="addex" data-id="'+e.id+'" aria-label="Add '+esc(e.name)+'">Add</button>'+

      '</div>';
    }).join('');
    return '<div class="pickgroup"><div class="pickgroup-title">'+esc(area)+'</div>'+rowsHtml+'</div>';
  }).join('') || '<p class="note" style="margin-top:0;">No matches.</p>';
}

/* Replacing the page takes focus off whatever had it, and that blur can fire
   a change or a focusout whose handler renders again in the middle of this
   one, which throws. A render asked for during one runs once it is done. */
var rendering=false, renderAgain=false, drawnDay='';
function render(){
  if(rendering){ renderAgain=true; return; }
  rendering=true; renderAgain=false; renderOnUp=false;
  try{ drawPage(); } finally { rendering=false; }
  if(renderAgain) render();
}
function drawPage(){
  // The first draw of a new day starts on Today, as a load would (see tab).
  if(drawnDay && drawnDay!==realToday() && !(viewingSession && state.activeSession)) tab='today';
  drawnDay=realToday();
  syncUi();
  var app=document.getElementById('app');
  if(!app) return;
  // Replacing innerHTML throws away whatever field was being typed into. Note
  // what had focus and where the caret was, and put it back afterwards, so a
  // save landing mid-keystroke cannot interrupt typing.
  var act=document.activeElement, keep=null, keepCtl=null;
  if(act && act.id && app.contains(act) && /^(INPUT|TEXTAREA|SELECT)$/.test(act.tagName)){
    keep={id:act.id, start:null, end:null, top:topOf(act)};
    try{ keep.start=act.selectionStart; keep.end=act.selectionEnd; }catch(err){}
  }
  // A button worked from the keyboard, or by a screen reader, gets it back
  // too: it used to drop to the top of the page after every press.
  else if(act && app.contains(act) && isCtl(act)) keepCtl=ctlNear(app,act);
  // Nor must it throw away what was typed but not yet read: a field whose value
  // is not the one it was drawn with is put back, unless a tap just used it.
  var typed={};
  BIG_BOXES.forEach(function(id){ var el=document.getElementById(id);
    if(clearOnRender[id]) delete bigBox[id]; else if(el && app.contains(el)) bigBox[id]=el; });
  [].forEach.call(app.querySelectorAll('input[id],textarea[id],select[id]'),function(el){
    if(clearOnRender[el.id] || BIG_BOXES.indexOf(el.id)>-1) return;
    // A select drawn with no option marked shows its first one.
    var dflt=-1; [].forEach.call(el.options||[],function(o,i){ if(o.defaultSelected) dflt=i; });
    var dirty=el.tagName==='SELECT'?el.selectedIndex!==(dflt<0&&el.options.length?0:dflt)
      :(el.type==='checkbox'||el.type==='radio')?el.checked!==el.defaultChecked:el.value!==el.defaultValue;
    if(dirty) typed[el.id]={tag:el.tagName, type:el.type, value:el.value, checked:el.checked};
  });
  clearOnRender={};
  var hold=inView; inView=null;
  drawKeeping(app,bodyContent());
  // What was typed and left: drawn back over whatever the box was drawn with.
  Object.keys(drafts).forEach(function(id){
    var el=document.getElementById(id), d=drafts[id];
    if(!el || !app.contains(el) || !draftable(el)) return;
    if(d.s!==draftSess(id)){ delete drafts[id]; return; }
    if(el.value!==d.v) el.value=d.v;
  });
  if(hold) keepInView(app,hold);
  BIG_BOXES.forEach(function(id){
    var el=document.getElementById(id), was=bigBox[id];
    if(!el) return;
    if(was && was!==el){ el.parentNode.replaceChild(was,el); el=was; }
    else if(!was && id==='export-json') exportShown=null;
    bigBox[id]=el;
    if(id!=='export-json') return;
    if(exportDirty||exportShown===null&&!exportSnap){ exportSnap=exportText(state); exportDirty=false; }
    if(exportShown!==exportSnap){ el.value=exportSnap; exportShown=exportSnap; }
  });
  Object.keys(typed).forEach(function(id){

    // redrawing under the caret sent the next digits to the wrong segment.

// Inline script text ends at the first closing script tag, and an HTML comment
// opener followed later by an opening script tag makes the parser swallow the

// same two sequences with the < written as \x3C, which JS strings and regexes
// read as the same text.
