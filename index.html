/* A superset in a session is an INSTANCE: ss1, ss2. The id has to be unique per
   instance because a session keys targets and logs by id, and two supersets in
   one session hold different exercises. */
function isSuperset(id){ return /^ss\d+$/.test(id); }
function exDef(id){
  if(isSuperset(id)) id='superset';
  for(var i=0;i<EX.length;i++){ if(EX[i].id===id) return EX[i]; }
  return null;
}
/* A superset holds its exercises and its own round count. It used to be a bare
   array, and rounds were inferred from how many sets the members had, which
   counted sets logged on an exercise's OWN slide as rounds of the superset. An
   in-flight session saved under the old shape is read here rather than
   migrated, because it lasts hours, not days. */
function supersetBox(ssId){
  var sess=state.activeSession;
  var v=sess && sess.supersets && sess.supersets[ssId];
  if(!v) return null;
  if(Array.isArray(v)){ v=sess.supersets[ssId]={ex:v, rounds:0}; }
  if(!v.ex) v.ex=[];
  return v;
}
function supersetMembers(ssId){ var b=supersetBox(ssId); return b?b.ex:[]; }
function supersetRounds(ssId){ var b=supersetBox(ssId); return b?(b.rounds||0):0; }
/* A superset logs into its member exercises, not into itself, so its slide is
   "done" when any member has a set. Everything downstream -- history, PBs,
   volume -- then reads exactly as if the sets had been logged one at a time. */
function slideLogged(sess,id){
  if(!isSuperset(id)) return (sess.logs[id]||[]).length>0;
  return supersetMembers(id).some(function(m){ return (sess.logs[m]||[]).length>0; });
}

function pad(n){return n<10?'0'+n:''+n;}
function dateKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
// realToday() is the wall clock. activeDate() is the day being LOGGED TO,
// which the date picker can move into the past. Every read of "now" uses the
// first; every write uses the second. Both used to be one function, so a date
// picker would have silently redirected all seven writers at once with
// nothing on screen looking different.
function realToday(){return dateKey(new Date());}
var BACKFILL_DAYS=14;
function minLogDate(){ var d=new Date(); d.setDate(d.getDate()-(BACKFILL_DAYS-1)); return dateKey(d); }
// Saving without db republishes the whole document and EVERY open view reloads
// onto it, so anything held only in a variable is wiped on every single tap.
// That is why the tab and slide live in localStorage (see readUi). The log date
// needs the opposite pair of properties: survive a save, but NOT survive
// closing the app. That is exactly sessionStorage, which the reload keeps and
// closing the tab clears.
// It deliberately does not go in state: a backdate is this device's editing
// position, not part of the record, and it must never sync to another device.
// It is kept as {k, on}: the day picked and the day it was picked on. A day
// picked yesterday is not today's choice, however long the tab stays open.
var LOGDATE_KEY='fc.logDate', logDateOn;
function readStoredDate(){
  var v=null; try{ v=sessionStorage.getItem(LOGDATE_KEY); }catch(e){}
  if(!v) return null;
  // Kept before it carried its day: as picked today, so nothing is lost.
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return {k:v, on:realToday()};
  try{ v=JSON.parse(v); }catch(e){ return null; }
  return v && typeof v.k==='string' && typeof v.on==='string' ? v : null;
}
function writeStoredDate(v){ try{ if(v) sessionStorage.setItem(LOGDATE_KEY,JSON.stringify(v)); else sessionStorage.removeItem(LOGDATE_KEY); }catch(e){} }
function inLogWindow(v){ return /^\d{4}-\d{2}-\d{2}$/.test(v||'') && v>=minLogDate() && v<=realToday(); }
// '' means today mode: follow the clock. It must not hold today's date as a
// string, or a tab left open past midnight keeps logging to yesterday.
function setLogDate(v){
  logDate=(v && inLogWindow(v) && v<realToday()) ? v : ''; logDateOn=logDate?realToday():'';
  writeStoredDate(logDate?{k:logDate, on:logDateOn}:null);
  return activeDate();
}
function activeDate(){
  if(logDate===undefined){ var sd=readStoredDate(); logDate=sd?sd.k:''; logDateOn=sd?sd.on:''; }
  // Re-check the bounds every time: a tab left open for weeks must not keep
  // writing to a day that has fallen outside the backfill window, nor one
  // left open overnight to the day picked yesterday.
  if(logDate && (logDate>=realToday() || logDate<minLogDate() || logDateOn!==realToday())) setLogDate('');
  return logDate||realToday();
}
function backfilling(){ return activeDate()!==realToday(); }
// Card copy has to name the day it is actually writing to.
function dayWord(){ return backfilling()?('on '+prettyKey(activeDate())):'today'; }
function prettyKey(k){ return rowDate(k); }
// The one way a date is written in rows, tables, tips and the undo offer:
// "Tue 29 Sep", with the year only when it is not this one. ISO stays for export.
var MONTH_NAME=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function rowDate(k){ var d=new Date(k+'T12:00:00'); if(isNaN(d.getTime())) return String(k||'');
  return WEEKDAY_NAME[d.getDay()]+' '+d.getDate()+' '+MONTH_NAME[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''); }
function timeTag(k){ return '<time datetime="'+esc(k)+'">'+esc(rowDate(k))+'</time>'; }
// Over the target is the target beaten, not a sum gone wrong.
function weekLine(n,tgt){ return n>=tgt ? (n+' session'+(n===1?'':'s')+' in the last 7 days, target '+tgt+' hit')

function prettyDate(){var d=new Date();return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});}
// Quotes too: every use of this is interpolated into HTML, and some of those
// are attribute values, where a typed 6" shelf would otherwise end the
// attribute early and mangle the rest of the tag.
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
// Rounded to hundredths, so 1.1 and 1.3 read as 2.4 and not 2.4000000000000004.
function minsSum(a,b){ return Math.round((a+b)*100)/100; }
function saunaTotal(x){
  if(x.stints && x.stints.length) return x.stints.reduce(function(a,st){ return minsSum(a,st.mins||0); },0);
  return x.mins||0;
}
/* "15 min Top + 10 min Bottom", or just "15 min Top" when there is one stint,
   so a simple session does not read like a compound one. */
/* Number boxes are plain text boxes read here. A number input drops a comma
   decimal, so "22,5" was logged as 225; anything that is not a number now is
   refused and the box marked, rather than guessed at. "1,000" is refused too:
   read as a decimal it would log a 1000m row as 1m. So is "1.000", the same
   thousands mark written with a dot: no weight, rep, second or metre is ever
   typed with exactly three decimals. */
function parseNum(s){ s=String(s==null?'':s).trim();
  if(/^[1-9]\d{0,2}[,.]\d{3}$/.test(s)) return NaN;
  s=s.replace(',','.');
  return /^(\d+\.?\d*|\.\d+)$/.test(s)?+s:NaN; }

function markBad(el){ if(!el) return; badFields[el.id]=1; el.setAttribute('aria-invalid','true'); }
// Focus the first marked box of these, in page order, so a refusal points at its cause.
function focusBad(ids){
  var el=[].filter.call(document.querySelectorAll('#app [aria-invalid="true"]'),function(x){ return ids.indexOf(x.id)>-1; })[0];
  if(el) el.focus();
}
// null when empty, NaN (and marked) when not a number, else the number.
function readNum(el){
  if(!el || String(el.value).trim()==='') return null;
  var n=parseNum(el.value); if(isNaN(n)) markBad(el);
  return n;
}
/* Pulls the mins/temp/position row into the draft. Returns true when a stint
   was added, 'bad' when a box holds something that is not a number, and false
   when there is no minutes value, so Add and Log can both just ask. */
function readStint(){
  var minsEl=document.getElementById('sauna-mins');
  var tempEl=document.getElementById('sauna-temp');
  var posEl=document.getElementById('sauna-pos');
  var temp=readNum(tempEl), mins=readNum(minsEl);
  if(isNaN(temp)||isNaN(mins)) return 'bad';
  // An emptied box means no temperature, not the last one typed.
  if(tempEl) saunaTemp=temp===null?'':String(temp);
  if(mins===null||mins<=0) return false;
  saunaDraft.push({mins:mins, position:posEl?posEl.value:'Top'});
  consumed(['sauna-mins','sauna-pos']);
  return true;
}
/* A sauna row with 0 minutes, or (when logging) only a temperature, has
   nothing to log, so the minutes box is marked rather than the tap doing
   nothing. An empty row is just a stray tap and stays one. */
function noMins(orTemp){
  var el=document.getElementById('sauna-mins'); if(!el) return;
  if(String(el.value).trim()!==''||(orTemp&&saunaTemp!=='')){ markBad(el); focusBad(['sauna-mins']); }
}
function saunaStintText(x){
  var st=(x.stints&&x.stints.length)?x.stints:[{mins:x.mins||0,position:x.position||''}];
  return st.map(function(p){ return p.mins+' min '+(p.position||''); }).join(' + ');
}

   (goes soft), delicate white fish (goes rubbery), leaves and avocado, and
   pasta cooked to soft, which keeps cooking in its own sauce.

  return WORKOUTS.map(function(w,i){ return {w:w,i:i,d:hasOwn(at,w.id)?at[w.id]:''}; })
    .filter(function(x){ return x.d; })
    .sort(function(a,b){ return a.d<b.d?1:a.d>b.d?-1:a.i-b.i; })
    .slice(0,n).map(function(x){ return x.w; });
}
function lastDoneAgo(wid){
  var k=''; state.workoutLogs.forEach(function(l){ if(l.workoutId===wid && l.date>k) k=l.date; });
  if(!k) return '';
  var n=Math.round((new Date(realToday()+'T12:00:00')-new Date(k+'T12:00:00'))/86400000);
  return 'last done '+(n<=0?'today':n===1?'yesterday':n+' days ago');

// Sessions, not days: two logged on one day are two. A day ticked as trained
// with no log behind it is one.
function weekSessions(){
  return last7Keys().reduce(function(n,k){
    var e=state.days[k], c=state.workoutLogs.filter(function(l){ return l.date===k; }).length;
    return n+(c||(e && e.workout && e.workout.done ? 1 : 0));
  },0);
}
// Yesterday, when it is a gap in logging that is going on: not on a first
// open, and not after a long break, where nothing recent was logged before it.
function unloggedYesterday(){
  var yk=lastNKeys(2)[0], ye=state.days[yk], lo=minLogDate();
  if((ye&&ye.touched) || yk<lo) return '';

}
function stepTarget(v,d,lo,hi){ return Math.max(lo,Math.min(hi,(v||lo)+(v?d:0))); }
/* Forgiving on purpose. A day not logged is not a day something was used, so
   a clean run steps over it and only a day with that thing used ends it, or
   more than a week with nothing logged, since that is no longer a current
   run. Each substance has its own run: one drink is not a cigarette, and a
   slip with one does not take the others' days away. cleanStreak is all
   three at once. runs lists, longest first, only what has ever been logged
   as used, so a count of days without something never used is not shown.
   The day streak lets one missed day go; two in a row end it. The walk goes
   back as far as the oldest day held, not a fixed number of days, so a
   streak longer than that number is not cut off at it. */
var CLEAN_KINDS=[['smoking','cigarettes','smoke-free'],['alcohol','alcohol','alcohol-free'],['weed','weed','weed-free']];
function computeStreaks(){
  var d=new Date(), oldest=null, ever={};
  for(var k in state.days){ if(hasOwn(state.days,k)){
    if(oldest===null || k<oldest) oldest=k;
    CLEAN_KINDS.forEach(function(c){ if(state.days[k][c[0]]>0) ever[c[0]]=true; });
  } }
  var todayEntry=state.days[dateKey(d)];
  if(!todayEntry || !todayEntry.touched){ d.setDate(d.getDate()-1); }
  var dayStreak=0, missed=0, gap=0, breakingDay=false, breakingClean=false, clean={}, ended={};
  CLEAN_KINDS.forEach(function(c){ clean[c[0]]=0; });
  while(oldest!==null && dateKey(d)>=oldest){
    var entry=state.days[dateKey(d)], on=!!(entry && entry.touched);
    if(!breakingDay){ if(on){ dayStreak++; missed=0; } else if(++missed>1) breakingDay=true; }
    if(!breakingClean && !on && ++gap>7) breakingClean=true;
    if(!breakingClean && on){ gap=0; breakingClean=true;
      CLEAN_KINDS.forEach(function(c){ if(ended[c[0]]) return;
        if(entry[c[0]]>0) ended[c[0]]=true; else { clean[c[0]]++; breakingClean=false; } }); }
    if(breakingDay && breakingClean) break;
    d.setDate(d.getDate()-1);
  }
  var runs=CLEAN_KINDS.filter(function(c){ return ever[c[0]]; }).map(function(c,i){ return {k:c[0],name:c[1],free:c[2],n:clean[c[0]],i:i}; });
  runs.sort(function(a,b){ return b.n-a.n || a.i-b.i; });
  return {dayStreak:dayStreak,cleanStreak:Math.min(clean.alcohol,clean.smoking,clean.weed),clean:clean,
    runs:runs.map(function(r){ return {k:r.k,name:r.name,free:r.free,n:r.n}; })};
}
// The streak tile in the header and on Progress: the longest run going, by
// name, or all three at once when nothing has ever been logged as used.
function cleanTile(s){ var r=s.runs[0]; return r?{n:r.n,l:r.free}:{n:s.cleanStreak,l:'clean streak'}; }
function cleanRunsLine(s){
  if(!s.runs.length) return 'Current streak <b>'+s.cleanStreak+' day'+(s.cleanStreak===1?'':'s')+'</b>';
  return s.runs.map(function(r){ return 'No '+r.name+': <b>'+r.n+' day'+(r.n===1?'':'s')+'</b>'; }).join(' &middot; ');
}
// Removing an entry is destructive and the app has no history, so every
// removal parks the item where it can be put back. The variable is what is
// read; a copy goes to sessionStorage because a save on a copy with no store
// republishes and reloads the page, which would wipe the undo about a second
// after it appeared. sessionStorage survives that reload and clears when the
// app closes, which is exactly the lifetime an undo wants. Blocked storage
// only loses that reload, not the undo.
// A removal within UNDO_JOIN of the last one joins it, so a finger that lands
// twice (the next row's x slides under it) gets both back from one Undo.
var UNDO_KEY='fc.undo', UNDO_TTL=600000, UNDO_JOIN=5000, UNDO_SHOW=9000, undoMem=null, undoHide=null, undoMini=null;
var UNDO_JOINS={sauna:1,log:1,recipe:1,lib:1,meal:1,extra:1,many:1};
function parkUndo(o){
  o.at=Date.now();
  var cur=readUndo();
  if(cur && UNDO_JOINS[cur.kind] && UNDO_JOINS[o.kind] && o.at-cur.at<UNDO_JOIN && !undoMoot(cur)){
    var parts=(cur.kind==='many'?cur.parts:[cur]).concat([o]);
    o={kind:'many',parts:parts,at:o.at,label:parts.length===2?parts[0].label+' and '+parts[1].label:o.label+' and '+(parts.length-1)+' more'};
  }
  undoMem=o;
  try{ sessionStorage.setItem(UNDO_KEY,JSON.stringify(o)); }catch(e){}
  undoSay((o.text||'Removed '+o.label)+'. Undo available.');
}
function readUndo(){
  var v=undoMem;
  if(!v){ try{ v=JSON.parse(sessionStorage.getItem(UNDO_KEY)||'null'); }catch(e){ v=null; } }
  if(v && Date.now()-v.at<UNDO_TTL) return (undoMem=v);
  if(v) clearUndo();
  return null;
}
function clearUndo(){ undoMem=null; undoSay(''); try{ sessionStorage.removeItem(UNDO_KEY); }catch(e){} }
// Said once, when the removal happens, from a node outside #app: the toast is
// drawn again on every render, and a live region inside it would repeat.
function undoSay(txt){ var n=document.getElementById('undolive'); if(n && n.textContent!==txt) n.textContent=txt; }

function removeSauna(id){
  var i=-1; state.saunaSessions.forEach(function(x,k){ if(x.id===id) i=k; });
  if(i<0) return false;
  var item=state.saunaSessions.splice(i,1)[0];
  // What the clamp at zero actually took, so undo gives back no more than that.
  var took=-addXp(-XP_SAUNA);
  // Where it was, so undo puts it back rather than on the end. The list is
  // shown newest first, so appending moves an undone entry to the wrong place.
  parkUndo({kind:'sauna',item:item,pos:i,xp:took,label:item.mins+' min sauna on '+rowDate(item.date)});
  return true;
}
function dayHasLog(k){ return state.workoutLogs.some(function(x){ return x.date===k; }); }
function removeWorkoutLog(id){
  var i=-1; state.workoutLogs.forEach(function(x,k){ if(x.id===id) i=k; });
  if(i<0) return false;
  var item=state.workoutLogs.splice(i,1)[0];
  // The day was marked trained by finishing this session, unless a quick log
  // had marked it first (dayWas). If it was the only one that day, the day is
  // no longer a training day. The XP was paid once per trained day, not per
  // session, so it only comes off with the day. With others left, the day
  // reads as the newest of them, and keeps any quick log this one recorded.
  var left=state.workoutLogs.filter(function(x){ return x.date===item.date; });
  var d=state.days[item.date], took=0;
  if(d && d.workout && d.workout.done){
    if(left.length){ d.workout.type=left[left.length-1].tag||null;
      if(item.dayWas && !left.some(function(x){ return x.dayWas; })) left[0].dayWas=item.dayWas; }
    else if(item.dayWas) d.workout.type=item.dayWas.type||null;
    else { d.workout.done=false; d.workout.type=null; took=-addXp(-XP_WORKOUT); }
  }
  parkUndo({kind:'log',item:item,pos:i,xp:took,label:item.title+' on '+rowDate(item.date)});
  return true;
}
function hasId(list,id){ return (list||[]).some(function(x){ return x.id===id; }); }
// The same workout started again on the same day is another session: t0 tells
// them apart, and startedAt is all an older session has.
function sameSession(a,b){ return !!(a && b && a.workoutId===b.workoutId && (a.t0&&b.t0?a.t0===b.t0:a.startedAt===b.startedAt)); }
/* True when putting this back would do nothing or do it twice: a reload that
   read the store before the removal was saved has already brought the item
   back, and a second copy (and its XP again) is what undo would add. */
function undoMoot(u){
  var s=state.activeSession;
  if(u.kind==='sauna') return hasId(state.saunaSessions,u.item.id);
  if(u.kind==='log') return hasId(state.workoutLogs,u.item.id);
  if(u.kind==='recipe') return hasId(state.recipes,u.item.id);
  if(u.kind==='lib') return hasId(state.library,u.item.id);
  if(u.kind==='meal') return hasId(state.plan,u.item.id);
  if(u.kind==='extra') return hasId(state.shopExtras,u.item.id);
  if(u.kind==='many') return u.parts.every(undoMoot);
  if(u.kind==='week') return u.plan.every(function(e){ return hasId(state.plan,e.id); }) && !u.checked.some(function(k){ return state.shoppingChecked.indexOf(k)<0; });
  // A session started since, with nothing logged yet, gives way to it.
  if(u.kind==='session') return !!s && (sessId(s)===sessId(u.item) || setCount(s.logs)>0);

function applyUndo(){

function undoOne(u){

  // the end the way it always did.
  function putBack(list,item,pos){
    if(pos===undefined || pos===null || pos>list.length) list.push(item);

    list.forEach(function(e){ if(!hasId(state.plan,e.id)) state.plan.push(e); });

  else if(u.kind==='week'){
    planBack(u.plan);

// Returns what actually changed, which the clamp at zero can make less than n.
// A tap of water, and the XP it gives or takes back. The day keeps count of
// the cups that earned XP (wx), so a target moved in between cannot leave XP
// behind or take back more than was given. A day saved before wx existed
// earned up to the target as it was then, which is not kept: it is taken as
// the lower of today's target and the default of 8, so a target moved since
// cannot take back cups never paid.
function waterStep(e,d,tgt){
  var prev=e.water, got=e.wx!==undefined?e.wx:Math.min(prev,tgt,8), x=0;
  if(d>0 && prev>=DAY_MAX.water) return 0;
  e.water=Math.max(0,prev+d); if(e.water>0) e.touched=true;
  if(d>0 && prev<tgt){ got++; x=XP_PER_WATER; }
  if(d<0 && e.water<got){ got--; x=-XP_PER_WATER; }
  e.wx=got; return x;
}
function addXp(n){ var b=state.totalXp; state.totalXp+=n; if(state.totalXp<0) state.totalXp=0; return state.totalXp-b; }
function scheduleSave(){ exportDirty=true; if(saveTimer) clearTimeout(saveTimer); saveTimer=setTimeout(persist,1000); }
// A page being hidden or closed may never run its timer, so a save still
// waiting on one goes now. Nothing pending, nothing to write. It may be frozen
// or killed within moments, so it writes straight away and skips the re-read
// that normally goes first. Unread, it must not put whole documents: another
// view may have written fields this copy has never seen. So it sends only the
// fields this view changed, and the next save, on being looked at again, merges.
function flushSave(){ if(!saveTimer) return; clearTimeout(saveTimer); saveTimer=null;
  // An import still owed stays one: a flush sends fields, not the deletes it needs.
  // While the store is being seeded nothing can be sent; seedDone reads and saves.
  var owed=saveNow==='put'||saveNow==='replace';
  saveNow=dbState!=='db'?false:owed?saveNow:dbSeeding?false:'flush'; persist(); }

var DB_COLLECTIONS=['days','workoutLogs','sauna','library','recipes','plan'];
var DB_STATE_DOCS=['state/profile','state/shopping','state/session'];

/* ---------- the Store seam ----------------------------------------------
   Every read and write of saved data goes through one Store, so what sits
   behind it can change in one place:
     get(path)          the body, or undefined when there is none (not an error)
     readAll()          {path: body} for every collection and state document
     put(path, body)    write the whole document
     update(path, f)    merge fields into a document that exists
     remove(path)       delete it; deleting nothing is fine
     subscribe(fn)      optional: fn(path, body|undefined) on every change,
                        returns a function that stops it
   DbStore is the db capability. MemoryStore is the same contract over a plain
   object, for tests and anything with no db; a self-hosted backend would be a
   third (see CONTEXT.md). dbDocs/dbApply stay the serialisation either side. */
function DbStore(db){
  // A path the store will not take ('.' or '..' in it) throws as the
  // reference is made, not as a refusal. Thrown out of a batch it stopped the
  // rest of that batch and, with no code, was retried for ever; as a refusal
  // of that one document the others go and it waits for the next change.
  function at(path,fn){
    try{ return fn(db.doc(path)); }
    catch(e){ return Promise.reject({code:'invalid_argument', message:String(e&&e.message||e)}); }
  }
  function get(path){ return at(path,function(r){ return r.get(); }).then(function(d){ return d.exists?d.data():undefined; }); }
  var s={get:get,
    put:function(path,body){ return at(path,function(r){ return r.set(body); }); },
    update:function(path,f){ return at(path,function(r){ return r.update(f); }); },
    remove:function(path){ return at(path,function(r){ return r.delete(); }); },
    /* Five collection reads and three document reads, once at boot.
       Everything here is small and there are well under a hundred documents,
       so this is one round trip's worth of work, not a paging problem. */
    readAll:function(){
      var jobs=DB_COLLECTIONS.map(function(coll){
        return db.collection(coll).get().then(function(snap){
          var part={}; snap.docs.forEach(function(d){ if(d.exists) part[coll+'/'+d.id]=d.data(); });
          return part;
        });
      }).concat(DB_STATE_DOCS.map(function(path){
        return get(path).then(function(v){ var part={}; if(v!==undefined) part[path]=v; return part; });
      }));
      return Promise.all(jobs).then(function(parts){
        var map={}; parts.forEach(function(part){ Object.keys(part).forEach(function(k){ map[k]=part[k]; }); });
        return map;
      });
    }};
  // A lease, where the db has them: one view at a time seeds (see dbSeedStart).
  var lock=null; try{ lock=db.doc(DB_SEED_LOCK); }catch(e){}
  if(lock&&typeof lock.acquire==='function') s.acquire=function(path,o){ return at(path,function(r){ return r.acquire(o); }); };
  if(typeof db.collection(DB_COLLECTIONS[0]).onSnapshot==='function') s.subscribe=function(fn){
    var offs=DB_COLLECTIONS.map(function(coll){
      return db.collection(coll).onSnapshot(function(snap){
        snap.docChanges().forEach(function(c){ fn(coll+'/'+c.doc.id, c.type==='removed'?undefined:c.doc.data()); });
      },function(){});
    }).concat(DB_STATE_DOCS.map(function(path){
      return db.doc(path).onSnapshot(function(d){ fn(path, d.exists?d.data():undefined); },function(){});
    }));
    return function(){ offs.forEach(function(off){ off(); }); };
  };
  return s;
}
/* Bodies are kept as JSON, so nothing handed out can reach back in, which is
   the same guarantee the frozen bodies from db give. */
function MemoryStore(init){
  var m={}, subs=[];
  Object.keys(init||{}).forEach(function(k){ m[k]=JSON.stringify(init[k]); });
  function out(path){ return m[path]===undefined?undefined:JSON.parse(m[path]); }
  function tell(path){ subs.forEach(function(fn){ fn(path,out(path)); }); }
  /* update's merge: plain objects merge, anything else replaces. A key read
     from JSON (__proto__, constructor) is data like any other, so only an
     own field is merged into and each is written as an own property rather
     than through the setter, which would reach Object.prototype. */
  function plain(v){ return !!v&&typeof v==='object'&&!Array.isArray(v); }
  function deep(a,b){
    Object.keys(b).forEach(function(k){
      var v=b[k], o=Object.prototype.hasOwnProperty.call(a,k)?a[k]:undefined;
      Object.defineProperty(a,k,{value:plain(v)&&plain(o)?deep(o,v):v, enumerable:true, writable:true, configurable:true});
    });
    return a;
  }
  return {
    get:function(path){ return Promise.resolve(out(path)); },
    readAll:function(){
      var map={};
      Object.keys(m).forEach(function(k){
        var coll=k.slice(0,k.indexOf('/'));
        if(DB_STATE_DOCS.indexOf(k)>-1 || (DB_COLLECTIONS.indexOf(coll)>-1 && k.split('/').length===2)) map[k]=out(k);
      });
      return Promise.resolve(map);
    },
    put:function(path,body){ m[path]=JSON.stringify(body); tell(path); return Promise.resolve(); },
    update:function(path,f){
      if(m[path]===undefined) return Promise.reject({code:'invalid_argument', message:'no document at '+path});
      m[path]=JSON.stringify(deep(out(path),f)); tell(path); return Promise.resolve();
    },
    remove:function(path){ delete m[path]; tell(path); return Promise.resolve(); },
    subscribe:function(fn){ subs.push(fn); return function(){ subs=subs.filter(function(x){ return x!==fn; }); }; },
    dump:function(){ var o={}; Object.keys(m).forEach(function(k){ o[k]=out(k); }); return o; }
  };
}

/* First run on an empty store: write every document the seed implies, then
   mark the store seeded. The marker is written LAST and only after every write
   landed, so a seed that dies halfway is retried on the next load (skipping
   what is already there) rather than leaving a store that claims to be
   complete and is not.
   It runs in the background. The app runs on the embedded seed meanwhile,
   which is what is being written: a year of data took up to half a minute
   behind 'loading your data'. Taps go into state as ever, and saves are held
   until the marker lands; the whole store is then read and merged against
   the seed, as when the page is looked at again, so they are saved after.
   One view seeds. Two opened on a fresh store at once both seeded, and the
   later one's whole-document writes put the seed back over what had been
   logged in the first. The seeding view holds a lease (acquire) on
   DB_SEED_LOCK, renewed while it works; any other waits for the marker,
   trying for the lease as it goes, so one left by a view that closed is
   taken over once it runs out. The marker is looked for before each batch
   too, and a store with no leases has each document read just before it is
   written, so one another view has put there is left as it is. */
var DB_SEED_BATCH=8, DB_SEED_LOCK='state/seeding', DB_SEED_TTL=10000, DB_SEED_POLL=1000, dbSeeding=null;
function dbSeedStart(){
  var snap=dbSnapshot(dbDocs(state));
  dbSeeding={snap:snap, holder:'seed-'+Date.now().toString(36)+Math.random().toString(36).slice(2,8),
    done:{}, refused:{}, attempt:0, renew:null, wait:null, lost:false, err:null, meta:null};
  setSaving(true); seedStep(dbSeeding);
}
function seedLease(me,ttl){ return dbStore.acquire(DB_SEED_LOCK,{holder:me.holder, ttlMs:ttl||DB_SEED_TTL}); }
function seedQuiet(me){
  if(me.renew){ clearInterval(me.renew); me.renew=null; }
  if(me.wait){ clearTimeout(me.wait); me.wait=null; }
}
function seedStep(me){
  me.wait=null; me.until=0; me.ver=null;
  if(dbSeeding!==me||dbState!=='db') return;
  dbStore.get('state/meta').then(function(meta){
    if(dbSeeding!==me) return;
    if(meta) return seedDone(me,meta);
    if(!dbStore.acquire) return seedWrite(me,false);
    var sent=Date.now();
    return seedLease(me).then(function(r){
      if(dbSeeding!==me) return;
      if(r&&r.acquired){ me.lost=false; me.ver=r.version; me.sent=sent; me.until=sent+DB_SEED_TTL; return seedWrite(me,true); }
      // Another view is seeding: its marker is looked for again shortly.
      me.wait=setTimeout(function(){ seedStep(me); },DB_SEED_POLL);
    },function(e){

   over the one just imported. */
function applyImport(st,mode){

  // 'held' when the copy from before an unfinished import is kept instead.
  var kept='held';

  else importPrev=null;

  clearUndo(); restoreAsk=false; importResume=null;
  var ended=state.endedSessions||[], was=sessId(state.activeSession);
  state=mode==='merge'?mergeImport(state,st):st; exportDirty=true;
  // A session this replaces is over in every view; the one it brings is live.
  var now=sessId(state.activeSession);

function recipeIngs(r){

/* ---------------------------------------------------------------------------
   THE PLAN. A planned meal is its own thing: a recipe, a real date, a slot,
   and its own portion count. It used to be two fields on the recipe (inPlan
   and a weekday name), which could not say "chilli on Monday AND Thursday" at
   all: planning it a second time just moved it. Portions living on the meal
   rather than the recipe is what lets Monday be two portions and Thursday one.

function recipePortions(r){ return r.portions||recipeBase(r); }
/* One step of a portion stepper. Twenty is the ceiling a tap reaches, but a
   recipe that makes more (from an import, or an older form) is not cut down
   to it by a tap: the ceiling is never below the recipe's own size or the
   count already there. */
function stepPortions(n,d,base){
  return Math.max(1, Math.min(Math.max(20,base||1,n), n+d));
}
// Round to something you can actually shop for. Weight and volume tolerate a
// decimal; you cannot buy 1.6 tins or 4.8 peppers, and a recipe does not care
// about a third of an onion either way.
/* How much to COOK. A recipe scaled down to one portion wanting most of an
   onion says most of an onion; rounding that up would make the portion stepper
   look broken, because every countable line would read the same at 1 portion as
   at 4. */
function roundQty(q,unit){
  // A pinch scaled down is still a pinch, not "0 tsp".
  if(/^(g|kg|ml|l)$/.test(unit)) return Math.max(q>0?0.1:0, Math.round(q*10)/10);
  // A quarter teaspoon doubled is half of one, not a whole half-step guess:
  // eighths below a quarter, quarters below two, halves above.
  if(/^(tbsp|tsp)$/.test(unit)) return q<0.25?Math.max(q>0?0.125:0, Math.round(q*8)/8) : q<2?Math.round(q*4)/4 : Math.round(q*2)/2;
  // A count keeps its half: "1 1/2 mugs" doubled is 3, tripled 4.5. Only the
  // shopping list (buyQty) rounds up to whole ones.
  return Math.max(0.5, Math.round(q*2)/2);
}
/* How much to BUY, which is a different question. Countable things are sold
   whole: this used to round to nearest, so two meal preps needing 2.4 tins
   between them read as "2 tins", you bought two, and you found out in the
   kitchen. There is no such thing as 0.4 of a tin. Being short costs a second
   trip to the shop and being over costs a spare onion, so this only rounds up.
   Weights and volumes stay as they are, and spoons come out of a jar that is
   already in the cupboard. */
function buyQty(q,unit){
  if(/^(g|kg|ml|l|tbsp|tsp)$/.test(unit)) return roundQty(q,unit);
  var whole=Math.ceil(q-0.0001);
  return (whole<1 && q>0) ? 1 : whole;
}
function fmtQty(q){
  // Eighths and quarters of a spoon are written out: "0.25 tsp", "0.125 tsp".
  if(Math.abs(q*8-Math.round(q*8))<1e-6) return String(Math.round(q*8)/8);
  var v=Math.round(q*10)/10;
  if(Math.abs(v-Math.round(v))<0.05) return String(Math.round(v));
  return String(v);
}
function qtyText(q,unit,buying){
  // 1400g is a number you have to think about; 1.4kg is one you can shop with.
  if(unit==='g' && q>=1000){ q=q/1000; unit='kg'; }
  else if(unit==='ml' && q>=1000){ q=q/1000; unit='l'; }
  // And 0.24kg is 240g, not a tenth-of-a-kilo guess at "0.2kg".
  else if(unit==='kg' && q<1){ q=q*1000; unit='g'; }
  else if(unit==='l' && q<1){ q=q*1000; unit='ml'; }
  q=buying?buyQty(q,unit):roundQty(q,unit);
  // A count of things pluralises; grams and millilitres do not. It has to
  // singularise too, or a recipe scaled down reads "1 tins".
  if(unit && !/^(kg|g|ml|l|tbsp|tsp)$/.test(unit)){
    if(q>1 && !/s$/.test(unit)) unit=unit+(/(ch|sh|x)$/.test(unit)?'es':'s');
    else if(q<=1) unit=/(ch|sh|x)es$/.test(unit)?unit.slice(0,-2):unit.replace(/s$/,'');
  }
  return fmtQty(q)+(unit?(/^(kg|g|ml|l)$/.test(unit)?unit:' '+unit):'');
}
function scaledIng(ing,factor){
  // At the recipe's own size the line reads exactly as it was typed.
  if(ing.q===null || factor===1) return ing.raw;
  var txt=qtyText((ing.qMax||ing.q)*factor,ing.u);
  if(ing.qMax){
    // "4-6" scales to "8-12". The unit is written once, after the top end.
    var lo=qtyText(ing.q*factor,ing.u), ln=lo.match(/^[\d.]+/)[0], hn=txt.match(/^[\d.]+/)[0];
    var sg=function(x){ return x.replace(/(ch|sh|x)es$/,'$1').replace(/s$/,''); };
    if(ln!==hn) txt=(sg(lo.slice(ln.length))===sg(txt.slice(hn.length))?ln:lo)+'-'+txt;
  }
  // "4 x 400g tins", "about 400g", "4cm piece": what was typed around the
  // number comes back around the new one, so the card parses back the same.
  if(ing.size) txt=txt.replace(/^([\d.]+(?:-[\d.]+)?)\s*/,'$1 x '+ing.size+' ');
  if(ing.pre) txt=ing.pre+(ing.pre==='~'?'':' ')+txt;
  // Typed amount first ("500g beef mince"), it stays amount first. A count
  // with no unit is the name's to singularise, or halved it reads "1 onions".
  if(ing.lead!=null) return txt+' '+(ing.u||ing.size||(ing.qMax||ing.q)<=1||(ing.qMax||ing.q)*factor>1?ing.lead
    :ing.lead.replace(/^[^,(]*/,function(h){ var done=false; return h.replace(/[a-z]+/gi,function(w){
      if(done||!/[^su]s$/i.test(w)||/ves$/i.test(w)) return w; done=true;
      return w.replace(/llies$/i,'lli').replace(/ies$/i,'y').replace(/(ch|sh|x|o)es$/i,'$1').replace(/s$/i,''); }); }));
  return ing.n+' ('+txt+(ing.d?(ing.j==null?', ':ing.j)+ing.d:'')+')';
}

/* Adding up a shopping list is where an ingredient quietly goes missing, so
   the rule is: exactly one row per ingredient name, always. Three things used
   to split one ingredient across two rows, and two rows is how something gets
   bought twice or not at all.
     - "1 tin" and "2 tins" are one unit written two ways
     - 500g and 1kg are one measurement in two scales
     - "Garlic" and "Garlic (4 cloves)" are one ingredient, one of them just
       unmeasured
   Units that genuinely do not add (200g of spinach and a handful of it) stay
   as separate quantities, but on the SAME row: "Spinach (200g + 1 handful)".
   Nothing is invented, and nothing can hide. */
var UNIT_SCALE={kg:{u:'g',mul:1000}, l:{u:'ml',mul:1000}};
// What after a comma is an instruction rather than more of the name.
var ING_TAIL=/\s*,\s*(?:(?:finely|roughly|thinly|freshly)\s+)?(?:optional|grated|diced|chopped|sliced|minced|crushed|peeled|to serve|to taste|for [^,]*)\s*$/i;
var COUNT_UNIT=/^(?:(tin|can|head|clove|slice|stick|scoop|wedge|sprig|(?:large |small )?handful|pint|cup|mug|bag|pack|packet|jar|bottle|carton|punnet|pot)s|(bunch)es)$/;
function canonUnit(u){
  var x=String(u||'').trim().toLowerCase().replace(/\s+/g,' ');
  if(UNIT_SCALE[x]) return UNIT_SCALE[x].u;
  // "large handful" is deliberately NOT folded into "handful": they are
  // different amounts, and pretending otherwise would invent a quantity.
  return x.replace(COUNT_UNIT,'$1$2');
}
function canonQty(q,u){
  var x=UNIT_SCALE[String(u||'').trim().toLowerCase()];
  return x ? q*x.mul : q;
}
// Mass and volume first, then named units, then the unitless count, so a row
// reads the same way every time.
function unitRank(u){ return u==='g'?0 : u==='ml'?1 : u===''?3 : 2; }
// "Cheddar cheese, grated" is cheddar to buy: a known instruction after a
// comma is not part of the name. "Carrot, parsnip, potato" keeps its commas,
// since none of those is an instruction.
function shopName(n){
  var bare=String(n).trim(), dm;
  while((dm=bare.match(ING_TAIL)) && dm.index>0) bare=bare.slice(0,dm.index);
  return bare;
}
// "Egg" and "Eggs", "Chilli" and "Chillies", "Berry" and "Berries" are one
// thing to buy: one row, under this one name.
function shopFold(bare){
  return bare.toLowerCase().replace(/ies$/,'i').replace(/(ch|sh|x|o)es$/,'$1').replace(/([^su])s$/,'$1').replace(/(ie|y)$/,'i');
}
// The shopping list adds the same ingredient across every planned MEAL, at
// that meal's own portion count. Reading the plan rather than the recipes is
// what makes the same recipe twice in a week add up to two lots, and what lets
// the list be scoped to part of the week.
function shoppingList(dates){
  // Keyed by what was typed: an ingredient called Constructor is a row of its
  // own, not one Object already has.
  var byName=Object.create(null), order=[];
  planEntries(dates).forEach(function(e){
    var r=planRecipe(e);
    if(!r) return;
    var f=planPortions(e)/recipeBase(r);
    recipeIngs(r).forEach(function(ing){
      var nameKey=String(ing.n||'').trim().toLowerCase();
      if(!nameKey) return;
      // The row keeps the first spelling; its tick is keyed on the folded
      // name, so which meal says it first cannot untick it. A tick made by
      // older code under any spelling in the group still counts.
      var bare=shopName(ing.n), fold=shopFold(bare);
      var slot=byName[fold];
      if(!slot){ slot=byName[fold]={key:'i|'+fold, raws:[], n:bare.charAt(0).toUpperCase()+bare.slice(1), parts:{}, order:[], plain:null, ents:[]}; order.push(slot); }
      if(slot.raws.indexOf('i|'+nameKey)<0) slot.raws.push('i|'+nameKey);
      if(slot.ents.indexOf(String(e.id))<0) slot.ents.push(String(e.id));
      if(ing.q===null){ if(slot.plain===null) slot.plain=ing.raw; return; }
      // "2 x 400g tins" and "2 x 200g tins" are different packs, and a tin of
      // no stated size is not assumed to be either, so each size adds alone.
      var u=canonUnit(ing.u), sm=String(ing.size||'').match(/^([\d.,]+)(\w+)$/);
      var sn=sm?(/^[1-9]\d{0,2}(,\d{3})+$/.test(sm[1])?sm[1].replace(/,/g,''):sm[1].replace(',','.')):0;
      var sv=sm?canonQty(+sn,sm[2]):0, k=u+'|'+(sm?sv+canonUnit(sm[2]):''), part=slot.parts[k];
      if(!part){ part=slot.parts[k]={k:k,u:u,q:0,size:sm?ing.size:'',sv:sv}; slot.order.push(part); }
      part.q+=canonQty(ing.qMax||ing.q,ing.u)*f;
    });
  });
  order.forEach(function(o){
    // What a tick on this row was made for: each amount as it is bought. A
    // tick covers the row only while no amount has grown past it (tickCovers).
    o.stamp=o.order.map(function(p){ return p.k+'='+buyQty(p.q,p.u); }).join(';');
    if(!o.order.length){ o.label=o.plain||o.n; return; }
    // A measured amount answers the unmeasured mention too, so it is absorbed
    // rather than left as a second row saying only "you also need this".
    o.order.sort(function(a,b){ return unitRank(a.u)-unitRank(b.u) || (a.u<b.u?-1:a.u>b.u?1:0) || a.sv-b.sv; });
    o.label=o.n+' ('+o.order.map(function(p){ var t=qtyText(p.q,p.u,true);
      return p.size?t.replace(/^([\d.]+)\s*/,'$1 x '+p.size+' '):t; }).join(' + ')+')';
  });
  // Added by hand, so they carry no quantity to add up, but they belong in the
  // same list: shopping from two lists is how the second one gets forgotten.
  (state.shopExtras||[]).forEach(function(x){
    order.push({key:'x|'+x.id, extraId:x.id, label:x.text, extra:true});
  });
  order.sort(function(a,b){return a.label.toLowerCase().localeCompare(b.label.toLowerCase());});
  return order;
}
/* A tick is stored with what it was bought for: "i|onion", a line break, the
   amounts and the planned meals they were for ("|=2;@=pl1,pl2"). Ticked at 2
   onions, the row asking for 5 once another meal goes in is not ticked;
   asking for fewer, it still is, but only while every meal on the row is one
   it was bought for: next week's onions are another shop, however few. A
   tick without meals is from older code and is given them at load
   (pruneTicks); a bare key, under any spelling in the group, counts whatever
   the amount. Your own items have no amount: their tick is their key. Older
   code reads "@" as an amount no row asks for, and passes over it. */
var TICK_SEP='\n';
function tickOf(t,it){ return t===it.key || (!it.extra && (t.indexOf(it.key+TICK_SEP)===0 || it.raws.indexOf(t)>-1)); }
function tickParts(t,key){
  var had=Object.create(null), meals=null;
  t.slice(key.length+1).split(';').forEach(function(x){ var e=x.lastIndexOf('='); if(e<1) return;
    if(x.slice(0,e)==='@') meals=x.slice(e+1).split(','); else had[x.slice(0,e)]=+x.slice(e+1); });
  return {had:had, meals:meals};
}
function tickCovers(t,it){
  if(!tickOf(t,it)) return false;
  if(it.extra || t.indexOf(it.key+TICK_SEP)!==0) return true;
  var tp=tickParts(t,it.key), had=tp.had;
  if(tp.meals && !it.ents.every(function(id){ return tp.meals.indexOf(id)>-1; })) return false;
  return (it.stamp?it.stamp.split(';'):[]).every(function(x){ var e=x.lastIndexOf('='), k=x.slice(0,e);
    return k in had && had[k]>=+x.slice(e+1)-1e-9; });
}
var CLEAR_TICKS='<button class="clearbtn" data-action="clearticks">Clear the ticks</button> ';
function shopTicked(it){ return (state.shoppingChecked||[]).some(function(t){ return tickCovers(t,it); }); }
function tickFor(it){ return it.extra?it.key:it.key+TICK_SEP+(it.stamp?it.stamp+';':'')+'@='+it.ents.join(','); }
/* A tick for something no planned meal needs any more goes, and so does one
   whose meals have all passed or gone, so it is not waiting, ticked, for the
   next time that thing is planned. One from older code is stamped with the
   whole week's amounts and meals, so nothing ticked before is unticked by
   this, in either range. Only at load and when the day turns: pruned as a
   meal goes, a tick would not come back with its Undo. */
function pruneTicks(){
  var list=shoppingList(planWindow(7)), before=state.shoppingChecked||[], out=[];
  before.forEach(function(t){
    var row=null;
    if(String(t).indexOf('i|')===0) list.forEach(function(it){ if(!row && !it.extra && tickOf(t,it)) row=it; });
    else row={};
    if(!row) return;
    var nt=t, m;
    if(row.key!==undefined && t.indexOf(row.key+TICK_SEP)!==0) nt=tickFor(row);
    else if(row.key!==undefined && !(m=tickParts(t,row.key).meals)) nt=t+(t.length>row.key.length+1?';':'')+'@='+row.ents.join(',');
    else if(m && !row.ents.some(function(id){ return m.indexOf(id)>-1; })) return;
    if(out.indexOf(nt)<0) out.push(nt);
  });
  var changed=out.length!==before.length || out.some(function(t,i){ return t!==before[i]; });
  state.shoppingChecked=out;
  return changed;
}
function macroLine(r){
  var m=r.macros; if(!Array.isArray(m) || m.length!==4) return '';
  return '<div class="macros"><span class="per">Per portion</span><span><b>'+m[0]+'</b> kcal</span><span><b>'+m[1]+'g</b> protein</span>'+
    '<span><b>'+m[2]+'g</b> carbs</span><span><b>'+m[3]+'g</b> fat</span></div>';
}

function setLabel(def,e){
  var type=def&&def.type;
  if(type==='load'){
    if(!e.w) return e.v+' reps';
    // "ea" so a 20kg pair never reads back as a 20kg total.
    return e.w+'kg'+(perImplement(def.id)?' ea':'')+' × '+e.v;
  }
  if(type==='time') return e.v+(def.unit==='min'?' min':'s');
  if(type==='distance') return e.v+'m';
  if(type==='prep'){
    if(e.lvlKind==='load'){
      return (e.w?(e.w+'kg'+(e.of&&perImplement(e.of)?' ea':'')+' × '+e.v):(e.v+' reps'))+(e.opt?' · '+e.opt:'');
    }
    var pl=e.v+' min'+(e.opt?' · '+e.opt:'');
    if(e.lvl) pl+=' · '+(e.lvlKind==='resistance'?('resistance '+e.lvl):e.lvlKind==='speed'?(e.lvl+' km/h'):e.lvl);
    return pl;
  }
  if(type==='cardio'){
    var label=e.v+' min'+(e.machine?' · '+e.machine:'');
    if(e.work||e.rest) label+=' · '+(e.work||'—')+'/'+(e.rest||'—');
    return label;
  }
  return e.v+' '+repsWord(def);
}

/* Runs once per session, never on every render: if it ran every time, removing
   the cool-down would silently put it straight back. */
function workoutOf(sess){ return WORKOUTS.filter(function(x){ return x.id===sess.workoutId; })[0]; }
/* A workout's own warm-up or cool-down words, for the slide of a step with that
   role: the generic step that stands in for one, or the plan's own (Swim's
   easy lengths), where they say what to do around it. */
function workoutProse(w,id){
  var d=exDef(id), r=d&&d.role;
  if(!w || !r || typeof w[r]!=='string') return '';
  return (d.type==='prep' || w.plan.some(function(p){ return p.ex===id; }))?w[r]:'';
}
function hasRole(sess,role){
  for(var i=0;i<sess.exIds.length;i++){
    var d=exDef(sess.exIds[i]);
    if(d && d.role===role) return true;
  }
  return false;
}
/* The first thing in the session you actually put weight on, looking inside a
   superset if one leads: what "Light sets of the first lift" ramps up on.
   Anything else is not a lift to ramp up on, and naming a stretch would be
   worse than naming nothing. */
function firstLiftOf(sess){
  var first=null;
  (sess&&sess.exIds||[]).forEach(function(x){
    if(first) return;
    (isSuperset(x)?supersetMembers(x):[x]).forEach(function(id){
      if(first) return;
      var fd=exDef(id); if(fd && fd.type==='load') first=fd;
    });
  });
  return first;
}
// Whether a light set on the warm-up is one dumbbell of a pair, as the lift is.
function prepEach(sess){ var f=firstLiftOf(sess); return !!(f && perImplement(f.id)); }
function ensurePrep(sess){
  if(!sess || sess.prep) return;
  sess.prep=1;
  // Only where the plan does not already have one: Swim opens and closes with
  // its own easy lengths, and Cardio gym starts on the machine, so bolting a
  // generic step onto those would be asking for the same thing twice. A
  // workout can also opt out (`prep:{warmup:false}`): a ten-minute reset is
  // its own warm-up.
  var w=workoutOf(sess), off=(w&&w.prep)||{};
  if(!hasRole(sess,'warmup') && off.warmup!==false){
    sess.exIds.unshift('warmup');
    sess.targets.warmup={sets:1,reps:'5-10 min'};
  }
  if(!hasRole(sess,'cooldown') && off.cooldown!==false){
    sess.exIds.push('cooldown');
    sess.targets.cooldown={sets:1,reps:'5-10 min'};
  }
}
// True when a session holding logged sets is in progress for a workout other
// than id, which starting id would throw away.
function sessionBusy(id){
  var s=state.activeSession; if(!s || s.workoutId===id) return false;
  return Object.keys(s.logs||{}).some(function(k){ return s.logs[k].length>0; });
}
function newSession(w,t0){
  var s={id:'s'+t0,workoutId:w.id,startedAt:activeDate(),t0:t0,exIds:w.plan.map(function(p){return p.ex;}),targets:{},logs:{}};
  w.plan.forEach(function(p){ s.targets[p.ex]={sets:p.sets,reps:p.reps}; });
  ensurePrep(s); return s;
}
// Start goes back into the session in progress for this workout, unless it is
// from an earlier day that is not the one being logged and holds no sets: a
// session left open days ago would put today's sets on that day. Sets are
// never dropped by Start, so one that has them is resumed, and says its date.
function resumesOnStart(id){
  var s=state.activeSession;
  return !!s && s.workoutId===id && (!(s.startedAt<realToday()) || s.startedAt===activeDate() || setCount(s.logs)>0);
}
// Anything done to it beyond starting it: sets, or exercises, targets or
// supersets changed. Only that is worth an Undo when it is replaced.
function sessionBuilt(s){
  var w=WORKOUTS.filter(function(x){return x.id===s.workoutId;})[0], f=w&&newSession(w,1);
  return setCount(s.logs)>0 || Object.keys(s.supersets||{}).length>0 || !f ||
    JSON.stringify(s.exIds)!==JSON.stringify(f.exIds) || stableJson(s.targets)!==stableJson(f.targets);
}
function startWorkout(id){
  var w=WORKOUTS.filter(function(x){return x.id===id;})[0], old=state.activeSession;
  if(!w || sessionBusy(id)) return;
  if(!resumesOnStart(id)){
    if(old){
      if(sessionBuilt(old)) parkUndo({kind:'session',item:old,label:'the '+sessionTitle(old)+' session'+
        sessionFor(old).replace(' for ',' from ')});
      endSession(old);
    }
    state.activeSession=newSession(w,Date.now());
    slide=0; addingExercise=false; clearPrep();
  }
  ensurePrep(state.activeSession);
  viewingSession=true;
}
// The day Finish writes a session to: when it started, when that is a date.
// Anything else would be a day document no read finds, or a name Object
// already has.
function sessionDay(s){ return /^\d{4}-\d{2}-\d{2}$/.test(s.startedAt||'')?s.startedAt:activeDate(); }
// ' for Mon 28 Sep' when that is not today, so the screen names it.
function sessionFor(s){ var k=sessionDay(s); return k===realToday()?'':' for '+prettyKey(k); }
// The session in progress, named wherever it can be picked up again. Today
// offers only Resume: a stray tap on the daily screen cannot throw it away.
function resumeBannerHtml(canDiscard){
  var s=state.activeSession; if(!s) return '';
  var aw=WORKOUTS.filter(function(x){return x.id===s.workoutId;})[0];
  var cnt=0; Object.keys(s.logs).forEach(function(k){cnt+=s.logs[k].length;});
  var from=sessionDay(s);
  return '<div class="resume-banner"><span>In progress: <strong>'+(aw?esc(aw.title):'Workout')+'</strong>'+
    (from!==realToday()?' from '+esc(prettyKey(from)):'')+' ('+cnt+' set'+(cnt===1?'':'s')+' logged)</span>'+
    '<span class="btns"><button class="go" data-action="resumesession">Resume</button>'+
    (canDiscard?'<button class="x" data-action="discardsession" title="Discard" aria-label="Discard this session">&times;</button>':'')+'</span></div>';
}
// A session belongs to the day it started. One started while logging an
// earlier day is being typed in after the fact, so its clock means nothing.
function sessionLive(s){
  return s.t0 ? dateKey(new Date(s.t0))===s.startedAt : s.startedAt===realToday();
}
/* Returns whether a set was logged. A box holding something that is not a
   number refuses the set and is marked; so is an empty value box, unless
   `quiet` (a superset round skips a row left empty). */
function logSet(exId,type,quiet){
  var valInput=document.getElementById('log-v-'+exId);
  if(!valInput) return false;
  var v=readNum(valInput), def=exDef(exId);
  var wEl=document.getElementById('log-w-'+exId), wt=(type==='load'||type==='prep')?readNum(wEl):null;
  var lEl=document.getElementById('log-lvl-'+exId);
  // Only a speed is typed; a resistance or an effort is picked from a list.
  var lv=(lEl && lEl.tagName==='INPUT')?readNum(lEl):null;
  if(isNaN(wt)||isNaN(lv)||isNaN(v)) return false;
  if(v===null||v<=0){ if(!quiet) markBad(valInput); return false; }
  var entry={v:v,w:null,t:Date.now()};

  var ex=rigFor(exId), x0=1e9, x1=-1e9, top=1e9, N=48;
  var see=function(x,r){ if(x-r<x0) x0=x-r; if(x+r>x1) x1=x+r; };
  var up=function(y,r){ if(y-r<top) top=y-r; };
  var eq=ex.equip==='barbell'?15:ex.equip==='dumbbell'?14:ex.equip?11:5;
  // How far above the hand the implement reaches, side then front.
  var ax=rAxis(ex), q=ex.equip;
  var eqS=q==='barbell'?17:q==='dumbbell'?(ax==='vertical'?14:ax==='lateral'?7:9):q==='ball'?13:q==='plate'?13:q==='cable'?7:q==='kettlebell'?8:4;
  var eqF=q==='barbell'?15:q==='dumbbell'?(ax==='vertical'?14:ax==='lateral'?8:6):q==='ball'?13:q==='plate'?12:q==='cable'?7:q==='kettlebell'?6:8;
  for(var i=0;i<=N;i++){
    var s=rSolve(rPoseAt(ex,i/N));
    [s.hip,s.sh,s.hipF,s.shF,s.kneeN,s.kneeF,s.elbN,s.elbF].forEach(function(p){ see(p.x,9); up(p.y,9); });
    see(s.head.x,RL.HEAD_R+1); up(s.head.y,RL.HEAD_R+1);
    [s.ankN,s.ankF].forEach(function(p){ see(p.x+RL.FOOT*0.72,1); see(p.x-RL.FOOT*0.28,1); up(p.y,6); });
    [s.handN,s.handF].forEach(function(p){ see(p.x,eq); up(p.y,eqS); });
    // A kettlebell lies on whichever side of the fist its rule puts it.
    if(q==='kettlebell'){ var kb=rBellAt(ex,s); see(kb.x,10); up(kb.y,10); }
    // A ball out of the hands; the whole loop of a rope.
    if(s.ball){ see(s.ball.x,12); up(s.ball.y,12); }
    if(q==='rope'){ see(s.hip.x-25,1); see(s.hip.x+31,1); up(s.head.y-RL.HEAD_R-8,2); }
    if(ex.front){ var f=rSolveFront(rFrontAt(ex,i/N));
      if(q==='kettlebell') up(rBellFront(ex,f).y,9);
      if(f.ball) up(f.ball.y,12);
      if(q==='rope') up(f.head.y-RL.HEAD_R-8,2);
      up(f.head.y,RL.HEAD_R+1); up(f.shC.y,13);
      [f.shL,f.shR].forEach(function(p){ up(p.y,8); });
      [f.elbL,f.elbR,f.kneeL,f.kneeR].forEach(function(p){ up(p.y,6); });
      [f.handL,f.handR].forEach(function(p){ up(p.y,eqF); }); }
  }
  // A prop's corners, turned as it is drawn.
  (ex.props||[]).forEach(function(p){ var a=(p[5]||0)*Math.PI/180, cx=p[0]+p[2]/2, cy=p[1]+p[3]/2;
    [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(function(k){ var dx=k[0]*p[2]/2, dy=k[1]*p[3]/2;
      see(cx+dx*Math.cos(a)-dy*Math.sin(a),1); up(cy+dx*Math.sin(a)+dy*Math.cos(a),1); }); });
  (ex.planProps||[]).forEach(function(p){ up(p[1],1); });
  if(ex.barAt){ see(ex.barAt[0],4); up(ex.barAt[1],4); }
  if(ex.anchorAt){ see(ex.anchorAt[0],2); up(ex.anchorAt[1],2); }
  if(ex.anchorFront) for(var a=1;a<ex.anchorFront.length;a+=2) up(ex.anchorFront[a],2);
  var w=Math.max(100,x1-x0+12), vx=(x0+x1)/2-w/2, y=Math.min(18,Math.floor(top-2)), fw=ex.frontW||100;
  return (rigBoxes[exId]={x:Math.round(vx*10)/10, w:Math.round(w*10)/10, y:y, h:186-y, fx:70-fw/2, fw:fw});
}
// The front view is 100 wide, or wider for arms out to the sides at shoulder
// height (frontW: a jumping jack), centred on the body and capped in
// proportion, so it keeps the same scale. Beside it the side panel gets a column, a cap
// and a shape in proportion to its own crop, so a wide crop is drawn at the
// front view's scale rather than shrunk to fit a panel of the same width. The
// cap itself (--fig-cap) grows with the screen, so a tablet is not left with
// a phone-sized figure in a big empty panel.
function figPairStyle(exId){
  var b=rigBox(exId);
  return 'grid-template-columns:minmax(0,'+b.w+'fr) minmax(0,'+b.fw+'fr);--fig-ar:'+b.w+'/'+b.h+';--fig-arf:'+b.fw+'/'+b.h+';--fig-w:'+(b.w/100).toFixed(3)+';--fig-wf:'+(b.fw/100).toFixed(3);
}
// Side view, back to front: far leg and arm, the body, the near leg, the
// implement in the near hand (in front of the body, behind the head it hangs
// past overhead and under the fist that holds it; a kettlebell goes behind
// the body while that fist is above the hip, so a rack is not a disc on the
// belly), the head, the near arm
// with a cut line of panel colour round it so it shows where it crosses the
// body or passes the head, then a bar: the barbell's near plate, or a fixed
// bar the hands hang from.
function rBowed(ex){ return ex.frames.some(function(f){ return f.bow!==undefined; }); }
function rigSVG(exId,u){
  var ex=rigFor(exId); if(!ex) return '';
  var s=rSolve(rPoseAt(ex,u));
  var ink='var(--text)', far='var(--text-faint)', hi='var(--accent)', cut='var(--surface-raised)';
  var legCol=ex.active==='legs'?hi:ink, armCol=(ex.active==='arms'||ex.active==='armN')?hi:ink;
  var bx=rigBox(exId);
  var o='<svg viewBox="'+bx.x+' '+bx.y+' '+bx.w+' '+bx.h+'" preserveAspectRatio="xMidYMax meet" role="img" aria-label="exercise animation">';
  o+=rGround(bx.x,bx.x+bx.w);
  (ex.props||[]).forEach(function(p){ o+=rProp(p); });
  var top=ex.equip==='barbell'||ex.equip==='fixedbar'||ex.equip==='plate', back=ex.equip==='kettlebell'&&s.handN.y<s.hip.y;
  function limb(a,b,c,col,w,isLeg,edge){
    var st=edge?' stroke="'+col+'" stroke-width="2.6" stroke-linejoin="round"':'';
    return '<polygon points="'+rSeg(a,b,w[0],w[1])+'" fill="'+col+'"'+st+'/>'+
      '<circle cx="'+b.x.toFixed(1)+'" cy="'+b.y.toFixed(1)+'" r="'+(w[1]/2)+'" fill="'+col+'"'+st+'/>'+
      '<polygon points="'+rSeg(b,c,w[1],w[2])+'" fill="'+col+'"'+st+'/>'+
      (isLeg ? '<polygon points="'+rFoot(c,c===s.ankF?s.footF:s.footN)+'" fill="'+col+'"/>'
             : '<circle cx="'+c.x.toFixed(1)+'" cy="'+c.y.toFixed(1)+'" r="'+(w[2]/2+0.8)+'" fill="'+col+'"'+st+'/>');
  }
  // A skipping rope: the far strand behind everything, the near one over the
  // near arm, each from its hand to the far end of the loop.
  var rq=ex.equip==='rope'?rRopeAt(s):null, rst='" fill="none" stroke="var(--text-soft)" stroke-width="1.6"/>';
  if(rq) o+='<path d="'+rRopePath(s.handF,rP(rq.x-5,rq.y),s.rope)+rst;
  o+=limb(s.hipF,s.kneeF,s.ankF,far,[10,7,5],true);
  o+=limb(s.shF,s.elbF,s.handF,far,[7,5,4],false);
  if(back) o+=rEquip(ex,s);
  o+='<polygon points="'+(rBowed(ex)?rSpine(s.hip,s.mid,s.sh,13,15,17):rSeg(s.hip,s.sh,13,17))+'" fill="'+ink+'"/>';
  o+='<circle cx="'+s.hip.x.toFixed(1)+'" cy="'+s.hip.y.toFixed(1)+'" r="6.5" fill="'+ink+'"/>';
  o+='<circle cx="'+s.sh.x.toFixed(1)+'" cy="'+s.sh.y.toFixed(1)+'" r="8.5" fill="'+ink+'"/>';
  o+=limb(s.hip,s.kneeN,s.ankN,legCol,[11,8,5.5],true);
  if(!top&&!back) o+=rEquip(ex,s);
  o+='<circle cx="'+s.head.x.toFixed(1)+'" cy="'+s.head.y.toFixed(1)+'" r="'+RL.HEAD_R+'" fill="'+ink+'"/>';
  o+=limb(s.sh,s.elbN,s.handN,cut,[8,6,4.5],false,true);
  o+=limb(s.sh,s.elbN,s.handN,armCol,[8,6,4.5],false);
  if(top) o+=rEquip(ex,s);
  if(rq) o+='<path d="'+rRopePath(s.handN,rq,s.rope)+rst;
  return o+'</svg>';
}

function figureSVG(poseKey,phase,equip){
  var pair=PP[poseKey]||PP.SQUAT;
  var pose=pair[phase?1:0];
  var s=segFor(pose);
  var groundY=Math.max(s.hip.y,s.shoulder.y,s.ankle.y,s.knee.y)+14;
  var gx1=Math.min(s.hip.x,s.shoulder.x,s.ankle.x,s.hand.x)-30, gx2=Math.max(s.hip.x,s.shoulder.x,s.ankle.x,s.hand.x)+40;
  var joints=[s.shoulder,s.elbow,s.hip,s.knee,s.ankle];
  var jointDots=joints.map(function(j){return '<circle cx="'+j.x+'" cy="'+j.y+'" r="3.2" fill="var(--text)"/>';}).join('');
  return '<svg viewBox="-20 -20 180 200">'+
    equipGlyph(equip,s)+
    '<line x1="'+gx1+'" y1="'+groundY+'" x2="'+gx2+'" y2="'+groundY+'" stroke="var(--line)" stroke-width="2.5" stroke-dasharray="1 5" stroke-linecap="round"/>'+
    '<line x1="'+s.hip.x+'" y1="'+s.hip.y+'" x2="'+s.shoulder.x+'" y2="'+s.shoulder.y+'" stroke="var(--text)" stroke-width="7" stroke-linecap="round"/>'+
    '<line x1="'+s.shoulder.x+'" y1="'+s.shoulder.y+'" x2="'+s.elbow.x+'" y2="'+s.elbow.y+'" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/>'+
    '<line x1="'+s.elbow.x+'" y1="'+s.elbow.y+'" x2="'+s.hand.x+'" y2="'+s.hand.y+'" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/>'+
    '<line x1="'+s.hip.x+'" y1="'+s.hip.y+'" x2="'+s.knee.x+'" y2="'+s.knee.y+'" stroke="var(--text)" stroke-width="7" stroke-linecap="round"/>'+
    '<line x1="'+s.knee.x+'" y1="'+s.knee.y+'" x2="'+s.ankle.x+'" y2="'+s.ankle.y+'" stroke="var(--text)" stroke-width="7" stroke-linecap="round"/>'+
    jointDots+
    '<circle cx="'+s.headC.x+'" cy="'+s.headC.y+'" r="11" fill="var(--text)"/>'+
  '</svg>';
}
// Where in the rep the figure is, as a clock of its own (rigVT, ms into the
// rep, rigAt the moment it was last moved on). It belongs to the rig, not to
// the DOM node drawing it, so a render (a save, a tap) carries on mid-rep
// instead of snapping back to the start. Only moving to another rig starts it
// over. While the rest clock runs it runs at a third of the speed, so the
// figure moves in true slow motion, every frame drawn, rather than skipping.
var rigRaf=null, rigTm=null, rigVT=0, rigAt=0, rigPlay=false, rigLastId=null, rigIO=null, rigSeen=null, rigHidden=false;
// One knob for every rig's pace: above 1 slows them all alike, should the fast
// drills prove hard to follow.
var RIG_PACE=1;
function stillMotion(){ try{ return !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); }catch(err){ return false; } }
// A rep's length in ms and the frames it is drawn in, from pose/emit-rig.js:
// a frame every 50 ms, or 33 ms for a rig fast enough to strobe at 50.
function rigCycle(ex){ return (ex.cycleMs||2400)*RIG_PACE; }
function rigSteps(ex){ return ex.steps||48; }
// On the figure too, so it can be read off the page.
function rigData(id){ var ex=rigFor(id); return ex?' data-ms="'+rigCycle(ex)+'" data-steps="'+rigSteps(ex)+'"':''; }
// The still is where the rep turns around, the bottom of a squat or the top
// of a press (the rig's `still` keyframe): the start of most reps is just
// standing, and the end of the first segment is half way down.
function rigStillU(rigId){
  var ex=rigFor(rigId), t=ex.tempo||ex.frames.map(function(){ return 1; }), k=ex.still===undefined?1:ex.still, acc=0;
  for(var i=0;i<k&&i<t.length;i++) acc+=t[i];
  return acc/t.reduce(function(a,b){ return a+b; },0)%1;
}
/* A frame moves the figure already drawn: the same shapes in the same order,
   each given the new frame's attributes. Rebuilding both drawings with
   innerHTML thirty times a second kept a phone's main thread a quarter busy
   for the whole session. A shape whose kind changes (a leg swinging in front
   of the body as it comes toward the camera) is swapped on its own; a drawing
   with a different number of shapes is drawn whole. */
function svgShapes(html){
  return {h:html, s:(html.match(/<[a-z][^>]*>/g)||[]).map(function(tag){
    var a=[]; tag.replace(/([\w:-]+)="([^"]*)"/g,function(m,k,v){ a.push(k,v); return m; });
    return {n:tag.match(/^<([\w:-]+)/)[1], a:a};
  })};
}
function drawInPlace(el,d){
  var svg=el.firstElementChild, s=d.s, kids=svg?svg.children:[];
  if(!svg || svg.tagName!=='svg' || s.length!==kids.length+1){ el.innerHTML=d.h; return; }
  for(var i=0;i<s.length;i++){
    var node=i?kids[i-1]:svg, a=s[i].a;
    if(node.tagName!==s[i].n || node.attributes.length*2!==a.length){
      if(!i){ el.innerHTML=d.h; return; }
      var nn=document.createElementNS(svg.namespaceURI,s[i].n);
      for(var k=0;k<a.length;k+=2) nn.setAttribute(a[k],a[k+1]);

    }
    for(var j=0;j<a.length;j+=2) if(node.getAttribute(a[j])!==a[j+1]) node.setAttribute(a[j],a[j+1]);

// A rep is the rig's own number of frames, each drawn once and kept for the
// next rep, so solving the figure is the first rep's work only. One rig is
// kept at a time.
var rigDrawn={id:null, at:{}};
function drawRig(rigId,u){
  if(rigDrawn.id!==rigId) rigDrawn={id:rigId, at:{}};
  var k=u.toFixed(3), d=rigDrawn.at[k]||(rigDrawn.at[k]=[svgShapes(rigSVG(rigId,u)),svgShapes(rigFrontSVG(rigId,u))]);

function rigRate(){ return resting()?1/3:1; }
// Scrolled out of sight, the figure stops, and picks up where it was when it
// comes back.
function rigWatch(w){
  var box=w.closest('.fig-pair')||w.parentNode;

  if(!rigIO) rigIO=new IntersectionObserver(function(es){
    var e=es[es.length-1];

// Under reduced motion the figure is a still, and a tap on it plays one rep.
function startPoseLoop(play){
  stopPoseLoop();

  var rigId=w?w.getAttribute('data-rig'):null, still=!play && stillMotion();
  if(rigId && rigFor(rigId)){
    if(still){ drawRig(rigId,rigStillU(rigId)); return; }
    rigWatch(w);

    // flipping between two stills, because the path between the positions is
    // most of what a form reminder is for.

    var ex=rigFor(rigId), cyc=rigCycle(ex), n=rigSteps(ex), per=cyc/n, last=-1;

    // the next one is due, rather than waking for every screen refresh.

      rigRaf=null;
      var el=document.getElementById('fig-live');
      if(!el || el.getAttribute('data-rig')!==rigId) return;

      var rate=rigPlay?1:rigRate();

      if(play && rigVT>=cyc){ drawRig(rigId,rigStillU(rigId)); return; }

      // after it would be late, and waking for the one before it a waste.

    step(rigAt);

    var w2=document.getElementById('fig-live');
    if(w2){ var key=w2.getAttribute('data-pose'); var eq=w2.getAttribute('data-equip'); w2.innerHTML=figureSVG(key,poseFlip,eq); }
  };
  if(still){ if(w && poseFlip!==true) flip(true); return; }
  poseTimer=setInterval(function(){
    flip(!poseFlip);
    if(play && ++flips>=2){ clearInterval(poseTimer); poseTimer=null; flip(true); }
  },900);

// Both halves of the wait, the sleep and the frame it asks for: clearing only
// the frame left a sleeping one to wake a second chain after a render.
function stopPoseLoop(){
  if(poseTimer){ clearInterval(poseTimer); poseTimer=null; }
  if(rigRaf||rigTm){ var now=performance.now(); rigVT+=Math.max(0,now-rigAt)*(rigPlay?1:rigRate()); rigAt=now; }
  if(rigRaf){ cancelAnimationFrame(rigRaf); rigRaf=null; }
  if(rigTm){ clearTimeout(rigTm); rigTm=null; }
}

function bodyContent(){
  var t=peekDay(activeDate());
  var todaySaunaCount=state.saunaSessions.filter(function(s){return s.date===activeDate();}).length;
  var lvl=levelInfo();
  var streaks=computeStreaks(), weekN=weekSessions();
  // Trained as Progress counts it: a session logged that day, or the day ticked as trained.
  var loggedOn={}; state.workoutLogs.forEach(function(l){ loggedOn[l.date]=1; });
  var week=last7Keys().map(function(k){
    var e=state.days[k]; var cls='dot'; var dd=k.slice(8,10), said='not logged';
    if(e && e.touched){ cls+=' touched'; if(e.alcohol===0&&e.smoking===0&&e.weed===0){ cls+=' clean'; said='clean'; } else { cls+=' used'; said='used'; } }
    if(loggedOn[k] || (e && e.workout && e.workout.done)){ cls+=' trained'; said+=', trained'; }
    if(k===activeDate()) cls+=' active';
    // The strip is where you notice a gap, so it is also how you fix one.
    var pickable=k>=minLogDate() && k<=realToday();
    // The colour of a dot is what it says, so it says it in words too.
    return '<div class="'+cls+(pickable?' pickable':'')+'"'+(pickable?' data-action="pickday" data-k="'+k+'" role="button" tabindex="0" aria-label="Log for '+esc(prettyKey(k))+', '+said+'"':' role="img" aria-label="'+esc(prettyKey(k))+', '+said+'"')+
      (k===activeDate()?' aria-current="date"':'')+' title="'+esc(rowDate(k))+(pickable?': tap to log for this day':'')+'">'+dd+'</div>';
  }).join('');
  // Each view is built only when it is the one shown: building all four on
  // every tap was most of the work of a tap on Today.
  function todayView(){
  // A cup a tap, past the target too, but no more than a row holds: the count
  // above says how much.
  var cupsRow='', cupsN=Math.min(Math.max(state.waterTarget,t.water),40);
  for(var i=0;i<cupsN;i++){ cupsRow+='<div class="cup'+(i<t.water?' on':'')+'"></div>'; }
  var typePills=WORKOUT_TYPES.map(function(wt){
    var on=!!(t.workout.done && t.workout.type===wt);
    return '<button class="pill'+(on?' on':'')+'" data-action="workout" data-type="'+wt+'" aria-pressed="'+on+'">'+wt+'</button>';
  }).join('')+'<button class="pill'+(t.rest?' on':'')+'" data-action="rest" aria-pressed="'+!!t.rest+'">Rest day</button>';

  // Yesterday not logged is offered once, not nagged: it goes when the day is
  // filled in or waved off, and never while another day is being logged.
  var yk=unloggedYesterday();
  var nudge=(yk && !backfilling() && nudgeOff!==yk)
    ? ('<div class="nudge"><span>Yesterday isn&#39;t logged. Fill it in?</span>'+
       '<span class="btns"><button class="go" data-action="pickday" data-k="'+yk+'">Log yesterday</button>'+
       '<button data-action="nudgeoff" data-k="'+yk+'">Nothing to log</button></span></div>')
    : '';

  // a card of its own.
  function habitRow(k,name,unit,less,more){
    return '<div class="habit"><span class="hl">'+name+'<small>'+unit+'</small></span><div class="stepper">'+
      '<button data-action="'+k+'" data-d="-1" aria-label="'+less+'">-</button><span class="count">'+t[k]+'</span>'+
      '<button data-action="'+k+'" data-d="1" aria-label="'+more+'">+</button></div></div>';
  }
  var saunaOpen=!!expanded.sauna||saunaDraft.length>0;
  return resumeBannerHtml(false)+nudge+
    '<div class="grid">'+
      '<div class="card"><h3>Water</h3><div class="sub tgt"><button class="tgtopen" data-action="toggleex" data-id="watertgt" aria-expanded="'+!!expanded.watertgt+'">Target <b>'+litres(state.waterTarget)+'</b> a day</button>'+
          (expanded.watertgt?'<button data-action="watertarget" data-d="-1" aria-label="Lower the water target">&minus;</button>'+
          '<button data-action="watertarget" data-d="1" aria-label="Raise the water target">+</button>':'')+'</div>'+
        '<div class="stepper"><button data-action="water" data-d="-1" aria-label="Less water">-</button><span class="count">'+litres(t.water)+'</span><button class="big" data-action="water" data-d="1" aria-label="More water">+</button></div>'+
        '<div class="dots">'+cupsRow+'</div></div>'+
      // The counts logged most days sit together, straight under Water, so all
      // of them are on the first screen of a phone.

  function trainingView(){
  // Lines that start with a day ("Mon: ...") read as a list; the rest is advice
  // and gets its own paragraph, so a template is not one dense block.
  function notesHtml(txt){
    var out='', list=[];
    var flush=function(){ if(list.length) out+='<ul class="plainlist">'+list.join('')+'</ul>'; list=[]; };
    String(txt).split('\n').forEach(function(ln){
      if(/^\s*(Mon|Tue|Wed|Thu|Fri|Sat|Sun)[a-z]*\s*:/i.test(ln)) list.push('<li>'+esc(ln)+'</li>');
      else { flush(); if(ln.trim()) out+='<p>'+esc(ln)+'</p>'; }
    });
    flush(); return out;
  }
  var trainingItems=state.library.map(function(item){
    // Under the Overview heading an "Overview" tag only says it twice.
    var tagShown=String(item.tag||'').toLowerCase()!=='overview';
    return '<div class="libitem"><div class="row"><div>'+(tagShown?'<span class="tag">'+esc(item.tag)+'</span>':'')+'<h3>'+esc(item.title)+'</h3></div>'+
      '<button class="x" data-action="dellib" data-id="'+item.id+'" aria-label="Remove '+esc(item.title)+'">&times;</button></div>'+(item.notes?notesHtml(item.notes):'')+'</div>';
  }).join('');

  var resumeBanner=resumeBannerHtml(true);
  var recentW=recentWorkouts(3);
  var card=function(w){
    var meta=w.plan.length?(w.plan.length+' exercises'):'Build it as you go', ago=lastDoneAgo(w.id);
    if(ago) meta+=' &middot; '+ago;
    // Logged sets are never swapped out silently: finish or discard them first.

    var busy=sessionBusy(w.id);
    var start='<button class="start" data-action="startworkout" data-id="'+w.id+'"'+
      (busy?' disabled title="Finish or discard the session in progress first">Start':resumesOnStart(w.id)?'>Resume':'>Start')+'</button>';

    ? '<h3 class="wgroup">Recent</h3>'+recentW.map(card).join('')+'<h3 class="wgroup">All workouts</h3>'+
      WORKOUTS.filter(function(w){ return recentW.indexOf(w)<0; }).map(card).join('')
    : WORKOUTS.map(card).join('');
  // Workouts first: they are what this tab is opened for. The notes follow.
  return '<h2 class="sectiontitle" id="workouts">Workouts</h2>'+
    '<div class="weekgoal"><span>Last 7 days: '+(weekN>=state.weekTarget?('<b>'+weekN+' session'+(weekN===1?'':'s')+'</b>, target '+state.weekTarget+' hit'):('<b>'+weekN+' of '+state.weekTarget+'</b> sessions'))+'</span><span class="tgt">'+
      '<button data-action="weektarget" data-d="-1" aria-label="Fewer sessions a week">-</button>'+
      '<button data-action="weektarget" data-d="1" aria-label="More sessions a week">+</button></span></div>'+
    resumeBanner+workoutCards+
    '<h2 class="sectiontitle">Overview</h2>'+trainingItems+
    '<div class="addform"><strong class="formhead">Add a note or adjustment</strong>'+
      '<input id="lib-title" placeholder="Title" maxlength="80">'+
      '<select id="lib-tag" aria-label="Kind"><option>Note</option><option>Adjustment</option><option>Other</option></select>'+
      '<textarea id="lib-notes" placeholder="Notes"></textarea>'+formNoteHtml('lib')+
      '<button data-action="addlib">Add to training plan</button></div>';
  }

  function mealsView(){
  // The calendar: seven rolling days, each showing the meals planned on it.
  // Empty days are drawn too, because a gap in the week is the thing you want
  // to notice.
  var planDays=planDates();
  var shopDates=planWindow(shopRange);
  var calRows=planDays.map(function(k,i){
    var meals=planEntries([k]);
    var rows=meals.map(function(e){
      var r=planRecipe(e);
      return '<div class="mealrow">'+
        '<span class="slot">'+esc(hasOwn(SLOT_LABEL,e.slot)?SLOT_LABEL[e.slot]:e.slot)+'</span>'+
        '<span class="mt">'+esc(r?r.title:'(recipe removed)')+'</span>'+
        '<span class="mp">'+
          '<button data-action="mealportions" data-id="'+esc(e.id)+'" data-d="-1" aria-label="One portion less">-</button>'+

          '<button data-action="mealportions" data-id="'+esc(e.id)+'" data-d="1" aria-label="One portion more">+</button>'+
        '</span>'+

    return '<div class="calday'+(i===0?' today':'')+(meals.length?'':' bare')+'">'+
