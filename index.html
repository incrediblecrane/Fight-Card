*{box-sizing:border-box;}\
:root{\
  --bg:#EEEAE1;--surface:#FFFFFF;--surface-raised:#F7F3EA;\
  --text:#18181C;--text-soft:#55555F;--text-faint:#8A8A93;\
  --accent:#E8500F;--accent-ink:#FFFFFF;--good:#2E8B57;--warn:#B8790A;--line:#DAD4C6;\
}\
@media (prefers-color-scheme: dark){\
  :root:not([data-theme=light]){\
    --bg:#15151B;--surface:#1E1E27;--surface-raised:#262631;\
    --text:#EDEAE2;--text-soft:#A6A6B0;--text-faint:#6E6E78;\
    --accent:#FF5A1F;--accent-ink:#15151B;--good:#4CAF6D;--warn:#F2B134;--line:#303038;\
  }\
}\
:root[data-theme=dark]{\
  --bg:#15151B;--surface:#1E1E27;--surface-raised:#262631;\
  --text:#EDEAE2;--text-soft:#A6A6B0;--text-faint:#6E6E78;\
  --accent:#FF5A1F;--accent-ink:#15151B;--good:#4CAF6D;--warn:#F2B134;--line:#303038;\
}\
body{margin:0;background:var(--bg);color:var(--text);font-family:'Work Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}\
.wrap{max-width:680px;margin:0 auto;padding:18px 16px 90px;}\
.hud{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px;}\
.hud-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}\
.brand{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:0.02em;font-size:1.5rem;text-transform:uppercase;margin:0;}\
.brand span{color:var(--accent);}\
.date{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--text-faint);text-align:right;line-height:1.5;}\
.lvl-row{display:flex;align-items:center;gap:10px;margin-top:14px;}\
.lvl-badge{font-family:'Anton',sans-serif;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:4px 10px;font-size:1rem;letter-spacing:0.02em;white-space:nowrap;}\
.xp-track{flex:1;height:8px;border-radius:5px;background:var(--surface-raised);border:1px solid var(--line);overflow:hidden;}\
.xp-fill{height:100%;background:var(--accent);border-radius:5px 0 0 5px;}\
.xp-num{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;color:var(--text-faint);white-space:nowrap;font-variant-numeric:tabular-nums;}\
.streaks{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap;}\
.streak{font-family:'IBM Plex Mono',monospace;}\
.streak .n{font-size:1.4rem;font-weight:600;font-variant-numeric:tabular-nums;}\
.streak .l{font-size:0.66rem;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.08em;display:block;}\
.week{display:flex;gap:6px;margin-top:14px;}\
.dot{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:0.6rem;color:var(--text-faint);}\
.dot.touched{border-color:var(--accent);color:var(--text);}\
.dot.clean{background:var(--good);border-color:var(--good);color:#fff;}\
.dot.flagged{background:var(--warn);border-color:var(--warn);color:#1a1a1a;}\
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}\
.tab{font-family:'IBM Plex Mono',monospace;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.05em;background:none;border:1px solid var(--line);color:var(--text-soft);padding:8px 14px;border-radius:8px;cursor:pointer;}\
.tab.active{background:var(--text);color:var(--bg);border-color:var(--text);}\
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}\
@media (max-width:420px){.grid{grid-template-columns:1fr;}}\
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;}\
.card h3{font-family:'Anton',sans-serif;font-weight:400;font-size:1.05rem;letter-spacing:0.01em;text-transform:uppercase;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;}\
.card .sub{font-size:0.78rem;color:var(--text-faint);margin:-6px 0 12px;}\
.linklike{background:none;border:none;color:var(--accent);font-family:'IBM Plex Mono',monospace;font-size:0.72rem;cursor:pointer;padding:0;margin-top:10px;display:block;}\
.stepper{display:flex;align-items:center;gap:12px;}\
.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-raised);color:var(--text);font-size:1.2rem;cursor:pointer;}\
.stepper button.big{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}\
.stepper .count{font-family:'IBM Plex Mono',monospace;font-size:1.6rem;font-weight:600;min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums;}\
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;}\
.dots .cup{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line);}\
.dots .cup.on{background:var(--accent);border-color:var(--accent);}\
.pillgrid{display:flex;flex-wrap:wrap;gap:8px;}\
.pill{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;padding:8px 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface-raised);color:var(--text-soft);cursor:pointer;}\
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}\
.note{font-size:0.78rem;color:var(--text-faint);margin-top:10px;}\
.sectiontitle{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:1.1rem;letter-spacing:0.01em;margin:26px 0 10px;}\
.sectiontitle:first-child{margin-top:0;}\
.libitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;}\
.libitem .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}\
.libitem h4{font-family:'Work Sans',sans-serif;font-weight:700;font-size:0.98rem;margin:0 0 4px;}\
.libitem .tag{font-family:'IBM Plex Mono',monospace;font-size:0.64rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--accent);}\
.libitem p{font-size:0.86rem;color:var(--text-soft);margin:6px 0 0;white-space:pre-wrap;}\
.libitem ul{margin:8px 0 0;padding-left:1.1em;font-size:0.86rem;color:var(--text-soft);}\
.libitem li{margin:2px 0;}\
.libitem .x{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:1rem;padding:2px 6px;}\
.recipe-controls{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap;}\
.recipe-controls select{font-family:'IBM Plex Mono',monospace;font-size:0.74rem;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface-raised);color:var(--text);}\
.inplan{display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:0.74rem;color:var(--text-soft);cursor:pointer;}\
.addform{background:var(--surface-raised);border:1px dashed var(--line);border-radius:12px;padding:14px 16px;margin-top:16px;}\
.addform input,.addform select,.addform textarea{width:100%;font-family:'Work Sans',sans-serif;font-size:0.9rem;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);margin-top:8px;}\
.addform textarea{min-height:60px;resize:vertical;}\
.addform button{margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:0.78rem;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;padding:9px 16px;cursor:pointer;}\
.weekbox{background:var(--surface-raised);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;}\
.weekbox .empty{color:var(--text-faint);font-size:0.86rem;}\
.weekrow{display:flex;justify-content:space-between;font-size:0.86rem;padding:4px 0;border-bottom:1px solid var(--line);}\
.weekrow:last-child{border-bottom:none;}\
.weekrow .d{font-family:'IBM Plex Mono',monospace;color:var(--accent);font-size:0.72rem;text-transform:uppercase;min-width:3.2em;}\
.shop{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:0.9rem;}\
.shop:last-child{border-bottom:none;}\
.shop .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);flex-shrink:0;}\
.shop.checked{color:var(--text-faint);text-decoration:line-through;}\
.shop.checked .box{background:var(--good);border-color:var(--good);}\
.clearbtn{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;text-transform:uppercase;background:none;border:1px solid var(--line);color:var(--text-soft);border-radius:8px;padding:7px 12px;cursor:pointer;margin-top:10px;}\
.banner{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--warn);text-align:center;margin-bottom:10px;}\
.resume-banner{background:var(--surface-raised);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:0.86rem;}\
.resume-banner .btns{display:flex;gap:8px;flex-shrink:0;}\
.resume-banner button.go{font-family:'IBM Plex Mono',monospace;font-size:0.74rem;background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;padding:8px 12px;cursor:pointer;}\
.resume-banner button.x{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:1rem;}\
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;}\
.wcard .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}\
.wcard h4{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:1.05rem;margin:0 0 4px;}\
.wcard .meta{font-size:0.78rem;color:var(--text-faint);}\
.wcard .start{font-family:'IBM Plex Mono',monospace;font-size:0.76rem;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;padding:9px 14px;cursor:pointer;white-space:nowrap;}\
.story{max-width:420px;margin:0 auto;}\
.story-bar{display:flex;gap:4px;margin-bottom:12px;}\
.story-bar i{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;position:relative;}\
.story-bar i b{display:block;height:100%;background:var(--accent);width:0%;}\
.story-bar i.done b{width:100%;}\
.story-bar i.now b{width:100%;}\
.story-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;}\
.story-head button{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;background:none;border:1px solid var(--line);color:var(--text-soft);border-radius:8px;padding:7px 10px;cursor:pointer;white-space:nowrap;}\
.story-title{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:0.95rem;color:var(--text-faint);margin:0;}\
.slide{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;touch-action:pan-y;}\
.fig-wrap{background:var(--surface-raised);border-radius:14px;display:flex;align-items:center;justify-content:center;padding:10px 0;margin-bottom:14px;}\
.fig-wrap svg{width:155px;height:172px;}\
.fig-wrap svg line,.fig-wrap svg circle{transition:all .7s cubic-bezier(.4,0,.2,1);}\
@media (prefers-reduced-motion:reduce){.fig-wrap svg line,.fig-wrap svg circle{transition:none;}}\
.slide h4{font-family:'Work Sans',sans-serif;font-weight:700;font-size:1.15rem;margin:0 0 2px;text-align:center;}\
.slide .cat{font-family:'IBM Plex Mono',monospace;font-size:0.66rem;color:var(--accent);text-transform:uppercase;letter-spacing:0.06em;text-align:center;display:block;margin-bottom:8px;}\
.slide .target{font-family:'IBM Plex Mono',monospace;font-size:0.78rem;color:var(--text-faint);text-align:center;}\
.slide .cue{font-size:0.85rem;color:var(--text-soft);text-align:center;margin:8px 0 14px;}\
.setchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;justify-content:center;}\
.setchip{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;background:var(--surface-raised);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-variant-numeric:tabular-nums;}\
.logrow{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;}\
.logrow input{width:76px;font-family:'IBM Plex Mono',monospace;font-size:1rem;padding:10px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface-raised);color:var(--text);text-align:center;}\
.logrow button{font-family:'IBM Plex Mono',monospace;font-size:0.76rem;background:var(--good);color:#fff;border:none;border-radius:8px;padding:10px 14px;cursor:pointer;}\
.logrow .undo{background:none;color:var(--text-faint);border:1px solid var(--line);}\
.cardio-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}\
.cardio-select{font-family:'IBM Plex Mono',monospace;font-size:0.78rem;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface-raised);color:var(--text);}\
.sauna-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}\
.sauna-row input{width:64px;font-family:'IBM Plex Mono',monospace;font-size:0.85rem;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface-raised);color:var(--text);text-align:center;}\
.sauna-row select{font-family:'IBM Plex Mono',monospace;font-size:0.78rem;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface-raised);color:var(--text);}\
.logbtn{display:block;margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:0.76rem;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;padding:9px 14px;cursor:pointer;}\
.storynav{display:flex;gap:10px;margin-top:16px;}\
.storynav button{flex:1;font-family:'IBM Plex Mono',monospace;font-size:0.8rem;text-transform:uppercase;border-radius:10px;padding:13px;cursor:pointer;border:1px solid var(--line);background:var(--surface-raised);color:var(--text);}\
.storynav button.next{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}\
.storynav button.finish{background:var(--text);border-color:var(--text);color:var(--bg);}\
.storynav button.skip{background:none;color:var(--text-faint);border-style:dashed;flex:0.7;}\
.storynav button:disabled{opacity:0.35;cursor:default;}\
.addex-btn{display:block;width:100%;margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:0.74rem;text-transform:uppercase;background:none;border:1px dashed var(--line);color:var(--text-soft);border-radius:10px;padding:10px;cursor:pointer;}\
.discard-btn{display:block;width:100%;margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:0.7rem;background:none;border:none;color:var(--text-faint);cursor:pointer;padding:6px;}\
.picker{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;}\
.picker input{width:100%;font-family:'Work Sans',sans-serif;font-size:0.92rem;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-raised);color:var(--text);margin-bottom:12px;}\
.pickgroup-title{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--accent);padding:16px 4px 4px;}\
.pickrow{border-bottom:1px solid var(--line);}\
.pickrow:last-child{border-bottom:none;}\
.pickrow-head{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;gap:10px;}\
.pickrow-main{flex:1;cursor:pointer;}\
.pickrow-main .n{font-size:0.92rem;font-weight:600;}\
.pickrow-main .c{font-family:'IBM Plex Mono',monospace;font-size:0.66rem;color:var(--text-faint);text-transform:uppercase;}\
.pickrow-head button{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;padding:7px 12px;cursor:pointer;flex-shrink:0;}\
.pickrow-head button.added{background:var(--surface-raised);color:var(--text-faint);}\
.pickpreview{padding:0 4px 16px;}\
.preview-figs{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:10px;}\
.preview-figs .pf{width:80px;}\
.preview-figs .pf svg{width:100%;display:block;}\
.preview-figs .arrow{color:var(--text-faint);font-size:1.1rem;}\
.pickpreview .cue{font-size:0.8rem;color:var(--text-soft);text-align:center;margin:0;}\
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:6px;}\
.stat-tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}\
.stat-tile .n{font-family:'IBM Plex Mono',monospace;font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;}\
.stat-tile .l{font-size:0.7rem;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.06em;}.stat-tile .sub-l{font-size:0.66rem;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;margin-top:3px;opacity:0.8;}\
.exrow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;}\
.exrow .top{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px;}\
.exrow .top h4{font-size:0.94rem;margin:0;font-family:'Work Sans',sans-serif;font-weight:700;}\
.exrow .top .last{font-size:0.74rem;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;white-space:nowrap;}\
.exdetail{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;overflow-x:auto;}\
.exdetail table{width:100%;border-collapse:collapse;font-size:0.8rem;}\
.exdetail td,.exdetail th{padding:4px 6px 4px 0;text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap;}\
.exdetail th{color:var(--text-faint);font-family:'IBM Plex Mono',monospace;font-size:0.64rem;text-transform:uppercase;}\
.bartrack{background:var(--surface-raised);border-radius:3px;overflow:hidden;width:60px;height:6px;}\
.bar{height:6px;background:var(--accent);border-radius:3px;}\
.recent-log{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:0.86rem;display:flex;justify-content:space-between;gap:10px;}\
.recent-log .d{color:var(--text-faint);font-family:'IBM Plex Mono',monospace;font-size:0.74rem;white-space:nowrap;}\

function segFor(pose){
  var hip={x:55,y:88+(pose.hipY||0)};
  var shoulder=pt(hip.x,hip.y,34,pose.torso);
  var headC=pt(shoulder.x,shoulder.y,10,pose.torso);
  var elbow=pt(shoulder.x,shoulder.y,20,pose.armR);
  var hand=pt(elbow.x,elbow.y,18,pose.forearmR);
  var knee=pt(hip.x,hip.y,28,pose.legR);
  var ankle=pt(knee.x,knee.y,26,pose.shinR);
  return {hip:hip,shoulder:shoulder,headC:headC,elbow:elbow,hand:hand,knee:knee,ankle:ankle};
}

function equipGlyph(kind,s){
  if(!kind) return '';
  if(kind==='barbell'){
    return '<line x1="'+(s.hand.x-24)+'" y1="'+s.hand.y+'" x2="'+(s.hand.x+24)+'" y2="'+s.hand.y+'" stroke="var(--text-soft)" stroke-width="3"/>'+
      '<circle cx="'+(s.hand.x-24)+'" cy="'+s.hand.y+'" r="6" fill="none" stroke="var(--text-soft)" stroke-width="2.5"/>'+
      '<circle cx="'+(s.hand.x+24)+'" cy="'+s.hand.y+'" r="6" fill="none" stroke="var(--text-soft)" stroke-width="2.5"/>';
  }
  if(kind==='dumbbell'){
    return '<line x1="'+(s.hand.x-8)+'" y1="'+s.hand.y+'" x2="'+(s.hand.x+8)+'" y2="'+s.hand.y+'" stroke="var(--text-soft)" stroke-width="3"/>'+
      '<circle cx="'+(s.hand.x-8)+'" cy="'+s.hand.y+'" r="4" fill="var(--text-soft)"/>'+
      '<circle cx="'+(s.hand.x+8)+'" cy="'+s.hand.y+'" r="4" fill="var(--text-soft)"/>';
  }
  if(kind==='kettlebell'){
    return '<circle cx="'+s.hand.x+'" cy="'+(s.hand.y+10)+'" r="8" fill="none" stroke="var(--text-soft)" stroke-width="2.5"/>'+
      '<path d="M'+(s.hand.x-4)+' '+(s.hand.y+3)+' Q'+s.hand.x+' '+(s.hand.y-6)+' '+(s.hand.x+4)+' '+(s.hand.y+3)+'" fill="none" stroke="var(--text-soft)" stroke-width="2.5"/>';
  }
  if(kind==='band'){
    return '<path d="M'+s.hand.x+' '+s.hand.y+' q8 10 0 20 q-8 10 0 20" fill="none" stroke="var(--accent)" stroke-width="2" opacity="0.55"/>';
  }
  if(kind==='bar'){
    return '<line x1="'+(s.hand.x-30)+'" y1="'+(s.hand.y-2)+'" x2="'+(s.hand.x+30)+'" y2="'+(s.hand.y-2)+'" stroke="var(--text-soft)" stroke-width="4" stroke-linecap="round"/>';
  }
  if(kind==='dipbars'){
    return '<line x1="'+(s.hand.x-2)+'" y1="'+(s.hand.y-16)+'" x2="'+(s.hand.x-2)+'" y2="'+(s.hand.y+16)+'" stroke="var(--text-soft)" stroke-width="3" stroke-linecap="round"/>';
  }
  if(kind==='wall'){
    return '<line x1="14" y1="-16" x2="14" y2="170" stroke="var(--text-soft)" stroke-width="3" opacity="0.6"/>';
  }
  if(kind==='box'){
    return '<rect x="86" y="128" width="34" height="34" fill="none" stroke="var(--text-soft)" stroke-width="2.5"/>';
  }
  return '';
}

function pad(n){return n<10?'0'+n:''+n;}
function dateKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
// realToday() is the wall clock. activeDate() is the day being LOGGED TO,
// which the date picker can move into the past. Every read of "now" uses the
// first; every write uses the second. Both used to be one function, so a date
// picker would have silently redirected all seven writers at once with
// nothing on screen looking different.
function realToday(){return dateKey(new Date());}
var BACKFILL_DAYS=14;
function minLogDate(){ var d=new Date(); d.setDate(d.getDate()-(BACKFILL_DAYS-1)); return dateKey(d); }
// Saving republishes the whole document and EVERY open view reloads onto it,
// so anything held only in a variable is wiped on every single tap. That is why
// the app keeps uiTab and friends in state. The log date needs the opposite
// pair of properties: survive a save, but NOT survive closing the app. That is
// exactly sessionStorage, which the reload keeps and closing the tab clears.
// It deliberately does not go in state: a backdate is this device's editing
// position, not part of the record, and it must never sync to another device.
var LOGDATE_KEY='fc.logDate';
function readStoredDate(){ try{ return sessionStorage.getItem(LOGDATE_KEY); }catch(e){ return null; } }
function writeStoredDate(v){ try{ if(v) sessionStorage.setItem(LOGDATE_KEY,v); else sessionStorage.removeItem(LOGDATE_KEY); }catch(e){} }
function setLogDate(v){
  logDate=(v && v>=minLogDate() && v<=realToday()) ? v : realToday();
  writeStoredDate(logDate===realToday()?null:logDate);
  return logDate;
}
function activeDate(){
  if(logDate===null) logDate=readStoredDate();
  // Re-check the bounds every time: a tab left open for weeks must not keep
  // writing to a day that has fallen outside the backfill window.
  if(!logDate || logDate>realToday() || logDate<minLogDate()) setLogDate(null);
  return logDate;
}
function backfilling(){ return activeDate()!==realToday(); }
// Card copy has to name the day it is actually writing to.

/* ---------- charts ----------------------------------------------------
   Inline SVG, no library: the page has a strict CSP and one measure per
   chart, so a single hue carries it and no legend is needed. Hover text
   rides on <title>, which needs no tooltip layer to keep in sync. */
function chartEmpty(msg){ return '<div class="chart empty-chart">'+esc(msg)+'</div>'; }
function chartHead(title,sub){ return '<div class="chart-head"><h4>'+esc(title)+'</h4><span class="sub">'+esc(sub||'')+'</span></div>'; }

// rows: [{k:axis label, v:number, lbl:display value, tip:hover text, state:'warn'|'mute'}]
function barChart(rows,opts){
  opts=opts||{};
  if(!rows.length) return chartEmpty(opts.empty||'Nothing logged yet.');
  var W=680,H=opts.h||124,padT=16,padB=18;
  var max=Math.max.apply(null,rows.map(function(r){return r.v;}).concat([opts.target||0]));
  if(max<=0) max=1;
  var slot=W/rows.length, bw=Math.max(3,Math.min(30,slot-3)), plotH=H-padT-padB, base=padT+plotH;
  var bars=rows.map(function(r,i){
    var x=Math.round(i*slot+(slot-bw)/2);
    var tip='<title>'+esc(r.tip||'')+'</title>';
    if(!(r.v>0)) return '<rect x="'+x+'" y="'+(base-2)+'" width="'+bw+'" height="2" rx="1" fill="var(--line)">'+tip+'</rect>';
    var h=Math.max(3,Math.round(r.v/max*plotH));
    var fill=r.state==='warn'?'var(--warn)':(r.state==='mute'?'var(--line)':'var(--accent)');
    return '<rect x="'+x+'" y="'+(base-h)+'" width="'+bw+'" height="'+h+'" rx="4" fill="'+fill+'">'+tip+'</rect>';
  }).join('');
  var tline='';
  if(opts.target){
    var ty=base-Math.round(opts.target/max*plotH);
    tline='<line x1="0" y1="'+ty+'" x2="'+W+'" y2="'+ty+'" stroke="var(--text-faint)" stroke-width="1" stroke-dasharray="4 4"/>'+
      '<text x="'+W+'" y="'+(ty-4)+'" text-anchor="end" class="c-lbl">'+esc(opts.targetLabel||'target')+'</text>';
  }
  // Ends get the dates, the peak gets its value. A number on every bar is
  // unreadable at this width and adds nothing.
  var peak=0; rows.forEach(function(r,i){ if(r.v>rows[peak].v) peak=i; });
  var labels='<text x="0" y="'+(H-4)+'" class="c-lbl">'+esc(rows[0].k)+'</text>';
  if(rows.length>1) labels+='<text x="'+W+'" y="'+(H-4)+'" text-anchor="end" class="c-lbl">'+esc(rows[rows.length-1].k)+'</text>';
  if(rows[peak].v>0) labels+='<text x="'+Math.round(peak*slot+slot/2)+'" y="'+(base-Math.max(3,Math.round(rows[peak].v/max*plotH))-5)+'" text-anchor="middle" class="c-val">'+esc(rows[peak].lbl||String(rows[peak].v))+'</text>';
  return '<div class="chart">'+(opts.title?chartHead(opts.title,opts.sub):'')+
    '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.aria||opts.title||'bar chart')+'">'+
    '<line x1="0" y1="'+base+'" x2="'+W+'" y2="'+base+'" stroke="var(--line)" stroke-width="1"/>'+
    tline+bars+labels+'</svg>'+(opts.foot||'')+'</div>';
}

// pts: [{k:axis label, v:number, lbl:display value, tip:hover text}]
function lineChart(pts,opts){
  opts=opts||{};
  if(pts.length<2) return '<div class="chart">'+(opts.title?chartHead(opts.title,opts.sub):'')+
    '<div class="empty-chart">'+esc(opts.empty||'Log this on a second day to see a trend.')+'</div></div>';
  var W=680,H=150,padT=20,padB=22,padX=14;
  var vals=pts.map(function(p){return p.v;});
  var max=Math.max.apply(null,vals), min=Math.min.apply(null,vals);
  if(max===min){ max=max+1; min=Math.max(0,min-1); }
  var plotH=H-padT-padB, plotW=W-padX*2, base=padT+plotH;
  function X(i){ return padX+i/(pts.length-1)*plotW; }
  function Y(v){ return base-(v-min)/(max-min)*plotH; }
  var d=pts.map(function(p,i){ return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1); }).join(' ');
  var dots=pts.map(function(p,i){
    return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"><title>'+esc(p.tip||'')+'</title></circle>';
  }).join('');
  var first=pts[0], last=pts[pts.length-1];
  var lbls='<text x="0" y="'+(H-4)+'" class="c-lbl">'+esc(first.k)+'</text>'+
    '<text x="'+W+'" y="'+(H-4)+'" text-anchor="end" class="c-lbl">'+esc(last.k)+'</text>'+
    '<text x="'+X(0).toFixed(1)+'" y="'+(Y(first.v)-9).toFixed(1)+'" text-anchor="start" class="c-val">'+esc(first.lbl||String(first.v))+'</text>'+
    '<text x="'+X(pts.length-1).toFixed(1)+'" y="'+(Y(last.v)-9).toFixed(1)+'" text-anchor="end" class="c-val">'+esc(last.lbl||String(last.v))+'</text>';
  return '<div class="chart">'+(opts.title?chartHead(opts.title,opts.sub):'')+
    '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.aria||opts.title||'line chart')+'">'+
    '<line x1="0" y1="'+base+'" x2="'+W+'" y2="'+base+'" stroke="var(--line)" stroke-width="1"/>'+
    '<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    dots+lbls+'</svg></div>';
}
// The number that actually shows progress for one session of one exercise:
// heaviest set for a loaded lift, best single set for everything else.
function bestSet(type,sets){
  var best=null;
  sets.forEach(function(s){
    if(type==='load'){ if(!best || (s.w||0)>(best.w||0) || ((s.w||0)===(best.w||0) && s.v>best.v)) best=s; }
    else if(!best || s.v>best.v) best=s;
  });
  return best;
}
function bestValue(type,s){ return type==='load'?(s.w||0):s.v; }
function bestUnit(type){ return type==='load'?'kg':type==='time'?'s':type==='distance'?'m':type==='cardio'?'min':'reps'; }
function computeStreaks(){
  var d=new Date();
  var todayEntry=state.days[dateKey(d)];
  if(!todayEntry || !todayEntry.touched){ d.setDate(d.getDate()-1); }
  var dayStreak=0, cleanStreak=0; var breakingDay=false, breakingClean=false;
  for(var i=0;i<400;i++){
    var k=dateKey(d); var entry=state.days[k];
    if(!breakingDay){ if(entry && entry.touched) dayStreak++; else breakingDay=true; }
    if(!breakingClean){ if(entry && entry.touched && entry.alcohol===0 && entry.smoking===0 && entry.weed===0) cleanStreak++; else breakingClean=true; }
    if(breakingDay && breakingClean) break;
    d.setDate(d.getDate()-1);
  }
  return {dayStreak:dayStreak,cleanStreak:cleanStreak};
}
function addXp(n){ state.totalXp+=n; if(state.totalXp<0) state.totalXp=0; }
function scheduleSave(){ if(saveTimer) clearTimeout(saveTimer); saveTimer=setTimeout(persist,1000); }
function persist(){
  if(!window.claude || !window.claude.use){ render(); return; }
  saving=true; render();
  claude.use('artifact').then(function(ns){
    artifactApi=ns;
    if(!ns){ saving=false; render(); return; }
    return ns.publish(fullDocument(state)).then(function(){ saving=false; }).catch(function(err){
      saving=false;
      if(err && err.code==='conflict'){ return; }
      render();
    });
  });
}
function shoppingList(){
  var seen={}, out=[];
  state.recipes.forEach(function(r){
    if(!r.inPlan) return;
    (r.ingredients||[]).forEach(function(ing){ var key=ing.trim().toLowerCase(); if(!key||seen[key]) return; seen[key]=true; out.push(ing.trim()); });
  });
  out.sort(function(a,b){return a.toLowerCase().localeCompare(b.toLowerCase());});
  return out;
}
function setLabel(type,e){
  if(type==='load') return (e.w?e.w+'kg × '+e.v:e.v+' reps');
  if(type==='time') return e.v+'s';
  if(type==='distance') return e.v+'m';
  if(type==='cardio'){
    var label=e.v+' min'+(e.machine?' · '+e.machine:'');
    if(e.work||e.rest) label+=' · '+(e.work||'—')+'/'+(e.rest||'—');
    return label;
  }
  return e.v+' reps';
}

function startWorkout(id){
  var w=WORKOUTS.filter(function(x){return x.id===id;})[0];
  if(!w) return;
  if(!state.activeSession || state.activeSession.workoutId!==id){
    state.activeSession={workoutId:id,startedAt:activeDate(),exIds:w.plan.map(function(p){return p.ex;}),targets:{},logs:{}};
    w.plan.forEach(function(p){ state.activeSession.targets[p.ex]={sets:p.sets,reps:p.reps}; });
  }
  slide=0; addingExercise=false; viewingSession=true;
}
function logSet(exId,type){
  var valInput=document.getElementById('log-v-'+exId);
  if(!valInput) return;
  var v=parseFloat(valInput.value);
  if(isNaN(v)||v<=0) return;
  var entry={v:v,w:null};
  if(type==='load'){ var wInput=document.getElementById('log-w-'+exId); var wt=wInput?parseFloat(wInput.value):NaN; entry.w=isNaN(wt)?null:wt; }
  if(type==='cardio'){
    var mEl=document.getElementById('log-machine-'+exId); entry.machine=mEl?mEl.value:'';
    var wkEl=document.getElementById('log-work-'+exId); if(wkEl) entry.work=wkEl.value;
    var rEl=document.getElementById('log-rest-'+exId); if(rEl) entry.rest=rEl.value;
  }
  if(!state.activeSession.logs[exId]) state.activeSession.logs[exId]=[];
  state.activeSession.logs[exId].push(entry);
}
function undoSet(exId){ var arr=state.activeSession && state.activeSession.logs[exId]; if(arr&&arr.length) arr.pop(); }
function finishWorkout(){
  var sess=state.activeSession; if(!sess) return;
  var w=WORKOUTS.filter(function(x){return x.id===sess.workoutId;})[0];
  var title=w?w.title:'Workout', tag=w?w.tag:'Strength';
  state.workoutLogs.push({id:'wl'+Date.now(),workoutId:sess.workoutId,title:title,tag:tag,date:sess.startedAt||activeDate(),logs:sess.logs});
  var today=ensureDay(sess.startedAt||activeDate());
  if(!today.workout.done) addXp(XP_WORKOUT);
  today.workout.done=true; today.workout.type=tag; today.rest=false; today.touched=true;
  state.activeSession=null; viewingSession=false; tab='progress';
}
function addExToSession(exId){
  if(!state.activeSession) return;
  if(state.activeSession.exIds.indexOf(exId)>-1) return;
  state.activeSession.exIds.push(exId);
  var def=exDef(exId);
  state.activeSession.targets[exId]={sets:def.sets,reps:def.reps};
}
function removeExFromSession(exId){
  if(!state.activeSession) return;
  state.activeSession.exIds=state.activeSession.exIds.filter(function(x){return x!==exId;});
  delete state.activeSession.logs[exId];
  if(slide>=state.activeSession.exIds.length) slide=Math.max(0,state.activeSession.exIds.length-1);
}

function rFoot(ank,rot){

// An implement is drawn as it PROJECTS in this view, never as a generic icon.

// ---- frontal-plane rig -------------------------------------------------
// The second angle carries what a side view physically cannot: stance width,
// grip width, elbow flare and knee tracking. Explicit joints win over IK,
// because a limb that bends front-to-back has no lateral bend to solve for.
function rSolveFront(f){
  var cx=f.cx===undefined?70:f.cx, hipHW=9, shHW=16, lean=f.lean||0;
  var tS=f.torsoScale===undefined?1:f.torsoScale;
  var hipC=rP(cx,f.hipY), shC=rP(cx+lean, f.hipY-RL.TORSO*tS);
  var head=rP(shC.x+lean*0.5, shC.y-RL.HEAD_OFF*(0.35+0.65*tS));
  var hipL=rP(hipC.x-hipHW,hipC.y), hipR=rP(hipC.x+hipHW,hipC.y);
  var shL=rP(shC.x-shHW,shC.y), shR=rP(shC.x+shHW,shC.y);
  var footL=rP(f.footL[0],f.footL[1]), footR=rP(f.footR[0],f.footR[1]);
  var handL=rP(f.handL[0],f.handL[1]), handR=rP(f.handR[0],f.handR[1]);
  function both(a,b,l1,l2){ return [rIk(a,b,l1,l2,1), rIk(a,b,l1,l2,-1)]; }
  function lower(p){ return p[0].y>=p[1].y?p[0]:p[1]; }
  var aL=f.armScaleL===undefined?1:f.armScaleL, aR=f.armScaleR===undefined?1:f.armScaleR;
  var kneeL=f.kneeL?rP(f.kneeL[0],f.kneeL[1]):(function(k){return k[0].x<=k[1].x?k[0]:k[1];})(both(hipL,footL,RL.THIGH,RL.SHIN));
  var kneeR=f.kneeR?rP(f.kneeR[0],f.kneeR[1]):(function(k){return k[0].x>=k[1].x?k[0]:k[1];})(both(hipR,footR,RL.THIGH,RL.SHIN));
  var elbL=f.elbL?rP(f.elbL[0],f.elbL[1]):lower(both(shL,handL,RL.UPPER*aL,RL.FORE*aL));
  var elbR=f.elbR?rP(f.elbR[0],f.elbR[1]):lower(both(shR,handR,RL.UPPER*aR,RL.FORE*aR));
  return {hipC:hipC,shC:shC,head:head,hipL:hipL,hipR:hipR,shL:shL,shR:shR,footL:footL,footR:footR,
    handL:handL,handR:handR,kneeL:kneeL,kneeR:kneeR,elbL:elbL,elbR:elbR,
    fistL:f.fistL===undefined?1:f.fistL, fistR:f.fistR===undefined?1:f.fistR};

function rPair(a,b,t){ return (a&&b)?rLerpPt(a,b,t):undefined; }
function rFrontFrame(A,B,t){
  return {cx:rLerp(A.cx===undefined?70:A.cx,B.cx===undefined?70:B.cx,t),
    hipY:rLerp(A.hipY,B.hipY,t), lean:rLerp(A.lean||0,B.lean||0,t),
    fistL:rLerp(A.fistL===undefined?1:A.fistL,B.fistL===undefined?1:B.fistL,t),
    fistR:rLerp(A.fistR===undefined?1:A.fistR,B.fistR===undefined?1:B.fistR,t),
    torsoScale:rLerp(A.torsoScale===undefined?1:A.torsoScale,B.torsoScale===undefined?1:B.torsoScale,t),
    armScaleL:rLerp(A.armScaleL===undefined?1:A.armScaleL,B.armScaleL===undefined?1:B.armScaleL,t),
    armScaleR:rLerp(A.armScaleR===undefined?1:A.armScaleR,B.armScaleR===undefined?1:B.armScaleR,t),
    footL:rLerpPt(A.footL,B.footL,t), footR:rLerpPt(A.footR,B.footR,t),
    handL:rLerpPt(A.handL,B.handL,t), handR:rLerpPt(A.handR,B.handR,t),
    kneeL:rPair(A.kneeL,B.kneeL,t), kneeR:rPair(A.kneeR,B.kneeR,t),

function rFrontAt(ex,u){
  var fr=ex.front; if(!fr) return null;

  var total=tempo.reduce(function(a,b){return a+b;},0);
  var target=(((u%1)+1)%1)*total, acc=0, i=0;
  for(i=0;i<n;i++){ if(target<acc+tempo[i]) break; acc+=tempo[i]; }

function rigSVG(exId,u){

var rigRaf=null;
function startPoseLoop(){
  stopPoseLoop();
  var w=document.getElementById('fig-live');
  var rigId=w?w.getAttribute('data-rig'):null;
  if(rigId && rigFor(rigId)){
    // A rigged exercise animates continuously through the whole rep rather than
    // flipping between two stills, because the path between the positions is
    // most of what a form reminder is for.
    var t0=performance.now();
    var step=function(now){
      var el=document.getElementById('fig-live');
      if(!el || el.getAttribute('data-rig')!==rigId){ rigRaf=null; return; }
      var u=((now-t0)/2400)%1;
      el.innerHTML=rigSVG(rigId,u);
      var fr=document.getElementById('fig-live-front');
      if(fr) fr.innerHTML=rigFrontSVG(rigId,u);
      rigRaf=requestAnimationFrame(step);
    };
    rigRaf=requestAnimationFrame(step);
    return;
  }
  poseTimer=setInterval(function(){
    poseFlip=!poseFlip;
    var w2=document.getElementById('fig-live');
    if(w2){ var key=w2.getAttribute('data-pose'); var eq=w2.getAttribute('data-equip'); w2.innerHTML=figureSVG(key,poseFlip,eq); }
  },900);
}
function stopPoseLoop(){
  if(poseTimer){ clearInterval(poseTimer); poseTimer=null; }
  if(rigRaf){ cancelAnimationFrame(rigRaf); rigRaf=null; }
}

function syncUi(){
  state.uiTab=tab; state.uiViewingSession=viewingSession; state.uiSlide=slide; state.uiProgRange=progRange;
}

function render(){
  syncUi();
  var app=document.getElementById('app');
  if(app) app.innerHTML=bodyContent();
  stopPoseLoop();
  if(viewingSession && state.activeSession && !addingExercise && state.activeSession.exIds.length){ startPoseLoop(); }
}

function onClick(e){
  var t=e.target.closest('[data-action]');
  if(!t) return;
  var action=t.getAttribute('data-action');
  var today=ensureDay(activeDate());
  var uiOnly=false;

  if(action==='tab'){ tab=t.getAttribute('data-tab'); viewingSession=false; addingExercise=false; render(); return; }
  else if(action==='today'){ setLogDate(null); tab='today'; render(); return; }
  else if(action==='pickday'){ setLogDate(t.getAttribute('data-k')); tab='today'; render(); return; }
  else if(action==='prange'){ progRange=parseInt(t.getAttribute('data-n'),10)||14; uiOnly=true; }
  else if(action==='toggleex'){ var id0=t.getAttribute('data-id'); expanded[id0]=!expanded[id0]; uiOnly=true; }
  else if(action==='cancelsession'){ viewingSession=false; addingExercise=false; uiOnly=true; }
  else if(action==='resumesession'){ viewingSession=true; slide=0; uiOnly=true; }
  else if(action==='startworkout'){ startWorkout(t.getAttribute('data-id')); }
  else if(action==='discardsession'){ state.activeSession=null; viewingSession=false; addingExercise=false; }
  else if(action==='finishworkout'){ finishWorkout(); }
  else if(action==='logset'){ logSet(t.getAttribute('data-ex'), t.getAttribute('data-type')); }
  else if(action==='undoset'){ undoSet(t.getAttribute('data-ex')); }
  else if(action==='prevslide'){ if(slide>0) slide--; uiOnly=true; }
  else if(action==='nextslide'){ if(state.activeSession && slide<state.activeSession.exIds.length-1) slide++; uiOnly=true; }
  else if(action==='skipex'){
    if(state.activeSession && slide<state.activeSession.exIds.length-1){ slide++; uiOnly=true; }
    else if(state.activeSession){ finishWorkout(); }
  }
  else if(action==='openpicker'){ addingExercise=true; exSearch=''; uiOnly=true; }
  else if(action==='closepicker'){ addingExercise=false; uiOnly=true; }
  else if(action==='addex'){ addExToSession(t.getAttribute('data-id')); addingExercise=false; slide=state.activeSession.exIds.length-1; }
  else if(action==='removeex'){ removeExFromSession(t.getAttribute('data-id')); }
  else if(action==='water'){
    var d=parseInt(t.getAttribute('data-d'),10); var prev=today.water;
    today.water=Math.max(0,today.water+d); if(today.water>0) today.touched=true;
    if(d>0 && prev<state.waterTarget) addXp(XP_PER_WATER);
    if(d<0 && prev<=state.waterTarget && prev>0) addXp(-XP_PER_WATER);
  }
  else if(action==='logsauna'){
    var minsEl=document.getElementById('sauna-mins'); var tempEl=document.getElementById('sauna-temp'); var posEl=document.getElementById('sauna-pos');
    var mins=parseFloat(minsEl?minsEl.value:''); if(isNaN(mins)||mins<=0) return;
    var temp=tempEl?parseFloat(tempEl.value):NaN;
    state.saunaSessions.push({date:activeDate(),mins:mins,temp:isNaN(temp)?null:temp,position:posEl?posEl.value:'Top'});
    today.touched=true; addXp(XP_SAUNA);
  }
  else if(action==='workout'){
    var wt=t.getAttribute('data-type');
    if(today.workout.done && today.workout.type===wt){ today.workout.done=false; today.workout.type=null; addXp(-XP_WORKOUT); }
    else { if(!today.workout.done) addXp(XP_WORKOUT); today.workout.done=true; today.workout.type=wt; today.rest=false; }
    today.touched=true;
  }
  else if(action==='rest'){
    if(today.rest){ today.rest=false; addXp(-XP_REST); }
    else { today.rest=true; today.workout.done=false; today.workout.type=null; addXp(XP_REST); }
    today.touched=true;
  }
  else if(action==='alcohol'||action==='smoking'||action==='weed'){
    var dd=parseInt(t.getAttribute('data-d'),10); today[action]=Math.max(0,today[action]+dd); today.touched=true;
  }
  else if(action==='addlib'){
    var titleEl=document.getElementById('lib-title'); var tagEl=document.getElementById('lib-tag'); var notesEl=document.getElementById('lib-notes');
    var title=(titleEl.value||'').trim(); if(!title) return;
    state.library.push({id:'l'+Date.now(),title:title,tag:tagEl.value,notes:(notesEl.value||'').trim()});
  }
  else if(action==='dellib'){ var libid=t.getAttribute('data-id'); state.library=state.library.filter(function(x){return x.id!==libid;}); }
  else if(action==='addrecipe'){
    var rt=document.getElementById('rec-title'); var ri=document.getElementById('rec-ing'); var rn=document.getElementById('rec-inst');
    var title2=(rt.value||'').trim(); if(!title2) return;
    var ings=(ri.value||'').split('\n').map(function(x){return x.trim();}).filter(Boolean);
    state.recipes.push({id:'r'+Date.now(),title:title2,tag:'Recipe',ingredients:ings,instructions:(rn.value||'').trim(),inPlan:false,day:'Unassigned'});
  }
  else if(action==='delrecipe'){ var rid=t.getAttribute('data-id'); state.recipes=state.recipes.filter(function(x){return x.id!==rid;}); }
  else if(action==='shopcheck'){ var item=t.getAttribute('data-item'); var sidx=state.shoppingChecked.indexOf(item); if(sidx>-1) state.shoppingChecked.splice(sidx,1); else state.shoppingChecked.push(item); }
  else if(action==='clearweek'){ state.recipes.forEach(function(r){ r.inPlan=false; r.day='Unassigned'; }); state.shoppingChecked=[]; }

  render();
  if(!uiOnly) scheduleSave();
}

function onChange(e){
  var t=e.target.closest('[data-action]');
  if(!t) return;
  var action=t.getAttribute('data-action');
  if(action==='logdate'){ setLogDate(t.value); render(); return; }
  else if(action==='inplan'){ var id=t.getAttribute('data-id'); var r=state.recipes.filter(function(x){return x.id===id;})[0]; if(r) r.inPlan=t.checked; }
  else if(action==='recipeday'){ var id2=t.getAttribute('data-id'); var r2=state.recipes.filter(function(x){return x.id===id2;})[0]; if(r2) r2.day=t.value; }
  render(); scheduleSave();
}

function onInput(e){
  if(e.target && e.target.id==='ex-search'){ exSearch=e.target.value; render(); }
}

function onTouchStart(e){ if(e.target.closest('.slide')){ touchX=e.touches[0].clientX; } }
function onTouchEnd(e){
  if(touchX===null) return;
  var dx=e.changedTouches[0].clientX-touchX; touchX=null;
  if(Math.abs(dx)<50) return;
  if(!state.activeSession) return;
  var n=state.activeSession.exIds.length;
  if(dx<0 && slide<n-1){ slide++; render(); }
  else if(dx>0 && slide>0){ slide--; render(); }
}

function fullDocument(data){
  return '<!doctype html><html><head><meta charset="utf-8">'+

  '<title>Fight Card</title>'+

  '<script>('+App.toString()+')('+JSON.stringify(data)+');<\/script>'+
  '</body></html>';
}

function boot(){
  var styleTag=document.createElement('style'); styleTag.textContent=CSS; document.head.appendChild(styleTag);
  document.addEventListener('click',onClick);
  document.addEventListener('change',onChange);
  document.addEventListener('input',onInput);
  document.addEventListener('touchstart',onTouchStart,{passive:true});
  document.addEventListener('touchend',onTouchEnd,{passive:true});
  render();
  if(window.claude && window.claude.use){ claude.use('artifact').then(function(ns){ artifactApi=ns; render(); }); }
}
