   tile says total lifted and the chart says weight moved, so what counts is
   whatever actually moved, warm-up ramp included. */
function movesWeight(id,st){
  if(!st || !st.w || !st.v) return false;
  var def=exDef(id);
  if(!def) return false;
  return def.type==='load' || (def.type==='prep' && st.lvlKind==='load');
}
function perImplementNote(id){
  var k=perImplement(id);
  return k==='dumbbell'?'Log the weight of one dumbbell, not the pair.'
       : k==='side'?'Log the weight per side, not both added together.':'';
}
function equipGlyph(kind,s){
  if(!kind) return '';
  if(kind==='barbell'){
    return '<line x1="'+(s.hand.x-24)+'" y1="'+s.hand.y+'" x2="'+(s.hand.x+24)+'" y2="'+s.hand.y+'" stroke="var(--text-soft)" stroke-width="3"/>'+
      '<circle cx="'+(s.hand.x-24)+'" cy="'+s.hand.y+'" r="6" fill="none" stroke="var(--text-soft)" stroke-width="2.5"/>'+
      '<circle cx="'+(s.hand.x+24)+'" cy="'+s.hand.y+'" r="6" fill="none" stroke="var(--text-soft)" stroke-width="2.5"/>';
  }
  if(kind==='dumbbell'){
    return '<line x1="'+(s.hand.x-8)+'" y1="'+s.hand.y+'" x2="'+(s.hand.x+8)+'" y2="'+s.hand.y+'" stroke="var(--text-soft)" stroke-width="3"/>'+
      '<circle cx="'+(s.hand.x-8)+'" cy="'+s.hand.y+'" r="4" fill="var(--text-soft)"/>'+
      '<circle cx="'+(s.hand.x+8)+'" cy="'+s.hand.y+'" r="4" fill="var(--text-soft)"/>';
  }
  if(kind==='kettlebell'){
    return '<circle cx="'+s.hand.x+'" cy="'+(s.hand.y+10)+'" r="8" fill="none" stroke="var(--text-soft)" stroke-width="2.5"/>'+
      '<path d="M'+(s.hand.x-4)+' '+(s.hand.y+3)+' Q'+s.hand.x+' '+(s.hand.y-6)+' '+(s.hand.x+4)+' '+(s.hand.y+3)+'" fill="none" stroke="var(--text-soft)" stroke-width="2.5"/>';
  }
  if(kind==='band'){
    return '<path d="M'+s.hand.x+' '+s.hand.y+' q8 10 0 20 q-8 10 0 20" fill="none" stroke="var(--accent)" stroke-width="2" opacity="0.55"/>';
  }
  if(kind==='bar'){
    return '<line x1="'+(s.hand.x-30)+'" y1="'+(s.hand.y-2)+'" x2="'+(s.hand.x+30)+'" y2="'+(s.hand.y-2)+'" stroke="var(--text-soft)" stroke-width="4" stroke-linecap="round"/>';
  }
  if(kind==='dipbars'){
    return '<line x1="'+(s.hand.x-2)+'" y1="'+(s.hand.y-16)+'" x2="'+(s.hand.x-2)+'" y2="'+(s.hand.y+16)+'" stroke="var(--text-soft)" stroke-width="3" stroke-linecap="round"/>';
  }
  if(kind==='wall'){
    return '<line x1="14" y1="-16" x2="14" y2="170" stroke="var(--text-soft)" stroke-width="3" opacity="0.6"/>';
  }
  if(kind==='box'){
    return '<rect x="86" y="128" width="34" height="34" fill="none" stroke="var(--text-soft)" stroke-width="2.5"/>';
  }
  return '';
}

{id:"dl_conv",name:"Conventional deadlift",cat:"Strength",area:"Legs & glutes",type:"load",sets:4,reps:"5",pose:"HINGE",cue:"Bar over mid-foot, flat back, drive through the floor and stand tall, hips and shoulders rising together."},
{id:"hipthrust",name:"Hip thrust",cat:"Strength",area:"Legs & glutes",type:"load",sets:4,reps:"10",pose:"HIPBRIDGE",cue:"Upper back on a bench, bar over your hips, drive through your heels to full hip extension, squeeze at the top."},
{id:"splitsq_bulg",name:"Bulgarian split squat",cat:"Strength",area:"Legs & glutes",type:"load",sets:3,reps:"8 each side",pose:"LUNGE",cue:"Rear foot up on a bench, front foot forward. Drop straight down through the front leg, drive back up."},
{id:"lunge_walk",name:"Walking lunge",cat:"Strength",area:"Legs & glutes",type:"reps",sets:3,reps:"10 each side",pose:"LUNGE",cue:"Step forward into a lunge, both knees near 90 degrees, drive up and step through to the next lunge."},
{id:"press_push",name:"Push press",cat:"Strength",area:"Push",type:"load",sets:3,reps:"8",pose:"PRESS",cue:"Dumbbells at your shoulders, dip your knees slightly then drive up explosively, press overhead as your legs extend."},
{id:"raise_front",name:"Front dumbbell raise",cat:"Strength",area:"Push",type:"load",sets:3,reps:"12-15",pose:"PRESS",cue:"Dumbbells at your thighs, palms down. Raise them straight out in front to shoulder height, arms long, and lower under control. It is a small muscle doing a long lever, so it needs far less weight than you think. If your lower back is swinging, it is too heavy."},
{id:"raise_lateral",name:"Side lateral raise",cat:"Strength",area:"Push",type:"load",sets:3,reps:"12-15",pose:"PRESS",cue:"Dumbbells at your sides, soft bend at the elbow that does not change. Lift out to the sides to about shoulder height, leading with the elbows, and lower slowly. Go light: the moment you are heaving it up, your traps have taken over and the side delt has stopped working."},
{id:"press_ohp",name:"Overhead press",cat:"Strength",area:"Push",type:"load",sets:4,reps:"8",pose:"PRESS",cue:"Bar or dumbbells at shoulder height, press straight overhead without arching your lower back, lower under control."},
{id:"press_bench",name:"Bench press",cat:"Strength",area:"Push",type:"load",sets:4,reps:"8",pose:"BENCH",cue:"Bar over your chest, lower with control to your sternum, press back up keeping your feet planted."},
{id:"press_incline",name:"Incline dumbbell press",cat:"Strength",area:"Push",type:"load",sets:3,reps:"10",pose:"BENCH",cue:"On an incline bench, press dumbbells up and slightly together, lower under control to chest level."},
{id:"row_bent",name:"Bent-over row",cat:"Strength",area:"Pull",type:"load",sets:4,reps:"8-10",pose:"ROW",cue:"Hinge forward with a flat back, pull the bar or dumbbells to your ribs, squeeze your shoulder blades together."},
{id:"row_single",name:"Single-arm row",cat:"Strength",area:"Pull",type:"load",sets:3,reps:"10 each side",pose:"ROW",cue:"One hand and knee on a bench, pull the dumbbell to your hip keeping your torso still."},
{id:"facepull",name:"Face pull",cat:"Strength",area:"Pull",type:"load",sets:3,reps:"15",pose:"ROW",cue:"Cable or band at face height, pull toward your face with elbows high, squeeze your rear shoulders."},
{id:"pulldown_straight",name:"Standing lat pulldown",cat:"Strength",area:"Pull",type:"load",sets:3,reps:"12-15",pose:"ROW",cue:"Standing at a high pulley, bar at arms length, small hinge at the hips and a long spine. Keep the arms STRAIGHT and pull the bar down in an arc to your thighs with the lats, then let it rise without the elbows bending. The moment they bend it is a triceps pushdown."},
{id:"pulldown",name:"Lat pulldown",cat:"Strength",area:"Pull",type:"load",sets:3,reps:"10",pose:"ROW",cue:"Pull the bar down to your upper chest, lead with your elbows, control it back up."},
{id:"pullup",name:"Pull-up",cat:"Strength",area:"Pull",type:"reps",sets:3,reps:"6-8",pose:"HANG",cue:"Hang from a bar, pull your chin over it leading with your chest, lower under control."},
{id:"chinup",name:"Chin-up",cat:"Strength",area:"Pull",type:"reps",sets:3,reps:"6-8",pose:"HANG",cue:"Underhand grip, pull your chin over the bar, lower under full control."},
{id:"invertedrow",name:"Inverted row",cat:"Strength",area:"Pull",type:"reps",sets:3,reps:"8-10",pose:"INVROW",cue:"Under a bar or table, body straight, pull your chest up to the bar and lower slowly."},
{id:"pushup",name:"Push-up",cat:"Strength",area:"Push",type:"reps",sets:3,reps:"12-15",pose:"PUSHUP",cue:"Hands under shoulders, body in a straight line, lower your chest to the floor and press back up."},
{id:"dip",name:"Dip",cat:"Strength",area:"Push",type:"reps",sets:3,reps:"8-10",pose:"DIP",cue:"On parallel bars, lower until your shoulders dip below your elbows, press back up."},
{id:"shrug",name:"Dumbbell shrug",cat:"Strength",area:"Pull",type:"load",sets:3,reps:"12-15",pose:"CURL",cue:"A dumbbell hanging at each side, arms dead straight. Lift your shoulders straight up toward your ears, hold a beat at the top, lower under control. Do not roll them backwards, that adds nothing, and do not bend the elbows to help. Traps respond to a hard squeeze more than to heavy weight you cannot control."},
{id:"curl_bicep",name:"Bicep curl",cat:"Strength",area:"Pull",type:"load",sets:3,reps:"12",pose:"CURL",cue:"Elbows pinned to your sides, curl the weight up without swinging, lower under control."},
{id:"curl_reverse",name:"Reverse barbell curl",cat:"Strength",area:"Pull",type:"load",sets:3,reps:"12-15",pose:"CURL",cue:"A barbell curled with the hands facing DOWN. Same pinned elbows as any curl, but the pronated grip takes the biceps out of their strongest position and loads the forearm extensors and the brachioradialis instead. It will feel weak next to a normal curl, which is the point: go lighter and do not let the wrists collapse."},
{id:"curl_hammer",name:"Hammer curl",cat:"Strength",area:"Pull",type:"load",sets:3,reps:"10-12",pose:"CURL",cue:"Neutral grip, palms facing each other, thumbs up throughout. Elbows pinned to your sides, curl without swinging and lower under control. Hits brachialis and brachioradialis, so it builds the arm width a supinated curl misses."},
{id:"curl_21s",name:"21s (biceps)",cat:"Strength",area:"Pull",type:"load",sets:3,reps:"21 (7+7+7)",pose:"CURL",cue:"One set is 21 reps in three blocks with no rest: 7 from full stretch to halfway, 7 from halfway to the top, then 7 full reps. Use a barbell or EZ-bar, so the weight you log is the whole bar, not per side. Go far lighter than a straight curl, keep the elbows still, and expect the last 7 to be brutal."},
{id:"curl_cable_single",name:"Single-arm cable curl (both arms)",cat:"Strength",area:"Pull",type:"load",sets:3,reps:"12",pose:"CURL",cue:"A single handle on each low pulley, both arms curling at the same time. Stand mid-stack, elbows pinned by your ribs, and let the cable keep tension at the bottom where a dumbbell goes slack. Log the weight per side."},
{id:"fly_cable",name:"Cable fly",cat:"Strength",area:"Push",type:"load",sets:3,reps:"12",pose:"PRESS",cue:"Pulleys at about chest height, one foot forward, slight forward lean. Set a soft bend at the elbow and do not change it: sweep the hands out wide until you feel the stretch across the chest, then back together in front. The moment the elbows start opening and closing you are pressing, not flying. Log the weight per side."},
{id:"fly_cable_high",name:"High cable fly",cat:"Strength",area:"Push",type:"load",sets:3,reps:"12",pose:"PRESS",cue:"Same movement from pulleys set high, so the hands travel down and in and meet low around the belly button. Coming from above puts the pull across the lower chest instead of the mid chest, which is the only reason to do both. Same fixed soft elbow throughout. Log the weight per side."},
{id:"fly_cable_rev",name:"Reverse cable fly",cat:"Strength",area:"Pull",type:"load",sets:3,reps:"12-15",pose:"PRESS",cue:"Pulleys at about chest height, stand between them and take each handle in the OPPOSITE hand so the cables cross in front of you. Soft fixed elbow, sweep the hands apart and back until the shoulder blades pinch, then return under control. It is the mirror of a cable fly and it is rear delts, so go lighter than you think: if you are heaving with your traps and lower back the weight is wrong. Log the weight per side."},
{id:"triceps_ext",name:"Triceps extension",cat:"Strength",area:"Push",type:"load",sets:3,reps:"12",pose:"PRESS",cue:"Weight overhead, lower behind your head by bending the elbows only, press back to straight."},

{id:"deadhang",name:"Dead hang",cat:"Isometric",area:"Grip & carries",type:"time",sets:4,reps:"20-40s",pose:"HANG",cue:"Full grip on a bar, shoulders relaxed, hang with straight arms and let your spine decompress."},
{id:"wallsit",name:"Wall sit",cat:"Isometric",area:"Legs & glutes",type:"time",sets:3,reps:"30-45s",pose:"WALLSIT",cue:"Back flat against a wall, knees at 90 degrees, hold the position without your knees caving in."},

/* A superset in a session is an INSTANCE: ss1, ss2. The id has to be unique per
   instance because a session keys targets and logs by id, and two supersets in
   one session hold different exercises. */
function isSuperset(id){ return /^ss\d+$/.test(id); }
function exDef(id){
  if(isSuperset(id)) id='superset';
  for(var i=0;i<EX.length;i++){ if(EX[i].id===id) return EX[i]; }
  return null;
}
/* A superset holds its exercises and its own round count. It used to be a bare
   array, and rounds were inferred from how many sets the members had, which
   counted sets logged on an exercise's OWN slide as rounds of the superset. An
   in-flight session saved under the old shape is read here rather than
   migrated, because it lasts hours, not days. */
function supersetBox(ssId){
  var sess=state.activeSession;
  var v=sess && sess.supersets && sess.supersets[ssId];
  if(!v) return null;
  if(Array.isArray(v)){ v=sess.supersets[ssId]={ex:v, rounds:0}; }
  if(!v.ex) v.ex=[];
  return v;
}
function supersetMembers(ssId){ var b=supersetBox(ssId); return b?b.ex:[]; }
function supersetRounds(ssId){ var b=supersetBox(ssId); return b?(b.rounds||0):0; }
/* A superset logs into its member exercises, not into itself, so its slide is
   "done" when any member has a set. Everything downstream -- history, PBs,
   volume -- then reads exactly as if the sets had been logged one at a time. */
function slideLogged(sess,id){
  if(!isSuperset(id)) return (sess.logs[id]||[]).length>0;
  return supersetMembers(id).some(function(m){ return (sess.logs[m]||[]).length>0; });
}

function pad(n){return n<10?'0'+n:''+n;}
function dateKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
// realToday() is the wall clock. activeDate() is the day being LOGGED TO,
// which the date picker can move into the past. Every read of "now" uses the
// first; every write uses the second. Both used to be one function, so a date
// picker would have silently redirected all seven writers at once with
// nothing on screen looking different.
function realToday(){return dateKey(new Date());}
var BACKFILL_DAYS=14;
function minLogDate(){ var d=new Date(); d.setDate(d.getDate()-(BACKFILL_DAYS-1)); return dateKey(d); }
// Saving without db republishes the whole document and EVERY open view reloads
// onto it, so anything held only in a variable is wiped on every single tap.
// That is why the tab and slide live in localStorage (see readUi). The log date
// needs the opposite pair of properties: survive a save, but NOT survive
// closing the app. That is exactly sessionStorage, which the reload keeps and
// closing the tab clears.
// It deliberately does not go in state: a backdate is this device's editing
// position, not part of the record, and it must never sync to another device.
var LOGDATE_KEY='fc.logDate';
function readStoredDate(){ try{ return sessionStorage.getItem(LOGDATE_KEY); }catch(e){ return null; } }
function writeStoredDate(v){ try{ if(v) sessionStorage.setItem(LOGDATE_KEY,v); else sessionStorage.removeItem(LOGDATE_KEY); }catch(e){} }
// '' means today mode: follow the clock. It must not hold today's date as a
// string, or a tab left open past midnight keeps logging to yesterday.
function setLogDate(v){
  logDate=(v && v>=minLogDate() && v<realToday()) ? v : '';
  writeStoredDate(logDate||null);
  return activeDate();
}
function activeDate(){
  if(logDate===undefined) logDate=readStoredDate()||'';
  // Re-check the bounds every time: a tab left open for weeks must not keep
  // writing to a day that has fallen outside the backfill window.
  if(logDate && (logDate>=realToday() || logDate<minLogDate())) setLogDate('');
  return logDate||realToday();
}
function backfilling(){ return activeDate()!==realToday(); }
// Card copy has to name the day it is actually writing to.
function dayWord(){ return backfilling()?('on '+prettyKey(activeDate())):'today'; }
function prettyKey(k){ var d=new Date(k+'T12:00:00');

function prettyDate(){var d=new Date();return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});}

  out['state/session']={active:st.activeSession||null};

  if(map['state/session']) st.activeSession=dbClone(map['state/session'].active)||null;

   rewrite all seventy instead of the one that moved. Comparing on a canonical

/* ---------- charts ----------------------------------------------------

function barChart(rows,opts){
  opts=opts||{};

  var W=680,H=opts.h||124,padT=16,padB=18;
  var max=Math.max.apply(null,rows.map(function(r){return r.v;}).concat([opts.target||0]));
  if(max<=0) max=1;

  var bars=rows.map(function(r,i){

    var tip='<title>'+esc(r.tip||'')+'</title>';
    if(!(r.v>0)) return '<rect x="'+x+'" y="'+(base-2)+'" width="'+bw+'" height="2" rx="1" fill="var(--line)">'+tip+'</rect>';
    var h=Math.max(3,Math.round(r.v/max*plotH));
    var fill=r.state==='warn'?'var(--warn)':(r.state==='mute'?'var(--line)':'var(--accent)');
    return '<rect x="'+x+'" y="'+(base-h)+'" width="'+bw+'" height="'+h+'" rx="4" fill="'+fill+'">'+tip+'</rect>';
  }).join('');
  var tline='';
  if(opts.target){
    var ty=base-Math.round(opts.target/max*plotH);

      '<text x="'+W+'" y="'+(ty-4)+'" text-anchor="end" class="c-lbl">'+esc(opts.targetLabel||'target')+'</text>';
  }

  var peak=0; rows.forEach(function(r,i){ if(r.v>rows[peak].v) peak=i; });
  var labels='<text x="0" y="'+(H-4)+'" class="c-lbl">'+esc(rows[0].k)+'</text>';
  if(rows.length>1) labels+='<text x="'+W+'" y="'+(H-4)+'" text-anchor="end" class="c-lbl">'+esc(rows[rows.length-1].k)+'</text>';
  if(rows[peak].v>0) labels+='<text x="'+Math.round(peak*slot+slot/2)+'" y="'+(base-Math.max(3,Math.round(rows[peak].v/max*plotH))-5)+'" text-anchor="middle" class="c-val">'+esc(rows[peak].lbl||String(rows[peak].v))+'</text>';
  return '<div class="chart">'+(opts.title?chartHead(opts.title,opts.sub):'')+
    '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.aria||opts.title||'bar chart')+'">'+
    '<line x1="0" y1="'+base+'" x2="'+W+'" y2="'+base+'" stroke="var(--line)" stroke-width="1"/>'+
    tline+bars+labels+'</svg>'+(opts.foot||'')+'</div>';

function lineChart(pts,opts){

  return '<div class="chart">'+(opts.title?chartHead(opts.title,opts.sub):'')+
    '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.aria||opts.title||'line chart')+'">'+
    '<line x1="0" y1="'+base+'" x2="'+W+'" y2="'+base+'" stroke="var(--line)" stroke-width="1"/>'+
    '<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+

    list.forEach(function(e){ if(!hasId(state.plan,e.id)) state.plan.push(e); });

    return dbApi.collection(coll).get().then(function(snap){
      var part={}; snap.docs.forEach(function(d){ if(d.exists) part[coll+'/'+d.id]=d.data(); });
      return part;

/* ---------- recipe scaling ---------------------------------------------

   load turns a fixed string into something that can be multiplied, which is
   what makes portions editable and the shopping list add up. Anything with no
   number ("Olive oil", "Honey (drizzle)") is carried through untouched rather
   than given invented precision. */

  var rest=inside.replace(/^(\d+\s*\/\s*\d+|\d+(?:\.\d+)?(?:\s*-\s*\d+(?:\.\d+)?)?)/,'').trim();
  var unit=(rest.match(/^(kg|g|ml|l|tbsp|tsp|[a-z]+)/i)||[])[1]||'';

    // still the name. Keeping the whole string as the name made "Honey

    return {n:name, q:null, u:'', d:inside, raw:raw};

/* Adding up a shopping list is where an ingredient quietly goes missing, so
   the rule is: exactly one row per ingredient name, always. Three things used
   to split one ingredient across two rows, and two rows is how something gets
   bought twice or not at all.
     - "1 tin" and "2 tins" are one unit written two ways
     - 500g and 1kg are one measurement in two scales
     - "Garlic" and "Garlic (4 cloves)" are one ingredient, one of them just
       unmeasured
   Units that genuinely do not add (200g of spinach and a handful of it) stay
   as separate quantities, but on the SAME row: "Spinach (200g + 1 handful)".
   Nothing is invented, and nothing can hide. */
var UNIT_SCALE={kg:{u:'g',mul:1000}, l:{u:'ml',mul:1000}};
var COUNT_UNIT=/^(tin|can|head|clove|slice|stick|scoop|bunch|wedge|sprig|handful)s$/;
function canonUnit(u){
  var x=String(u||'').trim().toLowerCase();
  if(UNIT_SCALE[x]) return UNIT_SCALE[x].u;
  // "large handful" is deliberately NOT folded into "handful": they are
  // different amounts, and pretending otherwise would invent a quantity.
  return x.replace(COUNT_UNIT,'$1');
}
function canonQty(q,u){
  var x=UNIT_SCALE[String(u||'').trim().toLowerCase()];
  return x ? q*x.mul : q;
}
// Mass and volume first, then named units, then the unitless count, so a row
// reads the same way every time.
function unitRank(u){ return u==='g'?0 : u==='ml'?1 : u===''?3 : 2; }
// The shopping list adds the same ingredient across every planned MEAL, at
// that meal's own portion count. Reading the plan rather than the recipes is
// what makes the same recipe twice in a week add up to two lots, and what lets
// the list be scoped to part of the week.
function shoppingList(dates){
  var byName={}, order=[];
  planEntries(dates).forEach(function(e){
    var r=planRecipe(e);
    if(!r) return;
    var f=planPortions(e)/recipeBase(r);
    recipeIngs(r).forEach(function(ing){
      var nameKey=String(ing.n||'').trim().toLowerCase();
      if(!nameKey) return;
      var slot=byName[nameKey];
      if(!slot){ slot=byName[nameKey]={key:'i|'+nameKey, n:ing.n, parts:{}, order:[], plain:null}; order.push(slot); }
      if(ing.q===null){ if(slot.plain===null) slot.plain=ing.raw; return; }
      var u=canonUnit(ing.u), part=slot.parts[u];
      if(!part){ part=slot.parts[u]={u:u,q:0}; slot.order.push(part); }
      part.q+=canonQty(ing.q,ing.u)*f;
    });
  });
  order.forEach(function(o){
    if(!o.order.length){ o.label=o.plain||o.n; return; }
    // A measured amount answers the unmeasured mention too, so it is absorbed
    // rather than left as a second row saying only "you also need this".
    o.order.sort(function(a,b){ return unitRank(a.u)-unitRank(b.u) || (a.u<b.u?-1:a.u>b.u?1:0); });
    o.label=o.n+' ('+o.order.map(function(p){ return qtyText(p.q,p.u,true); }).join(' + ')+')';
  });
  // Added by hand, so they carry no quantity to add up, but they belong in the
  // same list: shopping from two lists is how the second one gets forgotten.
  (state.shopExtras||[]).forEach(function(x){
    order.push({key:'x|'+x.id, extraId:x.id, label:x.text, extra:true});
  });
  order.sort(function(a,b){return a.label.toLowerCase().localeCompare(b.label.toLowerCase());});
  return order;
}
function macroLine(r){
  var m=r.macros; if(!m) return '';
  return '<div class="macros"><span><b>'+m[0]+'</b> kcal</span><span><b>'+m[1]+'g</b> protein</span>'+
    '<span><b>'+m[2]+'g</b> carbs</span><span><b>'+m[3]+'g</b> fat</span>'+
    '<span class="per">per portion</span></div>';
}

function setLabel(def,e){
  var type=def&&def.type;
  if(type==='load'){
    if(!e.w) return e.v+' reps';
    // "ea" so a 20kg pair never reads back as a 20kg total.
    return e.w+'kg'+(perImplement(def.id)?' ea':'')+' × '+e.v;
  }
  if(type==='time') return e.v+'s';
  if(type==='distance') return e.v+'m';
  if(type==='prep'){
    if(e.lvlKind==='load'){
      return (e.w?(e.w+'kg × '+e.v):(e.v+' reps'))+(e.opt?' · '+e.opt:'');
    }
    var pl=e.v+' min'+(e.opt?' · '+e.opt:'');
    if(e.lvl) pl+=' · '+(e.lvlKind==='resistance'?('resistance '+e.lvl):e.lvlKind==='speed'?(e.lvl+' km/h'):e.lvl);
    return pl;
  }
  if(type==='cardio'){
    var label=e.v+' min'+(e.machine?' · '+e.machine:'');
    if(e.work||e.rest) label+=' · '+(e.work||'—')+'/'+(e.rest||'—');
    return label;
  }
  return e.v+' reps';
}

/* Runs once per session, never on every render: if it ran every time, removing
   the cool-down would silently put it straight back. */
function hasRole(sess,role){
  for(var i=0;i<sess.exIds.length;i++){
    var d=exDef(sess.exIds[i]);
    if(d && d.role===role) return true;
  }
  return false;
}
function ensurePrep(sess){
  if(!sess || sess.prep) return;
  sess.prep=1;
  // Only where the plan does not already have one: Swim opens and closes with
  // its own easy lengths, and Cardio gym starts on the machine, so bolting a
  // generic step onto those would be asking for the same thing twice.
  if(!hasRole(sess,'warmup')){
    sess.exIds.unshift('warmup');
    sess.targets.warmup={sets:1,reps:'5-10 min'};
  }
  if(!hasRole(sess,'cooldown')){
    sess.exIds.push('cooldown');
    sess.targets.cooldown={sets:1,reps:'5-10 min'};
  }
}
// True when a session holding logged sets is in progress for a workout other
// than id, which starting id would throw away.
function sessionBusy(id){
  var s=state.activeSession; if(!s || s.workoutId===id) return false;
  return Object.keys(s.logs||{}).some(function(k){ return s.logs[k].length>0; });
}
function startWorkout(id){
  var w=WORKOUTS.filter(function(x){return x.id===id;})[0];
  if(!w || sessionBusy(id)) return;
  if(!state.activeSession || state.activeSession.workoutId!==id){
    state.activeSession={workoutId:id,startedAt:activeDate(),exIds:w.plan.map(function(p){return p.ex;}),targets:{},logs:{}};
    w.plan.forEach(function(p){ state.activeSession.targets[p.ex]={sets:p.sets,reps:p.reps}; });
  }
  ensurePrep(state.activeSession);
  slide=0; addingExercise=false; viewingSession=true;
}
function logSet(exId,type){
  var valInput=document.getElementById('log-v-'+exId);
  if(!valInput) return;
  var v=parseFloat(valInput.value);
  if(isNaN(v)||v<=0) return;
  var entry={v:v,w:null};
  if(type==='load'){ var wInput=document.getElementById('log-w-'+exId); var wt=wInput?parseFloat(wInput.value):NaN; entry.w=isNaN(wt)?null:wt; }
  if(type==='prep'){
    var oEl=document.getElementById('log-opt-'+exId); entry.opt=oEl?oEl.value:'';
    entry.lvlKind=prepLevelKind(entry.opt);
    if(entry.lvlKind==='load'){
      // v is reps here, not minutes, which is why the label and the trend
      // chart both have to ask what kind of prep entry this is.
      var pwEl=document.getElementById('log-w-'+exId);
      var pw=pwEl?parseFloat(pwEl.value):NaN;
      entry.w=isNaN(pw)?null:pw; entry.lvl='';
    } else {
      var lEl=document.getElementById('log-lvl-'+exId); entry.lvl=lEl?lEl.value:'';
    }
    delete prepPick[exId]; delete prepMins[exId];
  }
  if(type==='cardio'){
    var mEl=document.getElementById('log-machine-'+exId); entry.machine=mEl?mEl.value:'';
    var wkEl=document.getElementById('log-work-'+exId); if(wkEl) entry.work=wkEl.value;
    var rEl=document.getElementById('log-rest-'+exId); if(rEl) entry.rest=rEl.value;
  }
  if(!state.activeSession.logs[exId]) state.activeSession.logs[exId]=[];
  state.activeSession.logs[exId].push(entry);
  consumed(['log-v-','log-w-','log-opt-','log-lvl-','log-machine-','log-work-','log-rest-'].map(function(k){ return k+exId; }));
}
function undoSet(exId){ var arr=state.activeSession && state.activeSession.logs[exId]; if(arr&&arr.length) arr.pop(); }
/* Which members each round actually logged, so a round can be taken back as a
   round. A box from before this was kept gets one empty entry per round it
   already counts, so the count and the log agree from the start. */
function roundLogOf(b){
  if(!b.roundLog){ b.roundLog=[]; for(var r=0;r<(b.rounds||0);r++) b.roundLog.push([]); }
  return b.roundLog;
}
/* What was supersetted, kept for the finished log. The sets themselves already
   land on the individual exercises, which is what makes history and PBs work
   without knowing about rounds, but it also meant the log had no record that
   two lifts were done back to back at all: a superset day read as an ordinary
   one. Only rounds actually logged are kept, because a superset that was set
   up and never used is not something that happened. */
function supersetRecord(sess){
  var out=[];
  Object.keys((sess&&sess.supersets)||{}).forEach(function(ssId){
    var b=sess.supersets[ssId];
    var ex=(b&&(b.ex||(Array.isArray(b)?b:[])))||[], rounds=(b&&b.rounds)||0;
    // A round undone one member at a time can leave the count behind.
    if(b && b.roundLog) rounds=Math.min(rounds,b.roundLog.length);
    if(ex.length && rounds>0) out.push({ex:ex.slice(), rounds:rounds});
  });
  return out;
}
function supersetSummary(l){
  var ss=(l&&l.supersets)||[];
  if(!ss.length) return '';
  var rounds=ss.reduce(function(a,x){ return a+(x.rounds||0); },0);
  if(ss.length>2) return ss.length+' supersets &middot; '+rounds+' rounds';
  return ss.map(function(x){
    return x.ex.map(function(id){ var d=exDef(id); return esc(d?d.name:id); }).join(' + ')+
      ' &times;'+x.rounds;
  }).join(' &middot; ');
}
function sessionTitle(sess){
  var w=WORKOUTS.filter(function(x){return x.id===sess.workoutId;})[0];
  return w?w.title:'Workout';
}
// Parked so a discarded session can be put back, sets and all.
function discardSession(){
  var sess=state.activeSession; if(!sess) return;
  parkUndo({kind:'session',item:sess,label:'the '+sessionTitle(sess)+' session'});
  state.activeSession=null; viewingSession=false; addingExercise=false;
}
function finishWorkout(){
  var sess=state.activeSession; if(!sess) return;
  // Nothing logged is nothing done: no log, no XP, no trained day. It goes the
  // way a discard does, so a Finish tapped by mistake can be undone.
  var n=0; Object.keys(sess.logs||{}).forEach(function(k){ n+=(sess.logs[k]||[]).length; });
  if(!n){ discardSession(); return; }
  var w=WORKOUTS.filter(function(x){return x.id===sess.workoutId;})[0];
  var title=w?w.title:'Workout', tag=w?w.tag:'Strength';
  var log={id:'wl'+Date.now(),workoutId:sess.workoutId,title:title,tag:tag,date:sess.startedAt||activeDate(),logs:sess.logs};
  var ss=supersetRecord(sess); if(ss.length) log.supersets=ss;
  state.workoutLogs.push(log);
  var today=ensureDay(sess.startedAt||activeDate());
  if(!today.workout.done){ addXp(XP_WORKOUT); if(today.rest) addXp(-XP_REST); }
  today.workout.done=true; today.workout.type=tag; today.rest=false; today.touched=true;
  state.activeSession=null; viewingSession=false; tab='progress';
}
/* Returns the id actually added, which is NOT always the id asked for: a
   superset mints a fresh instance. The caller navigates to the new slide by
   that id, and looking up the id it asked for landed on the cool-down. */
function addExToSession(exId){
  if(!state.activeSession) return null;
  if(exId==='superset'){
    // Every superset is its own instance, so this is the one thing you can add
    // twice. Numbered past whatever is already there so ids never collide.
    var next=1;
    state.activeSession.exIds.forEach(function(x){
      if(isSuperset(x)) next=Math.max(next, parseInt(x.slice(2),10)+1);
    });
    exId='ss'+next;
    if(!state.activeSession.supersets) state.activeSession.supersets={};
    state.activeSession.supersets[exId]={ex:[], rounds:0};
  }
  else if(state.activeSession.exIds.indexOf(exId)>-1) return exId;
  // Placed by role, not by id: Swim closes on its own cool-down swim, and a
  // warm-up added back belongs first. A cool-down that is not last is not a
  // cool-down.
  var ids=state.activeSession.exIds, def=exDef(exId), ci=-1;
  ids.forEach(function(x,k){ var d=exDef(x); if(ci<0 && d && d.role==='cooldown') ci=k; });
  if(def && def.role==='warmup') ids.unshift(exId);
  else if(ci>-1 && !(def && def.role==='cooldown')) ids.splice(ci,0,exId);
  else ids.push(exId);
  state.activeSession.targets[exId]={sets:def.sets,reps:def.reps};
  return exId;
}
function removeExFromSession(exId){
  var s=state.activeSession; if(!s) return;
  var pos=s.exIds.indexOf(exId); if(pos<0) return;
  var d=exDef(exId), u={kind:'sessionEx',exId:exId,pos:pos,target:s.targets[exId],
    sess:{workoutId:s.workoutId,startedAt:s.startedAt},label:(isSuperset(exId)?'the superset':(d?d.name:exId))+' from the session'};
  s.exIds=s.exIds.filter(function(x){return x!==exId;});
  // Otherwise the membership outlives the slide and comes back if an id is
  // ever reused. The sets already logged stay: they belong to the exercises.
  if(isSuperset(exId) && s.supersets){ u.box=s.supersets[exId]; delete s.supersets[exId]; }
  // Sets a round logged live on the exercise too, so they stay while any
  // superset still holds it.
  var inRound=Object.keys(s.supersets||{}).some(function(k){ return supersetMembers(k).indexOf(exId)>-1; });
  if(!inRound && s.logs[exId]){ u.logs=s.logs[exId]; delete s.logs[exId]; }
  parkUndo(u);
  if(slide>=state.activeSession.exIds.length) slide=Math.max(0,state.activeSession.exIds.length-1);
}

    o+='<rect x="'+p[0]+'" y="'+p[1]+'" width="'+p[2]+'" height="'+p[3]+'" rx="'+(p[4]===undefined?2:p[4])+'" fill="var(--line)"'+
       (p[5]?' transform="rotate('+p[5]+' '+(p[0]+p[2]/2)+' '+(p[1]+p[3]/2)+')"':'')+'/>';
  });
  function limb(a,b,c,col,w,isLeg){
    return '<polygon points="'+rSeg(a,b,w[0],w[1])+'" fill="'+col+'"/>'+
      '<circle cx="'+b.x.toFixed(1)+'" cy="'+b.y.toFixed(1)+'" r="'+(w[1]/2)+'" fill="'+col+'"/>'+
      '<polygon points="'+rSeg(b,c,w[1],w[2])+'" fill="'+col+'"/>'+
      (isLeg ? '<polygon points="'+rFoot(c,s.footRot)+'" fill="'+col+'"/>'
             : '<circle cx="'+c.x.toFixed(1)+'" cy="'+c.y.toFixed(1)+'" r="'+(w[2]/2+0.8)+'" fill="'+col+'"/>');
  }
  o+=limb(s.hipF,s.kneeF,s.ankF,far,[10,7,5],true);
  o+=limb(s.shF,s.elbF,s.handF,far,[7,5,4],false);
  if(ex.equip!=='barbell') o+=rEquip(ex,s);
  o+='<polygon points="'+rSeg(s.hip,s.sh,13,17)+'" fill="'+ink+'"/>';
  o+='<circle cx="'+s.hip.x.toFixed(1)+'" cy="'+s.hip.y.toFixed(1)+'" r="6.5" fill="'+ink+'"/>';
  o+='<circle cx="'+s.sh.x.toFixed(1)+'" cy="'+s.sh.y.toFixed(1)+'" r="8.5" fill="'+ink+'"/>';
  o+=limb(s.hip,s.kneeN,s.ankN,legCol,[11,8,5.5],true);
  o+=limb(s.sh,s.elbN,s.handN,armCol,[8,6,4.5],false);
  o+='<circle cx="'+s.head.x.toFixed(1)+'" cy="'+s.head.y.toFixed(1)+'" r="'+RL.HEAD_R+'" fill="'+ink+'"/>';
  // The near plate is between you and the lifter, so it is drawn last. Unfilled,
  // so it reads as the plate rim without hiding the form behind it.
  if(ex.equip==='barbell') o+=rEquip(ex,s);
  return o+'</svg>';
}

function figureSVG(poseKey,phase,equip){
  var pair=PP[poseKey]||PP.SQUAT;
  var pose=pair[phase?1:0];
  var s=segFor(pose);
  var groundY=Math.max(s.hip.y,s.shoulder.y,s.ankle.y,s.knee.y)+14;
  var gx1=Math.min(s.hip.x,s.shoulder.x,s.ankle.x,s.hand.x)-30, gx2=Math.max(s.hip.x,s.shoulder.x,s.ankle.x,s.hand.x)+40;
  var joints=[s.shoulder,s.elbow,s.hip,s.knee,s.ankle];
  var jointDots=joints.map(function(j){return '<circle cx="'+j.x+'" cy="'+j.y+'" r="3.2" fill="var(--text)"/>';}).join('');
  return '<svg viewBox="-20 -20 180 200">'+
    equipGlyph(equip,s)+
    '<line x1="'+gx1+'" y1="'+groundY+'" x2="'+gx2+'" y2="'+groundY+'" stroke="var(--line)" stroke-width="2.5" stroke-dasharray="1 5" stroke-linecap="round"/>'+
    '<line x1="'+s.hip.x+'" y1="'+s.hip.y+'" x2="'+s.shoulder.x+'" y2="'+s.shoulder.y+'" stroke="var(--text)" stroke-width="7" stroke-linecap="round"/>'+
    '<line x1="'+s.shoulder.x+'" y1="'+s.shoulder.y+'" x2="'+s.elbow.x+'" y2="'+s.elbow.y+'" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/>'+
    '<line x1="'+s.elbow.x+'" y1="'+s.elbow.y+'" x2="'+s.hand.x+'" y2="'+s.hand.y+'" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/>'+
    '<line x1="'+s.hip.x+'" y1="'+s.hip.y+'" x2="'+s.knee.x+'" y2="'+s.knee.y+'" stroke="var(--text)" stroke-width="7" stroke-linecap="round"/>'+
    '<line x1="'+s.knee.x+'" y1="'+s.knee.y+'" x2="'+s.ankle.x+'" y2="'+s.ankle.y+'" stroke="var(--text)" stroke-width="7" stroke-linecap="round"/>'+
    jointDots+
    '<circle cx="'+s.headC.x+'" cy="'+s.headC.y+'" r="11" fill="var(--text)"/>'+
  '</svg>';
}
// Where in the rep the figure is. It belongs to the rig, not to the DOM node
// drawing it, so a render (a save, a tap) carries on mid-rep instead of
// snapping back to the start. Only moving to another rig starts it over.
var rigRaf=null, rigT0=0, rigLastId=null;
function startPoseLoop(){
  stopPoseLoop();
  var w=document.getElementById('fig-live');
  var rigId=w?w.getAttribute('data-rig'):null;
  if(rigId && rigFor(rigId)){
    // A rigged exercise animates continuously through the whole rep rather than
    // flipping between two stills, because the path between the positions is
    // most of what a form reminder is for.
    if(rigId!==rigLastId){ rigT0=performance.now(); rigLastId=rigId; }
    // About 30fps: the motion reads the same and it is half the work on a phone.
    var last=-1e9;
    var step=function(now){
      var el=document.getElementById('fig-live');
      if(!el || el.getAttribute('data-rig')!==rigId){ rigRaf=null; return; }
      if(now-last>=30){
        last=now;
        var u=(Math.max(0,now-rigT0)/2400)%1;
        el.innerHTML=rigSVG(rigId,u); el.setAttribute('data-u',u.toFixed(3));
        var fr=document.getElementById('fig-live-front');
        if(fr) fr.innerHTML=rigFrontSVG(rigId,u);
      }
      rigRaf=requestAnimationFrame(step);
    };
    // Straight away, at the phase it was at, not a frame later from u=0.
    step(performance.now());
    return;
  }
  poseTimer=setInterval(function(){
    poseFlip=!poseFlip;
    var w2=document.getElementById('fig-live');
    if(w2){ var key=w2.getAttribute('data-pose'); var eq=w2.getAttribute('data-equip'); w2.innerHTML=figureSVG(key,poseFlip,eq); }
  },900);
}
function stopPoseLoop(){
  if(poseTimer){ clearInterval(poseTimer); poseTimer=null; }
  if(rigRaf){ cancelAnimationFrame(rigRaf); rigRaf=null; }
}

  var waterHits=waterRows.filter(function(r){return r.v>=state.waterTarget;}).length;
  // Average over every day since tracking started, not only the days water

  var trackedKeys=Object.keys(state.days).sort();

  var waterAvgRow='<div class="stat-row">'+waterPeriods.map(function(p){

  var saunaAll=state.saunaSessions.slice().sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:0);});

  var pStreaks=computeStreaks();
  var rangeBar='<div class="rangebar">'+[14,30,90].map(function(n){

  var statRow=

  var recent=logs.slice().sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:0);}).slice(0,6);
  var recentHtml=recent.map(function(l){
    var setCount=0; Object.keys(l.logs).forEach(function(k){setCount+=l.logs[k].length;});

      '<span>'+esc(l.title)+(ss?('<span class="ssnote">'+ss+'</span>'):'')+'</span>'+

  var exList=exIds.map(function(exId){
    var def=exDef(exId)||{name:exId,type:'reps'};
    var hist=histo[exId].slice().sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:0);});
    var last=hist[0]; var isOpen=!!expanded[exId];
    var detail='';
    if(isOpen){
      // One point per session: the best set of that day, so the line tracks
      // progress rather than jumping around within a session.
      var byDate={};
      // A warm-up can hold two different kinds of set: minutes on a bike, and
      // reps at a weight when it was ramping up on the first lift. Plotting

      hist.forEach(function(h){
        if(def.type==='prep' && h.lvlKind==='load') return;

      var dates=Object.keys(byDate).sort();
      var pts=dates.map(function(dt){

      });

      // take the whole progress tab down.
      var pb=pts.length?pts.reduce(function(a,p){return p.v>a.v?p:a;},pts[0]):null;
      var delta=pts.length>1?pts[pts.length-1].v-pts[0].v:0;
      var deltaTxt=pts.length>1?((delta>0?'+':'')+Math.round(delta*10)/10+bestUnit(def.type)+' since '+pts[0].k):'first session';
      var pbLabel=def.type==='load'?'heaviest set':'best set';
      var rows=hist.slice(0,15).map(function(h){

          '<div id="pick-results">'+pickerResults()+'</div></div></div>';
    } else if(n===0){

        '<button class="addex-btn" data-action="openpicker">+ Add exercise</button></div></div>';
    } else if(isSuperset(sess.exIds[slide])){

      sessionHtml='<div class="story">'+

        '<div class="slide">'+
          '<span class="cat">Rounds</span>'+
          '<h4>Superset</h4>'+
          '<div class="target">Target: '+ssTgt.sets+' rounds &middot; '+roundsDone+' done</div>'+
          '<div class="cue">'+esc(exDef('superset').cue)+'</div>'+
          (memberRows||'<p class="note" style="text-align:center;">Nothing paired up yet. Pick the exercises you are doing back to back.</p>')+
          '<div class="ssadd"><select id="ss-pick-'+ssId+'"><option value="">Add an exercise&hellip;</option>'+ssOptions+'</select>'+

          (members.length?'<button class="loground" data-action="loground" data-ss="'+ssId+'">Log round '+(roundsDone+1)+'</button>':'')+

          '<div class="storynav">'+
            '<button data-action="prevslide"'+(slide===0?' disabled':'')+'>&larr; Prev</button>'+

            (slide<n-1?'<button class="next" data-action="nextslide">Next &rarr;</button>':'<button class="finish" data-action="finishworkout">Finish ('+ssTotal+' set'+(ssTotal===1?'':'s')+')</button>')+
          '</div>'+
          '<button class="addex-btn" data-action="openpicker">+ Add exercise to this session</button>'+

    } else {

        var kind=prepLevelKind(picked);

   removal happened rather than at the top of Progress. An offer whose item is

function undoToast(){

    '<span><button data-action="undo">Undo</button>'+

}

/* Matching is forgiving about a trailing plural, because "shrugs" and "dips"
   are what a person actually types and neither matched the singular name. */
/* Every word has to land somewhere, rather than the whole phrase having to sit
   in one place. "reverse fly" used to find nothing at all while "Reverse cable
   fly" was sitting in the list, because the two words are not next to each
   other in the name. Something you cannot find may as well not be there. */
function pickerMatches(q){
  var already=(state.activeSession&&state.activeSession.exIds)||[];
  function has(e,term){
    return e.name.toLowerCase().indexOf(term)>-1 ||
           e.cat.toLowerCase().indexOf(term)>-1 ||
           e.area.toLowerCase().indexOf(term)>-1;
  }
  function hits(terms){
    return EX.filter(function(e){
      if(already.indexOf(e.id)>-1) return false;
      return terms.every(function(t){ return has(e,t); });
    });
  }
  var terms=q.split(/\s+/).filter(function(x){ return x; });
  var found=hits(terms);
  // A trailing plural on any word: "shrugs", "reverse flys".
  if(!found.length) found=hits(terms.map(function(t){
    return (t.length>2 && t.charAt(t.length-1)==='s') ? t.slice(0,-1) : t;
  }));
  return found;
}
function pickerResults(){
  var results=pickerMatches(exSearch.toLowerCase().trim());
  return AREA_ORDER.map(function(area){
    var inArea=results.filter(function(e){return e.area===area;});
    if(!inArea.length) return '';
    var rowsHtml=inArea.map(function(e){
      var isOpen=!!expanded[e.id];
      return '<div class="pickrow">'+
        '<div class="pickrow-head">'+
          '<div class="pickrow-main" data-action="toggleex" data-id="'+e.id+'"><div class="n">'+esc(e.name)+'</div><div class="c">'+esc(e.cat)+' &middot; '+(isOpen?'&#9650; hide preview':'&#9660; preview')+'</div></div>'+
          '<button data-action="addex" data-id="'+e.id+'">Add</button>'+
        '</div>'+
        (isOpen&&!e.pose?('<div class="pickpreview"><p class="cue">'+esc(e.cue)+'</p></div>'):
         isOpen?('<div class="pickpreview"><div class="preview-figs"><div class="pf">'+
          (rigFor(e.id)?rigSVG(e.id,0.5):figureSVG(e.pose,false,equipFor(e.id)))+'</div><span class="arrow">'+
          (rigFor(e.id)&&rigFor(e.id).front?'':'&rarr;')+'</span><div class="pf">'+
          (rigFor(e.id)&&rigFor(e.id).front?rigFrontSVG(e.id,0.5):(rigFor(e.id)?rigSVG(e.id,0):figureSVG(e.pose,true,equipFor(e.id))))+'</div></div><p class="cue">'+esc(e.cue)+'</p></div>'):'')+
      '</div>';
    }).join('');
    return '<div class="pickgroup"><div class="pickgroup-title">'+esc(area)+'</div>'+rowsHtml+'</div>';
  }).join('') || '<p class="note" style="margin-top:0;">No matches.</p>';
}

function render(){
  syncUi();
  var app=document.getElementById('app');
  if(!app) return;
  // Replacing innerHTML throws away whatever field was being typed into. Note
  // what had focus and where the caret was, and put it back afterwards, so a
  // save landing mid-keystroke cannot interrupt typing.
  var act=document.activeElement, keep=null;
  if(act && act.id && app.contains(act) && /^(INPUT|TEXTAREA|SELECT)$/.test(act.tagName)){
    keep={id:act.id, start:null, end:null};
    try{ keep.start=act.selectionStart; keep.end=act.selectionEnd; }catch(err){}
  }
  // Nor must it throw away what was typed but not yet read: a field whose value
  // is not the one it was drawn with is put back, unless a tap just used it.
  var typed={};
  [].forEach.call(app.querySelectorAll('input[id],textarea[id],select[id]'),function(el){
    if(clearOnRender[el.id]) return;
    // A select drawn with no option marked shows its first one.
    var dflt=-1; [].forEach.call(el.options||[],function(o,i){ if(o.defaultSelected) dflt=i; });
    var dirty=el.tagName==='SELECT'?el.selectedIndex!==(dflt<0&&el.options.length?0:dflt)
      :(el.type==='checkbox'||el.type==='radio')?el.checked!==el.defaultChecked:el.value!==el.defaultValue;
    if(dirty) typed[el.id]={tag:el.tagName, type:el.type, value:el.value, checked:el.checked};
  });
  clearOnRender={};
  app.innerHTML=bodyContent();
  Object.keys(typed).forEach(function(id){
    var el=document.getElementById(id), was=typed[id];
    if(!el || el.tagName!==was.tag || el.type!==was.type) return;
    if(el.type==='checkbox'||el.type==='radio') el.checked=was.checked;
    else if(el.tagName!=='SELECT' || [].some.call(el.options,function(o){ return o.value===was.value; })) el.value=was.value;
  });
  if(keep){
    var back=document.getElementById(keep.id);
    if(back){
      try{
        back.focus({preventScroll:true});
        if(keep.start!==null && keep.start!==undefined) back.setSelectionRange(keep.start,keep.end);
      }catch(err){}
    }
  }
  stopPoseLoop();
  if(viewingSession && state.activeSession && !addingExercise && state.activeSession.exIds.length){ startPoseLoop(); }
}

function onClick(e){
  var t=e.target.closest('[data-action]');
  if(!t) return;
  var action=t.getAttribute('data-action');
  var today=ensureDay(activeDate());
  var uiOnly=false;

  // Controls whose value onChange reads must not be re-rendered on click: the
  // click handler runs first, and replacing the DOM detaches the element before
  // its change event can reach the document, so the change was silently lost.
  if(action==='planday'||action==='planslot'||action==='prepopt') return;
  // Until we know where data lives, a tap would be applied to state that is
  // about to be replaced by the store. Reading and moving around is fine.
  var UI_ONLY_WHILE_LOADING={tab:1,prevslide:1,nextslide:1,toggleex:1,openpicker:1,
    closepicker:1,prange:1,cancelsession:1,resumesession:1,dismissundo:1};
  // A store that failed to answer is held off the same way, and Retry is the
  // one thing that can move it on.
  if(action==='retryload'){ if(dbState==='error'){ dbState='loading'; render(); dbBoot(); } return; }
  if((dbState==='loading'||dbState==='error') && !UI_ONLY_WHILE_LOADING[action]) return;
  if(action==='tab'){ tab=t.getAttribute('data-tab'); viewingSession=false; addingExercise=false; render(); return; }
  else if(action==='today'){ setLogDate(null); tab='today'; render(); return; }
  else if(action==='pickday'){ setLogDate(t.getAttribute('data-k')); tab='today'; render(); return; }
  else if(action==='delsauna'){ if(!removeSauna(t.getAttribute('data-id'))) { uiOnly=true; } swipeOpen=null; }
  else if(action==='dellog'){ if(!removeWorkoutLog(t.getAttribute('data-id'))) { uiOnly=true; } swipeOpen=null; }
  else if(action==='undo'){ applyUndo(); swipeOpen=null; }
  else if(action==='dismissundo'){ clearUndo(); uiOnly=true; }
  else if(action==='prange'){ progRange=parseInt(t.getAttribute('data-n'),10)||14; uiOnly=true; }
  else if(action==='toggleex'){ var id0=t.getAttribute('data-id'); expanded[id0]=!expanded[id0]; uiOnly=true; }
  else if(action==='cancelsession'){ viewingSession=false; addingExercise=false; uiOnly=true; }
  else if(action==='resumesession'){ viewingSession=true; uiOnly=true; }
  else if(action==='startworkout'){ startWorkout(t.getAttribute('data-id')); }
  else if(action==='discardsession'){ discardSession(); }
  else if(action==='finishworkout'){ finishWorkout(); }
  else if(action==='logset'){ logSet(t.getAttribute('data-ex'), t.getAttribute('data-type')); }
  else if(action==='undoset'){
    var exU=t.getAttribute('data-ex'), bU=supersetBox(t.getAttribute('data-ss')||'');
    undoSet(exU);
    // On a superset slide the set came from a round: take the member out of
    // the latest round that has it, and a round left with nobody is no round.
    if(bU && bU.rounds>0){
      var rl=roundLogOf(bU);
      for(var r=rl.length-1;r>=0;r--){
        var at=rl[r].indexOf(exU); if(at<0) continue;
        rl[r].splice(at,1); if(!rl[r].length){ rl.splice(r,1); bU.rounds--; }
        break;
      }
    }
  }
  else if(action==='undoround'){
    var bR=supersetBox(t.getAttribute('data-ss'));
    if(bR && bR.rounds>0){ (roundLogOf(bR).pop()||[]).forEach(undoSet); bR.rounds--; }
  }
  else if(action==='ssadd'){
    var ssA=t.getAttribute('data-ss'), pick=document.getElementById('ss-pick-'+ssA);
    var chosen=pick?pick.value:'';
    if(!chosen){ uiOnly=true; }
    else {
      if(!state.activeSession.supersets) state.activeSession.supersets={};
      var box=supersetBox(ssA)||(state.activeSession.supersets[ssA]={ex:[], rounds:0});
      // Twice in one round would give two inputs the same id, and the second
      // would never be read.
      if(box.ex.indexOf(chosen)<0) box.ex.push(chosen);
      consumed(['ss-pick-'+ssA]);
    }
  }
  else if(action==='ssdel'){
    var ssD=t.getAttribute('data-ss'), gone=t.getAttribute('data-ex');
    var b2=supersetBox(ssD);
    // Sets already logged stay where they are: they belong to the exercise,
    // not to the round it happened to be done in.
    if(b2) b2.ex=b2.ex.filter(function(x){ return x!==gone; });
  }
  else if(action==='loground'){
    // One round is one set of each member. A row left empty is skipped rather
    // than refused: half a round logged beats nothing logged.
    var ssL=t.getAttribute('data-ss'), b3=supersetBox(ssL), got=[];
    supersetMembers(ssL).forEach(function(m){
      var d=exDef(m); if(!d) return;
      var before=(state.activeSession.logs[m]||[]).length;
      logSet(m,d.type);
      if((state.activeSession.logs[m]||[]).length>before) got.push(m);
    });
    // A round nobody filled in is not a round.
    if(got.length && b3){ roundLogOf(b3).push(got); b3.rounds=(b3.rounds||0)+1; }
  }
  else if(action==='prevslide'){ if(slide>0) slide--; uiOnly=true; }
  else if(action==='nextslide'){ if(state.activeSession && slide<state.activeSession.exIds.length-1) slide++; uiOnly=true; }
  // Skip moves on and nothing else: on the last slide there is nowhere to go,
  // and ending the session there is Finish's job, not a skip's.
  else if(action==='skipex'){
    if(state.activeSession && slide<state.activeSession.exIds.length-1) slide++;
    uiOnly=true;
  }
  else if(action==='openpicker'){ addingExercise=true; exSearch=''; uiOnly=true; }
  else if(action==='closepicker'){ addingExercise=false; uiOnly=true; }
  else if(action==='addex'){
    var addId=addExToSession(t.getAttribute('data-id')); addingExercise=false;
    // Not the last slide: the cool-down sits there now, so "last" would land
    // on the cool-down instead of the exercise that was just added.
    var ai=addId?state.activeSession.exIds.indexOf(addId):-1;
    slide=ai>-1?ai:state.activeSession.exIds.length-1;
  }
  else if(action==='removeex'){ removeExFromSession(t.getAttribute('data-id')); }
  else if(action==='water'){
    var d=parseInt(t.getAttribute('data-d'),10); var prev=today.water;
    today.water=Math.max(0,today.water+d); if(today.water>0) today.touched=true;
    if(d>0 && prev<state.waterTarget) addXp(XP_PER_WATER);
    if(d<0 && prev<=state.waterTarget && prev>0) addXp(-XP_PER_WATER);
  }
  else if(action==='addstint'){
    if(!readStint()) return;   // nothing typed, nothing to add
    uiOnly=true;
  }
  else if(action==='delstint'){
    saunaDraft.splice(parseInt(t.getAttribute('data-i'),10),1); uiOnly=true;
  }
  else if(action==='logsauna'){
    // Whatever is still in the row counts as the last stint, so a single-stint
    // session is one tap and never needs Add first.
    readStint();
    if(!saunaDraft.length) return;
    var stints=saunaDraft.slice();
    state.saunaSessions.push({id:'sa'+Date.now(),date:activeDate(),
      mins:stints.reduce(function(a,st){return a+st.mins;},0),
      temp:saunaTemp===''?null:parseFloat(saunaTemp),
      position:stints[0].position, stints:stints});
    saunaDraft=[]; saunaTemp=''; consumed(['sauna-temp']);
    today.touched=true; addXp(XP_SAUNA);   // XP is per session, not per stint
  }
  else if(action==='workout'){
    var wt=t.getAttribute('data-type');
    // Each flag gives back its own XP as it is cleared, or flipping between
    // Rest and a workout paid out every time. A day with a session logged
    // stays trained: the session is removed on Progress, which also takes the
    // day with it. Its type can still change.
    if(today.workout.done && today.workout.type===wt){
      if(dayHasLog(activeDate())) return;
      today.workout.done=false; today.workout.type=null; addXp(-XP_WORKOUT); }
    else { if(!today.workout.done) addXp(XP_WORKOUT); if(today.rest) addXp(-XP_REST); today.workout.done=true; today.workout.type=wt; today.rest=false; }
    today.touched=true;
  }
  else if(action==='rest'){
    if(today.rest){ today.rest=false; addXp(-XP_REST); }
    else {
      if(dayHasLog(activeDate())) return;
      if(today.workout.done) addXp(-XP_WORKOUT);
      today.rest=true; today.workout.done=false; today.workout.type=null; addXp(XP_REST); }
    today.touched=true;
  }
  else if(action==='alcohol'||action==='smoking'||action==='weed'){
    var dd=parseInt(t.getAttribute('data-d'),10); today[action]=Math.max(0,today[action]+dd); today.touched=true;
  }
  else if(action==='addlib'){
    var titleEl=document.getElementById('lib-title'); var tagEl=document.getElementById('lib-tag'); var notesEl=document.getElementById('lib-notes');
    var title=(titleEl.value||'').trim(); if(!title) return;
    state.library.push({id:'l'+Date.now(),title:title,tag:tagEl.value,notes:(notesEl.value||'').trim()});
    consumed(['lib-title','lib-tag','lib-notes']);
  }
  else if(action==='dellib'){
    var libid=t.getAttribute('data-id'), li=-1;
    state.library.forEach(function(x,k){ if(x.id===libid) li=k; });
    if(li<0) return;
    var libGone=state.library.splice(li,1)[0];
    parkUndo({kind:'lib',item:libGone,pos:li,label:libGone.title});
  }
  else if(action==='addrecipe'){
    var rt=document.getElementById('rec-title'); var ri=document.getElementById('rec-ing'); var rn=document.getElementById('rec-inst');
    var title2=(rt.value||'').trim(); if(!title2) return;
    var ings=(ri.value||'').split('\n').map(function(x){return x.trim();}).filter(Boolean);
    var rp=parseInt((document.getElementById('rec-portions')||{}).value,10);
    if(!(rp>0)) rp=1;
    state.recipes.push({id:'r'+Date.now(),title:title2,tag:'Recipe',ingredients:ings,base:rp,portions:rp,
      instructions:(rn.value||'').trim()});
    consumed(['rec-title','rec-ing','rec-inst','rec-portions']);
  }
  else if(action==='portions'){
    var pid=t.getAttribute('data-id'), pd=parseInt(t.getAttribute('data-d'),10);
    var pr=state.recipes.filter(function(x){return x.id===pid;})[0];
    if(pr){ pr.portions = pd===0 ? recipeBase(pr) : Math.max(1, Math.min(20, recipePortions(pr)+pd)); }
  }
  else if(action==='delrecipe'){
    var rid=t.getAttribute('data-id'), ri2=-1;
    state.recipes.forEach(function(x,k){ if(x.id===rid) ri2=k; });
    if(ri2<0) return;
    var recGone=state.recipes.splice(ri2,1)[0];
    // Otherwise the week keeps showing meals whose recipe is gone, and the
    // shopping list silently stops counting them while they still look planned.
    var planGone=state.plan.filter(function(e){ return e.recipeId===rid; });
    state.plan=state.plan.filter(function(e){ return e.recipeId!==rid; });
    parkUndo({kind:'recipe',item:recGone,pos:ri2,plan:planGone,label:recGone.title});
  }
  else if(action==='shopcheck'){ var item=t.getAttribute('data-item'); var sidx=state.shoppingChecked.indexOf(item); if(sidx>-1) state.shoppingChecked.splice(sidx,1); else state.shoppingChecked.push(item); }
  else if(action==='addextra'){
    var box=document.getElementById('shop-add');
    var txt=((box?box.value:shopDraft)||'').trim();
    if(!txt) return;
    state.shopExtras.push({id:'x'+Date.now(), text:txt});
    shopDraft=''; consumed(['shop-add']);
  }
  else if(action==='delextra'){
    var xid=t.getAttribute('data-id');
    state.shopExtras=state.shopExtras.filter(function(x){return x.id!==xid;});
    state.shoppingChecked=state.shoppingChecked.filter(function(k){return k!=='x|'+xid;});
  }
  else if(action==='addmeal'){
    var rid2=t.getAttribute('data-id'), pick=planPick[rid2]||{}, days=planDates();
    // A tab left open overnight holds a picked date that has rolled out of the
    // window. Planning onto it would put the meal somewhere nothing can show.
    var when=days.indexOf(pick.date)>-1?pick.date:days[0];
    addPlanEntry(rid2, when, pick.slot||'dinner');
  }
  else if(action==='delmeal'){
    var mealId=t.getAttribute('data-id'), mealGone=state.plan.filter(function(e){ return e.id===mealId; })[0];
    if(!mealGone) return;
    removePlanEntry(mealId);

function onChange(e){

  if(action==='logdate'){ setLogDate(t.value); render(); return; }
  else if(action==='prepopt'){
    var pex=t.getAttribute('data-ex');
    /* The number is minutes for every option but one: for light sets it is
       reps. So the draft only has to go when that boundary is crossed. Clearing
       on any change of kind was too much: a bike and a stretch differ in their
       second field, not in what the number means, and minutes typed before
       picking would be wiped. */
    if((prepLevelKind(prepPick[pex]||'')==='load')!==(prepLevelKind(t.value)==='load'))

  // change applied now would be thrown away rather than saved.

  // save and nothing to redraw: it is remembered until Add is pressed.
  else if(action==='planday'){ var id=t.getAttribute('data-id');

  else if(action==='planslot'){ var id2=t.getAttribute('data-id');

}

}

function onKeydown(e){
  if(e.key!=='Enter' || !e.target || e.target.id!=='shop-add') return;

var swipeX=null, swipeId=null;

    // Remove button is never sitting under your thumb by accident.

  }

// Inline script text ends at the first closing script tag, and an HTML comment
// opener followed later by an opening script tag makes the parser swallow the
// real closing tag. User text in the JSON can hold either, so every < in it
// goes out as \u003c, which parses back to the same string. The code gets the
// same two sequences with the < written as \x3C, which JS strings and regexes
// read as the same text.
// build-publish.js reads both helpers out of here, so the two never drift.
function scriptSafe(s){ return s.replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029'); }
